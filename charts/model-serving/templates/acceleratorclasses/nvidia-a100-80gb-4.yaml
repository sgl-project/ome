apiVersion: ome.io/v1beta1
kind: AcceleratorClass
metadata:
  name: nvidia-a100-80gb-4
spec:
  vendor: nvidia
  family: ampere
  model: a100
  
  discovery:
    nodeSelector:
      nvidia.com/gpu: "true"
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: beta.kubernetes.io/instance-type
                  operator: In
                  values:
                    - BM.GPU.A100-v2.8
  
  capabilities:
    computeCapability: "4.0"
  resources:
    - name: cpu
      quantity: "64"
    - name: memory
      quantity: "840Gi"
    - name: nvidia.com/gpu
      quantity: "4"