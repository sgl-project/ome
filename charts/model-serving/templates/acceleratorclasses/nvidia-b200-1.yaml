apiVersion: ome.io/v1beta1
kind: AcceleratorClass
metadata:
  name: nvidia-b200-1
spec:
  vendor: nvidia
  family: blackwell
  model: b200

  discovery:
    nodeSelector:
      nvidia.com/gpu: "true"
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: beta.kubernetes.io/instance-type
                  operator: In
                  values:
                    - BM.GPU.B200.8

  capabilities:
    computeCapability: "1.0"
  resources:
    - name: cpu
      quantity: "16"
    - name: memory
      quantity: "420Gi"
    - name: nvidia.com/gpu
      quantity: "1"
