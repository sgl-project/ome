apiVersion: ome.io/v1beta1
kind: AcceleratorClass
metadata:
  name: nvidia-h100-8
spec:
  vendor: nvidia
  family: hopper
  model: h100
  
  discovery:
    nodeSelector:
      nvidia.com/gpu: "true"
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: beta.kubernetes.io/instance-type
                  operator: In
                  values:
                    - BM.GPU.H100.8
                    - BM.GPU.H100-NC.8
  
  capabilities:
    computeCapability: "8.0"
  resources:
    - name: cpu
      quantity: "112"
    - name: memory
      quantity: "1792Gi"
    - name: nvidia.com/gpu
      quantity: "8"