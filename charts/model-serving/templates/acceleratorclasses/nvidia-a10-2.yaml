apiVersion: ome.io/v1beta1
kind: AcceleratorClass
metadata:
  name: nvidia-a10-2
spec:
  vendor: nvidia
  family: ampere
  model: a10
  
  discovery:
    nodeSelector:
      nvidia.com/gpu: "true"
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: beta.kubernetes.io/instance-type
                  operator: In
                  values:
                    - BM.GPU.A10.4
  
  capabilities:
    computeCapability: "2.0"
  resources:
    - name: cpu
      quantity: "32"
    - name: memory
      quantity: "420Gi"
    - name: nvidia.com/gpu
      quantity: "2"