apiVersion: ome.io/v1beta1
kind: DedicatedAIClusterProfile
metadata:
  name: h200-x8
spec:
  count: 1
  resources:
    limits:
      cpu: 112
      memory: 2688Gi
      nvidia.com/gpu: 8
    requests:
      cpu: 112
      memory: 2688Gi
      nvidia.com/gpu: 8
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: beta.kubernetes.io/instance-type
                operator: In
                values:
                  - BM.GPU.H200.8
                  - BM.GPU.H200-NC.8