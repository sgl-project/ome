apiVersion: ome.io/v1beta1
kind: DedicatedAIClusterProfile
metadata:
  name: h100-x2
spec:
  count: 1
  resources:
    limits:
      cpu: 28
      memory: 448Gi
      nvidia.com/gpu: 2
    requests:
      cpu: 28
      memory: 448Gi
      nvidia.com/gpu: 2
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: beta.kubernetes.io/instance-type
                operator: In
                values:
                  - BM.GPU.H100.8
                  - BM.GPU.H100-NC.8