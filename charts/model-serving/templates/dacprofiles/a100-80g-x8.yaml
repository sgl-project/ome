apiVersion: ome.io/v1beta1
kind: DedicatedAIClusterProfile
metadata:
  name: a100-80g-x8
spec:
  count: 1
  resources:
    limits:
      cpu: 160
      memory: 1792Gi
      nvidia.com/gpu: 8
    requests:
      cpu: 160
      memory: 1792Gi
      nvidia.com/gpu: 8
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: beta.kubernetes.io/instance-type
                operator: In
                values:
                  - BM.GPU.A100-v2.8