apiVersion: ome.io/v1beta1
kind: DedicatedAIClusterProfile
metadata:
  name: a100-40g-x4
spec:
  count: 1
  resources:
    limits:
      cpu: 32
      memory: 896Gi
      nvidia.com/gpu: 4
    requests:
      cpu: 32
      memory: 896Gi
      nvidia.com/gpu: 4
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: beta.kubernetes.io/instance-type
                operator: In
                values:
                  - BM.GPU.B4.8
                  - BM.GPU4.8