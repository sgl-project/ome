apiVersion: ome.io/v1beta1
kind: DedicatedAIClusterProfile
metadata:
  name: a100-80g-x2
spec:
  count: 1
  resources:
    limits:
      cpu: 32
      memory: 448Gi
      nvidia.com/gpu: 2
    requests:
      cpu: 32
      memory: 448Gi
      nvidia.com/gpu: 2
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: beta.kubernetes.io/instance-type
                operator: In
                values:
                  - BM.GPU.A100-v2.8