apiVersion: ome.io/v1beta1
kind: DedicatedAIClusterProfile
metadata:
  name: a10-x1
spec:
  count: 1
  resources:
    limits:
      cpu: 20
      memory: 224Gi
      nvidia.com/gpu: 1
    requests:
      cpu: 20
      memory: 224Gi
      nvidia.com/gpu: 1
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: beta.kubernetes.io/instance-type
                operator: In
                values:
                  - BM.GPU.A10.4
