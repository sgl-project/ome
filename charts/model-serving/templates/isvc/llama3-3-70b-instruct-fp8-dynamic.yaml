{{- if .Values.llama_3_3_70b_instruct_fp8_dynamic.enabled }}
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata:
  name: llama-3-3-70b-instruct-fp8-dynamic
  namespace: llama-3-3-70b-instruct-fp8-dynamic
spec:
  predictor:
    {{- with .Values.llama_3_3_70b_instruct_fp8_dynamic.annotations }}
    annotations: {{ toYaml . | nindent 6 }}
    {{- end }}
    model:
      {{- if .Values.llama_3_3_70b_instruct_fp8_dynamic.useSmallRuntime }}
      runtime: srt-llama-3-3-70b-instruct-fp8-dynamic-small
      {{- end }}
      baseModel: llama-3-3-70b-instruct-fp8-dynamic
      protocolVersion: openAI
    minReplicas: {{ .Values.llama_3_3_70b_instruct_fp8_dynamic.minReplicas}}
    maxReplicas: {{ .Values.llama_3_3_70b_instruct_fp8_dynamic.maxReplicas}}
    {{- with .Values.llama_3_3_70b_instruct_fp8_dynamic.affinity }}
    affinity: {{ toYaml . | nindent 6 }}
    {{- end }}
    {{- with .Values.llama_3_3_70b_instruct_fp8_dynamic.tolerations }}
    tolerations: {{ toYaml . | nindent 6 }}
    {{- end }}
    {{- with .Values.llama_3_3_70b_instruct_fp8_dynamic.topologySpreadConstraints }}
    topologySpreadConstraints: {{ toYaml . | nindent 6 }}
    {{- end }}
    {{- with .Values.llama_3_3_70b_instruct_fp8_dynamic.volumes }}
    volumes: {{ toYaml . | nindent 6 }}
    {{- end }}
    {{- with .Values.llama_3_3_70b_instruct_fp8_dynamic.scaleMetric }}
    scaleMetric: {{ toYaml . | nindent 6 }}
    {{- end }}

---
apiVersion: v1
kind: Namespace
metadata:
  name: llama-3-3-70b-instruct-fp8-dynamic

{{- end }}
