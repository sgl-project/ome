{{- if .Values.cohere.embed_multilingual_light_03.enabled }}
apiVersion: ome.io/v1beta1
kind: "InferenceService"
metadata:
  name: embed-multilingual-light-03
  namespace: embed-multilingual-light-03
spec:
  predictor:
    model:
      runtime: cohere-embed-v3
      baseModel: embed-multilingual-light-03
