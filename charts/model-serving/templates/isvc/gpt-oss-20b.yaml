{{- if .Values.gpt_oss_20b.enabled }}
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata:
  name: gpt-oss-20b
  namespace: gpt-oss-20b
spec:
  acceleratorSelector:
    acceleratorClass: nvidia-h100-1
  engine:
    minReplicas: {{ .Values.gpt_oss_20b.minReplicas}}
    maxReplicas: {{ .Values.gpt_oss_20b.maxReplicas}}
  model:
    apiGroup: ome.io
    kind: ClusterBaseModel
    name: gpt-oss-20b
  runtime:
    apiGroup: ome.io
    kind: ClusterServingRuntime
    name: vllm-gpt-oss-20b
  router:
    minReplicas: {{ .Values.gpt_oss_20b.router.minReplicas}}
    maxReplicas: {{ .Values.gpt_oss_20b.router.maxReplicas}}
---
apiVersion: v1
kind: Namespace
metadata:
  name: gpt-oss-20b
{{- end }}