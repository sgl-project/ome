{{- if index .Values "llama-3-1-405b-instruct-fp8-pp" "enabled" -}}
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata:
  name: llama-3-1-405b-instruct-fp8-pp
  namespace: llama-3-1-405b-instruct-fp8-pp
spec:
  predictor:
    model:
      runtime: vllm-serving-runtime-large-pp
      baseModel: llama-3-1-405b-instruct-fp8
      protocolVersion: openAI
    minReplicas: {{ index .Values "llama-3-1-405b-instruct-fp8-pp" "minReplicas" }}
    maxReplicas: {{ index .Values "llama-3-1-405b-instruct-fp8-pp" "maxReplicas" }}
