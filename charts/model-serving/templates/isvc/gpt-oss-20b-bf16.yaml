{{- if .Values.gpt_oss_20b_bf16.enabled }}
apiVersion: ome.io/v1beta1
kind: InferenceService
metadata:
  name: gpt-oss-20b-bf16
  namespace: gpt-oss-20b-bf16
spec:
  predictor:
    model:
      runtime: srt-gpt-oss-20b
      baseModel: gpt-oss-20b-bf16
