apiVersion: ome.io/v1beta1
kind: ClusterServingRuntime
metadata:
  name: xai-grok-3-mini-rt
spec:
  annotations:
    prometheus.io/port: '3001'
    prometheus.io/scrape: 'true'
    prometheus.io/path: /metrics

  {{- with .Values.xai.commonLabels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.commonTolerations }}
  tolerations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  supportedModelFormats:
    - autoSelect: true
      modelArchitecture: xAiForCausalLM
      modelFormat:
        name: safetensors
        version: "1.0.0"
      modelFramework:
        name: transformer
        version: "1"
      version: "1.0"
  modelSizeRange:
    min: 1T
    max: 2T
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node.kubernetes.io/instance-type
                operator: In
                values:
                  - BM.GPU.H100.8
                  - BM.GPU.H200.8
                  - BM.GPU.H200-NC.8
                  - BM.GPU.H100-NC.8
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: node.kubernetes.io/instance-type
                operator: In
                values:
                  - BM.GPU.H100.8
                  - BM.GPU.H200.8
                  - BM.GPU.H200-NC.8
                  - BM.GPU.H100-NC.8
  schedulerName: {{ .Values.commonSchedulerName }}
  volumes:
    - name: shared-memory
      emptyDir:
        medium: Memory
        sizeLimit: 1Gi
    - name: model-empty-dir
      emptyDir:
        medium: Memory
    {{- if or (eq .Values.oci.realm "oc5") (eq .Values.oci.realm "oc6") }}
    - name: etc-pki
      hostPath:
        path: /etc/pki
        type: Directory
    {{- end }}
  containers:
    - name: ome-container
      image: "{{ .Values.xai.grokImage.repository }}:{{ .Values.xai.grokImage.tag }}"
      ports:
        - containerPort: 8080
          name: http1
      env:
        - name: QUANTIZATION
          value: "fp8"
        - name: KEY_SOURCE
          value: "ORACLE"
        - name: KEY_ID
          value: "{{ .Values.xai.keyId }}"
        - name: OCI_REGION
          value: "{{ .Values.xai.ociRegion }}"
        - name: SIDECAR_MODEL
          value: "grok-3-mini"
        - name: TP
          value: "8"
      resources:
        limits:
          nvidia.com/gpu: "8"
        requests:
          cpu: 32
          memory: 240Gi
          nvidia.com/gpu: "8"
      volumeMounts:
        - mountPath: /dev/shm
          name: shared-memory
        - mountPath: /opt/model
          name: model-empty-dir
      readinessProbe:
        {{- toYaml .Values.xai.readinessProbe | nindent 8 }}
      livenessProbe:
        {{- toYaml .Values.xai.livenessProbe | nindent 8 }}
      startupProbe:
        {{- toYaml .Values.xai.startupProbe | nindent 8 }}