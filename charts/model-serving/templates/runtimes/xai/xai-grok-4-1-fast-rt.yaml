apiVersion: ome.io/v1beta1
kind: ClusterServingRuntime
metadata:
  name: xai-grok-4-1-fast-rt
spec:
  annotations:
    prometheus.io/port: '3001'
    prometheus.io/scrape: 'true'
    prometheus.io/path: /metrics

  {{- with .Values.xai.commonLabels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.commonTolerations }}
  tolerations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  supportedModelFormats:
    - autoSelect: true
      modelArchitecture: xAiForCausalLM
      modelFormat:
        name: safetensors
        version: "1.0.0"
      modelFramework:
        name: transformer
        version: "1"
      version: "1.0"
  modelSizeRange:
    min: 1T
    max: 2T
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node.kubernetes.io/instance-type
                operator: In
                values:
                  - BM.GPU.H100.8
                  - BM.GPU.H200.8
                  - BM.GPU.H200-NC.8
                  - BM.GPU.H100-NC.8
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: node.kubernetes.io/instance-type
                operator: In
                values:
                  - BM.GPU.H100.8
                  - BM.GPU.H200.8
                  - BM.GPU.H200-NC.8
                  - BM.GPU.H100-NC.8
  schedulerName: {{ .Values.commonSchedulerName }}
  volumes:
    - name: shared-memory
      emptyDir:
        medium: Memory
        sizeLimit: 1Gi
    - name: model-empty-dir
      emptyDir:
        medium: Memory
    {{- if or (eq .Values.oci.realm "oc5") (eq .Values.oci.realm "oc6") }}
    - name: etc-pki
      hostPath:
        path: /etc/pki
        type: Directory
    {{- end }}
  containers:
    - name: ome-container
      image: "{{ .Values.xai.grokImage.repository }}:{{ .Values.xai.grokImage.tag }}"
      ports:
        - containerPort: 8080
          name: http1
      env:
        - name: QUANTIZATION
          value: "fp8"
        - name: KEY_SOURCE
          value: "ORACLE"
        - name: CONTAINER_KEY_ID
          value: "{{ .Values.xai.keyId }}"
        - name: OCI_REGION
          value: "{{ .Values.xai.ociRegion }}"
        - name: SIDECAR_MODEL
          value: "grok-4-1-fast-non-reasoning"
        - name: TP
          value: "8"
        - name: NODE_RANK
          value: "0"
        - name: NNODES
          value: "1"
        - name: DIST_INIT_ADDR
          value: "localhost:29005"
        - name: XAI_CLUSTER
          value: "max"
        - name: SPECULATIVE_ALGORITHM
          value: "EAGLE"
        - name: MEM_FRACTION_STATIC
          value: "0.73"
        - name: CONTEXT_LENGTH
          value: "262144"
        - name: HOST
          value: "0.0.0.0"
        - name: REST_PORT
          value: "8080"
        - name: METRICS_PORT
          value: "3001"
        - name: GRAMMAR_BACKEND
          value: "xai_xgrammar"
        - name: IMAGE_TOKENIZER
          value: "grok2v-staging"
        - name: TOKENIZER_PATH
          value: "/opt/sglang-private/dummy_grok3/v6.xtok.json"
        {{- if or (eq .Values.oci.realm "oc5") (eq .Values.oci.realm "oc6") }}
        - name: OCI_REGION_METADATA
          value: {{ .Values.oci.ociRegionMetadata }}
        - name: REQUESTS_CA_BUNDLE
          value: {{ .Values.oci.requestsCaBundle }}
        {{- end }}
      resources:
        limits:
          nvidia.com/gpu: "8"
        requests:
          cpu: 32
          memory: 240Gi
          nvidia.com/gpu: "8"
      volumeMounts:
        - mountPath: /dev/shm
          name: shared-memory
        - mountPath: /opt/model
          name: model-empty-dir
        {{- if or (eq .Values.oci.realm "oc5") (eq .Values.oci.realm "oc6") }}
        - mountPath: /etc/pki
          name: etc-pki
          readOnly: true
        {{- end }}
      readinessProbe:
        {{- toYaml .Values.grok_4_1_fast_self_hosted.readinessProbe | nindent 8 }}
      livenessProbe:
        {{- toYaml .Values.xai.livenessProbe | nindent 8 }}
      startupProbe:
        {{- toYaml .Values.xai.startupProbe | nindent 8 }}
  engineConfig:
    annotations:
      prometheus.io/port: '3001'
      prometheus.io/scrape: 'true'
      prometheus.io/path: /metrics
    {{- with .Values.xai.commonLabels }}
    labels:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .Values.commonTolerations }}
    tolerations:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    volumes:
      - name: shared-memory
        emptyDir:
          medium: Memory
          sizeLimit: 1Gi
      - name: model-empty-dir
        emptyDir:
          medium: Memory
      {{- if or (eq .Values.oci.realm "oc5") (eq .Values.oci.realm "oc6") }}
      - name: etc-pki
        hostPath:
          path: /etc/pki
          type: Directory
      {{- end }}
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node.kubernetes.io/instance-type
                  operator: In
                  values:
                    - BM.GPU.H100.8
                    - BM.GPU.H200.8
                    - BM.GPU.H200-NC.8
                    - BM.GPU.H100-NC.8
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: node.kubernetes.io/instance-type
                  operator: In
                  values:
                    - BM.GPU.H100.8
                    - BM.GPU.H200.8
                    - BM.GPU.H200-NC.8
                    - BM.GPU.H100-NC.8
    schedulerName: {{ .Values.commonSchedulerName }}
    runner:
      name: ome-container
      image: "{{ .Values.xai.grokImage.repository }}:{{ .Values.xai.grokImage.tag }}"
      ports:
        - containerPort: 8080
          name: http1
      env:
        - name: QUANTIZATION
          value: "fp8"
        - name: KEY_SOURCE
          value: "ORACLE"
        - name: CONTAINER_KEY_ID
          value: "{{ .Values.xai.keyId }}"
        - name: OCI_REGION
          value: "{{ .Values.xai.ociRegion }}"
        - name: SIDECAR_MODEL
          value: "grok-4-1-fast-non-reasoning"
        - name: TP
          value: "8"
        - name: NODE_RANK
          value: "0"
        - name: NNODES
          value: "1"
        - name: DIST_INIT_ADDR
          value: "localhost:29005"
        - name: XAI_CLUSTER
          value: "max"
        - name: SPECULATIVE_ALGORITHM
          value: "EAGLE"
        - name: MEM_FRACTION_STATIC
          value: "0.73"
        - name: CONTEXT_LENGTH
          value: "262144"
        - name: HOST
          value: "0.0.0.0"
        - name: REST_PORT
          value: "8080"
        - name: METRICS_PORT
          value: "3001"
        - name: GRAMMAR_BACKEND
          value: "xai_xgrammar"
        - name: IMAGE_TOKENIZER
          value: "grok2v-staging"
        - name: TOKENIZER_PATH
          value: "/opt/sglang-private/dummy_grok3/v6.xtok.json"
        - name: MODEL_PATH
          value: "/mnt/data/models/xai/grok_4_1_fast_sctx_1116/weights" 
        - name: IMAGE_TOKENIZER_PATH
          value: "/mnt/data/models/xai/grok_4_1_fast_sctx_1116/extracted_vision.bin" 
        {{- if or (eq .Values.oci.realm "oc5") (eq .Values.oci.realm "oc6") }}
        - name: OCI_REGION_METADATA
          value: {{ .Values.oci.ociRegionMetadata }}
        - name: REQUESTS_CA_BUNDLE
          value: {{ .Values.oci.requestsCaBundle }}
        {{- end }}
      resources:
        limits:
          nvidia.com/gpu: "8"
        requests:
          cpu: 32
          memory: 240Gi
          nvidia.com/gpu: "8"
      volumeMounts:
        - mountPath: /dev/shm
          name: shared-memory
        - mountPath: /opt/model
          name: model-empty-dir
        {{- if or (eq .Values.oci.realm "oc5") (eq .Values.oci.realm "oc6") }}
        - mountPath: /etc/pki
          name: etc-pki
          readOnly: true
        {{- end }}
      readinessProbe:
        {{- toYaml .Values.grok_4_1_fast_self_hosted.readinessProbe | nindent 8 }}
      livenessProbe:
        {{- toYaml .Values.xai.livenessProbe | nindent 8 }}
      startupProbe:
        {{- toYaml .Values.xai.startupProbe | nindent 8 }}