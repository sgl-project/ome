apiVersion: ome.io/v1beta1
kind: ClusterServingRuntime
metadata:
  name: xai-grok-4-rt
spec:
  disabled: {{ not .Values.grok_4_self_hosted.enableH100 }}
  {{- if or .Values.commonAnnotations .Values.grok_4_self_hosted.annotations }}
  annotations:
    {{- if .Values.commonAnnotations }}
    {{ toYaml .Values.commonAnnotations | nindent 6 }}
    {{- end }}
    {{- if .Values.grok_4_self_hosted.annotations }}
    {{ toYaml .Values.grok_4_self_hosted.annotations | nindent 6 }}
    {{- end }}
  {{- end }}
  labels:
    logging-forward: enabled
    {{- if .Values.xai.commonLabels }}
    {{ toYaml .Values.xai.commonLabels | nindent 4 }}
    {{- end }}
    {{- if .Values.grok_4_self_hosted.labels }}
    {{ toYaml .Values.grok_4_self_hosted.labels | nindent 6 }}
    {{- end }}
  {{- if or .Values.commonTolerations .Values.grok_4_self_hosted.tolerations }}
  tolerations:
    {{- if .Values.commonTolerations }}
    {{ toYaml .Values.commonTolerations | nindent 6 }}
    {{- end }}
    {{- if .Values.grok_4_self_hosted.tolerations }}
    {{ toYaml .Values.grok_4_self_hosted.tolerations | nindent 6 }}
    {{- end }}
  {{- end }}
  dnsPolicy: ClusterFirstWithHostNet
  hostNetwork: true
  nodeSelector:
    # TODO: uncomment the following two lines once rdma related labels are added
    # oci.oraclecloud.com/rdma.authenticated: "16"
    # oci.oraclecloud.com/rdma.mlx_issues: "0"
    oke.oraclecloud.com/pool.mode: cluster-network
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: node.kubernetes.io/instance-type
            operator: In
            values:
            - BM.GPU.H100.8
  modelSizeRange:
    min: 1T
    max: 2T
  supportedModelFormats:
  - modelFormat:
      name: safetensors
      version: "1.0.0"
    version: "1.0.0"
    modelFramework:
      name: transformer
      version: "1"
    modelArchitecture: xAiForCausalLM
    autoSelect: true
    priority: 1
  volumes:
  - name: dshm
    emptyDir:
      medium: Memory
  - hostPath:
      path: /dev/infiniband
    name: devinf
  {{- if or (eq .Values.oci.realm "oc5") (eq .Values.oci.realm "oc6") }}
  - name: etc-pki
    hostPath:
      path: /etc/pki
      type: Directory
  {{- end }}
  protocolVersions:
  - openAI
  containers:
  - name: ome-container
    image: {{ .Values.grok_4_self_hosted.image.repository | default .Values.xai.grokImage.repository }}:{{ .Values.grok_4_self_hosted.image.tag | default .Values.xai.grokImage.tag }}
    env:
    - name: NODE_RANK
      value: "0"
    - name: NNODES
      value: "2"
    - name: DIST_INIT_ADDR
      value: "localhost:29005"
    - name: XAI_CLUSTER
      value: "max"
    - name: SPECULATIVE_ALGORITHM
      value: "EAGLE"
    - name: TP
      value: "16"
    - name: QUANTIZATION
      value: "int4_experts"
    - name: MEM_FRACTION_STATIC
      value: "0.83"
    - name: HOST
      value: "0.0.0.0"
    - name: SIDECAR_MODEL
      value: "grok-4"
    - name: REST_PORT
      value: "8080"
    - name: METRICS_PORT
      value: "3001"
    - name: KEY_SOURCE
      value: "ORACLE"
    - name: CONTAINER_KEY_ID
      value: "{{ .Values.xai.keyId }}"
    - name: NCCL_NET_PLUGIN
      value: none
    - name: NCCL_DEBUG
      value: INFO
    - name: NCCL_CROSS_NIC
      value: '2'
    - name: NCCL_SOCKET_NTHREADS
      value: '16'
    - name: NCCL_CUMEM_ENABLE
      value: '0'
    - name: NCCL_IB_SPLIT_DATA_ON_QPS
      value: '0'
    - name: NCCL_IB_QPS_PER_CONNECTION
      value: '16'
    - name: NCCL_IB_GID_INDEX
      value: '3'
    - name: NCCL_IB_HCA
      value: "=mlx5_0,mlx5_1,mlx5_3,mlx5_4,mlx5_5,mlx5_6,mlx5_7,mlx5_8,mlx5_9,mlx5_10,mlx5_12,mlx5_13,mlx5_14,mlx5_15,mlx5_16,mlx5_17"
    - name: NCCL_IB_TC
      value: '41'
    - name: NCCL_IB_SL
      value: '0'
    - name: NCCL_IB_TIMEOUT
      value: '22'
    - name: HCOLL_ENABLE_MCAST_ALL
      value: '0'
    - name: coll_hcoll_enable
      value: '0'
    - name: UCX_TLS
      value: tcp
    - name: UCX_NET_DEVICES
      value: eth0
    - name: RX_QUEUE_LEN
      value: '8192'
    - name: IB_RX_QUEUE_LEN
      value: '8192'
    - name: NCCL_SOCKET_IFNAME
      value: eth0
    - name: NCCL_IGNORE_CPU_AFFINITY
      value: '1'
    - name: GLOO_SOCKET_IFNAME
      value: eth0
    - name: TOKENIZER_PATH
      value: "/opt/sglang-private/dummy_grok3/v6.xtok.json"
    {{- if or (eq .Values.oci.realm "oc5") (eq .Values.oci.realm "oc6") }}
    - name: OCI_REGION_METADATA
      value: {{ .Values.oci.ociRegionMetadata }}
    - name: REQUESTS_CA_BUNDLE
      value: {{ .Values.oci.requestsCaBundle }}
    {{- end }}
    volumeMounts:
    - mountPath: /dev/shm
      name: dshm
    - mountPath: /dev/infiniband
      name: devinf
    {{- if or (eq .Values.oci.realm "oc5") (eq .Values.oci.realm "oc6") }}
    - mountPath: /etc/pki
      name: etc-pki
      readOnly: true
    {{- end }}
    resources:
      requests:
        nvidia.com/gpu: 8
      limits:
        nvidia.com/gpu: 8
    securityContext:
      capabilities:
        add:
        - IPC_LOCK
        - CAP_SYS_ADMIN
      privileged: true
    readinessProbe:
    {{- toYaml .Values.grok_4_self_hosted.readinessProbe | nindent 6 }}
    livenessProbe:
      {{- toYaml .Values.xai.livenessProbe | nindent 6 }}
    startupProbe:
      {{- toYaml .Values.xai.startupProbe | nindent 6 }}
  workers:
    size: 1
    nodeSelector:
      oke.oraclecloud.com/pool.mode: cluster-network
    {{- if or .Values.commonTolerations .Values.grok_4_self_hosted.tolerations }}
    tolerations:
      {{- if .Values.commonTolerations }}
      {{ toYaml .Values.commonTolerations | nindent 8 }}
      {{- end }}
      {{- if .Values.grok_4_self_hosted.tolerations }}
      {{ toYaml .Values.grok_4_self_hosted.tolerations | nindent 8 }}
      {{- end }}
    {{- end }}
    dnsPolicy: ClusterFirstWithHostNet
    hostNetwork: true
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
          - matchExpressions:
            - key: node.kubernetes.io/instance-type
              operator: In
              values:
              - BM.GPU.H100.8
    volumes:
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 15Gi
    - hostPath:
        path: /dev/infiniband
      name: devinf
    {{- if or (eq .Values.oci.realm "oc5") (eq .Values.oci.realm "oc6") }}
    - name: etc-pki
      hostPath:
        path: /etc/pki
        type: Directory
    {{- end }}
    containers:
    - name: ome-container
      image: {{ .Values.grok_4_self_hosted.image.repository | default .Values.xai.grokImage.repository }}:{{ .Values.grok_4_self_hosted.image.tag | default .Values.xai.grokImage.tag }}
      resources:
        limits:
          nvidia.com/gpu: "8"
        requests:
          nvidia.com/gpu: "8"
      env:
      - name: NODE_RANK
        value: "1"
      - name: NNODES
        value: "2"
      - name: XAI_CLUSTER
        value: "max"
      - name: SPECULATIVE_ALGORITHM
        value: "EAGLE"
      - name: TP
        value: "16"
      - name: QUANTIZATION
        value: "int4_experts"
      - name: MEM_FRACTION_STATIC
        value: "0.83"
      - name: HOST
        value: "0.0.0.0"
      - name: SIDECAR_MODEL
        value: "grok-4"
      - name: REST_PORT
        value: "8080"
      - name: METRICS_PORT
        value: "3001"
      - name: KEY_SOURCE
        value: "ORACLE"
      - name: CONTAINER_KEY_ID
        value: "{{ .Values.xai.keyId }}"
      - name: NCCL_NET_PLUGIN
        value: none
      - name: NCCL_DEBUG
        value: INFO
      - name: NCCL_CROSS_NIC
        value: '2'
      - name: NCCL_SOCKET_NTHREADS
        value: '16'
      - name: NCCL_CUMEM_ENABLE
        value: '0'
      - name: NCCL_IB_SPLIT_DATA_ON_QPS
        value: '0'
      - name: NCCL_IB_QPS_PER_CONNECTION
        value: '16'
      - name: NCCL_IB_GID_INDEX
        value: '3'
      - name: NCCL_IB_HCA
        value: "=mlx5_0,mlx5_1,mlx5_3,mlx5_4,mlx5_5,mlx5_6,mlx5_7,mlx5_8,mlx5_9,mlx5_10,mlx5_12,mlx5_13,mlx5_14,mlx5_15,mlx5_16,mlx5_17"
      - name: NCCL_IB_TC
        value: '41'
      - name: NCCL_IB_SL
        value: '0'
      - name: NCCL_IB_TIMEOUT
        value: '22'
      - name: HCOLL_ENABLE_MCAST_ALL
        value: '0'
      - name: coll_hcoll_enable
        value: '0'
      - name: UCX_TLS
        value: tcp
      - name: UCX_NET_DEVICES
        value: eth0
      - name: RX_QUEUE_LEN
        value: '8192'
      - name: IB_RX_QUEUE_LEN
        value: '8192'
      - name: NCCL_SOCKET_IFNAME
        value: eth0
      - name: NCCL_IGNORE_CPU_AFFINITY
        value: '1'
      - name: GLOO_SOCKET_IFNAME
        value: eth0
      - name: TOKENIZER_PATH
        value: "/opt/sglang-private/dummy_grok3/v6.xtok.json"
      - name: DIST_INIT_ADDR
        value: "$(LWS_LEADER_ADDRESS):29005"
      {{- if or (eq .Values.oci.realm "oc5") (eq .Values.oci.realm "oc6") }}
      - name: OCI_REGION_METADATA
        value: {{ .Values.oci.ociRegionMetadata }}
      - name: REQUESTS_CA_BUNDLE
        value: {{ .Values.oci.requestsCaBundle }}
      {{- end }}

      securityContext:
        capabilities:
          add:
          - IPC_LOCK
          - CAP_SYS_ADMIN
        privileged: true
      volumeMounts:
      - mountPath: /dev/shm
        name: dshm
      - mountPath: /dev/infiniband
        name: devinf
      {{- if or (eq .Values.oci.realm "oc5") (eq .Values.oci.realm "oc6") }}
      - mountPath: /etc/pki
        name: etc-pki
        readOnly: true
      {{- end }}