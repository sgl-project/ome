apiVersion: ome.io/v1beta1
kind: ClusterServingRuntime
metadata:
  name: cohere-rerank-v4-0-pro
spec:
  acceleratorRequirements:
    acceleratorClasses:
      - nvidia-a100-80gb-1
      - nvidia-a100-40gb-1
      - nvidia-h100-1
      - nvidia-h200-1
      - nvidia-a10-1
  {{- with .Values.cohere.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.cohere.commonLabels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.commonTolerations }}
  tolerations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  supportedModelFormats:
    - autoSelect: false
      modelArchitecture: CohereForCausalLM
      version: "4.0"
      modelFormat:
        name: onnx
        version: '1'
      modelFramework:
        name: onnxruntime
        version: '1'
      acceleratorConfig:
        nvidia-a100-80gb-1:
          tensorParallelismOverride:
            tensorParallelSize: 1
        nvidia-a100-40gb-1:
          tensorParallelismOverride:
            tensorParallelSize: 1
        nvidia-h100-1:
          tensorParallelismOverride:
            tensorParallelSize: 1
        nvidia-h200-1:
          tensorParallelismOverride:
            tensorParallelSize: 1
        nvidia-a10-1:
          tensorParallelismOverride:
            tensorParallelSize: 1
  modelSizeRange:
    min: 2.5B
    max: 3B
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node.kubernetes.io/instance-type
                operator: In
                values:
                  - BM.GPU.H100.8
                  - BM.GPU.H200.8
                  - BM.GPU.H200-NC.8
                  - BM.GPU.H100-NC.8
                  - BM.GPU.A10.4
                  - BM.GPU.A100-v2.8
                  - BM.GPU4.8
                  - BM.GPU.B4.8
  protocolVersions:
    - cohere
  schedulerName: {{ .Values.commonSchedulerName }}
  volumes:
    - name: shared-memory
      emptyDir:
        medium: Memory
        sizeLimit: 1Gi
    - name: model-empty-dir
      emptyDir:
        medium: Memory
    {{- if or (eq .Values.oci.realm "oc5") (eq .Values.oci.realm "oc6") }}
    - name: etc-pki
      hostPath:
        path: /etc/pki
        type: Directory
    {{- end }}
  containers:
    - name: ome-container
      image: "{{ .Values.cohere.rerankv4_0_proImage.repository }}:{{ .Values.cohere.rerankv4_0_proImage.tag }}"
      ports:
        - containerPort: 8080
          name: http1
      resources:
        limits:
          nvidia.com/gpu: "1"
        requests:
          cpu: 4
          memory: 120Gi
          nvidia.com/gpu: "1"
      volumeMounts:
        - mountPath: /dev/shm
          name: shared-memory
        - mountPath: /opt/ml/model
          name: model-empty-dir
      readinessProbe:
        {{- toYaml .Values.cohere.readinessProbe | nindent 8 }}
      livenessProbe:
        {{- toYaml .Values.cohere.livenessProbe | nindent 8 }}
      startupProbe:
        {{- toYaml .Values.cohere.startupProbe | nindent 8 }}
  engineConfig:
    {{- if or .Values.cohere.commonAnnotations .Values.cohere.blocklistOverride.enabled }}
    annotations:
      {{- with .Values.cohere.commonAnnotations }}
        {{- toYaml . | nindent 6 }}
        {{- end }}
        {{- if .Values.cohere.blocklistOverride.enabled }}
        {{- toYaml .Values.cohere.blocklistOverride.annotations | nindent 6 }}
        {{- end }}
    {{- end }}
    {{- with .Values.cohere.commonLabels }}
    labels:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .Values.commonTolerations }}
    tolerations:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node.kubernetes.io/instance-type
                  operator: In
                  values:
                    - BM.GPU.H100.8
                    - BM.GPU.H200.8
                    - BM.GPU.H200-NC.8
                    - BM.GPU.H100-NC.8
                    - BM.GPU.A10.4
                    - BM.GPU.A100-v2.8
                    - BM.GPU4.8
                    - BM.GPU.B4.8
    schedulerName: {{ .Values.commonSchedulerName }}
    volumes:
      - name: shared-memory
        emptyDir:
          medium: Memory
          sizeLimit: 1Gi
      - name: model-empty-dir
        emptyDir:
          medium: Memory
      {{- if or (eq .Values.oci.realm "oc5") (eq .Values.oci.realm "oc6") }}
      - name: etc-pki
        hostPath:
          path: /etc/pki
          type: Directory
      {{- end }}
      {{- if .Values.cohere.blocklistOverride.enabled }}
      {{- toYaml .Values.cohere.blocklistOverride.volumes | nindent 6 }}
      {{- end }}
    runner:
      name: ome-container
      image: "{{ .Values.cohere.rerankv4_0_proImage.repository }}:{{ .Values.cohere.rerankv4_0_proImage.tag }}"
      ports:
        - containerPort: 8080
          name: http1
      resources:
        limits:
          nvidia.com/gpu: "1"
        requests:
          cpu: 4
          memory: 120Gi
          nvidia.com/gpu: "1"
      volumeMounts:
        - mountPath: /dev/shm
          name: shared-memory
        - mountPath: /opt/ml/model
          name: model-empty-dir
        {{- if .Values.cohere.blocklistOverride.enabled }}
        {{- toYaml .Values.cohere.blocklistOverride.volumeMounts | nindent 8 }}
        {{- end }}
      readinessProbe:
        {{- toYaml .Values.cohere.readinessProbe | nindent 8 }}
      livenessProbe:
        {{- toYaml .Values.cohere.livenessProbe | nindent 8 }}
      startupProbe:
        {{- toYaml .Values.cohere.startupProbe | nindent 8 }}
