apiVersion: ome.io/v1beta1
kind: ClusterServingRuntime
metadata:
  name: cohere-command-north-h100
spec:
  acceleratorRequirements:
    acceleratorClasses:
      - nvidia-h100-4
  annotations:
    prometheus.io/port: '8002'
    prometheus.io/scrape: 'true'
    ome.io/disable-blocklist: 'true'
    ome.io/inject-model-init: 'true'
  {{- with .Values.cohere.commonLabels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.commonTolerations }}
  tolerations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  supportedModelFormats:
    - autoSelect: true
      modelArchitecture: CohereForCausalLM
      modelFormat:
        name: safetensors
        version: '1.0.0'
      modelFramework:
        name: transformers
        version: '5.5.3'
      version: "1.0"
  modelSizeRange:
    min: 200B
    max: 230B
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node.kubernetes.io/instance-type
                operator: In
                values:
                  - BM.GPU.H100.8
                  - BM.GPU.H100-NC.8
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: node.kubernetes.io/instance-type
                operator: In
                values:
                  - BM.GPU.H100.8
                  - BM.GPU.H100-NC.8
  protocolVersions:
    - cohere
  schedulerName: {{ .Values.commonSchedulerName }}
  volumes:
    - name: shared-memory
      emptyDir:
        medium: Memory
        sizeLimit: 1Gi
    - name: model-empty-dir
      emptyDir: {}
    {{- if or (eq .Values.oci.realm "oc5") (eq .Values.oci.realm "oc6") }}
    - name: etc-pki
      hostPath:
        path: /etc/pki
        type: Directory
    {{- end }}
  containers:
    - name: ome-container
      image: "{{ .Values.cohere.commandNorthImage.repository }}:{{ .Values.cohere.commandNorthImage.tag }}"
      ports:
        - containerPort: 8080
          name: http1
      resources:
        limits:
          nvidia.com/gpu: "4"
        requests:
          cpu: 48
          memory: 680Gi
          nvidia.com/gpu: "4"
      volumeMounts:
        - mountPath: /dev/shm
          name: shared-memory
        - mountPath: /opt/ml/model
          name: model-empty-dir
      readinessProbe:
        {{- toYaml .Values.cohere.readinessProbe | nindent 8 }}
      livenessProbe:
        {{- toYaml .Values.cohere.livenessProbe | nindent 8 }}
      startupProbe:
        {{- toYaml .Values.cohere.startupProbe | nindent 8 }}
  engineConfig:
    annotations:
      prometheus.io/port: '8002'
      prometheus.io/scrape: 'true'
      ome.io/disable-blocklist: 'true'
      ome.io/inject-model-init: 'true'
      {{- if .Values.cohere.blocklistOverride.enabled }}
      {{- toYaml .Values.cohere.blocklistOverride.annotations | nindent 6 }}
      {{- end }}
    {{- with .Values.cohere.commonLabels }}
    labels:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .Values.commonTolerations }}
    tolerations:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node.kubernetes.io/instance-type
                  operator: In
                  values:
                    - BM.GPU.H100.8
                    - BM.GPU.H100-NC.8
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: node.kubernetes.io/instance-type
                  operator: In
                  values:
                    - BM.GPU.H100.8
                    - BM.GPU.H100-NC.8
    schedulerName: {{ .Values.commonSchedulerName }}
    volumes:
      - name: shared-memory
        emptyDir:
          medium: Memory
          sizeLimit: 1Gi
      - name: model-empty-dir
        emptyDir: {}
      {{- if or (eq .Values.oci.realm "oc5") (eq .Values.oci.realm "oc6") }}
      - name: etc-pki
        hostPath:
          path: /etc/pki
          type: Directory
      {{- end }}
      {{- if .Values.cohere.blocklistOverride.enabled }}
      {{- toYaml .Values.cohere.blocklistOverride.volumes | nindent 6 }}
      {{- end }}
    runner:
      name: ome-container
      image: "{{ .Values.cohere.commandNorthImage.repository }}:{{ .Values.cohere.commandNorthImage.tag }}"
      ports:
        - containerPort: 8080
          name: http1
      resources:
        limits:
          nvidia.com/gpu: "4"
        requests:
          cpu: 48
          memory: 680Gi
          nvidia.com/gpu: "4"
      volumeMounts:
        - mountPath: /dev/shm
          name: shared-memory
        - mountPath: /opt/ml/model
          name: model-empty-dir
        {{- if .Values.cohere.blocklistOverride.enabled }}
        {{- toYaml .Values.cohere.blocklistOverride.volumeMounts | nindent 8 }}
        {{- end }}
      readinessProbe:
        {{- toYaml .Values.cohere.readinessProbe | nindent 8 }}
      livenessProbe:
        {{- toYaml .Values.cohere.livenessProbe | nindent 8 }}
      startupProbe:
        {{- toYaml .Values.cohere.startupProbe | nindent 8 }}
