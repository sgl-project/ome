apiVersion: ome.io/v1beta1
kind: ClusterServingRuntime
metadata:
  name: srt-qwen-image
spec:
  acceleratorRequirements:
    acceleratorClasses:
      - nvidia-a10-1
      - nvidia-a10-2
      - nvidia-a10-4
      - nvidia-a100-40gb-1
      - nvidia-a100-40gb-2
      - nvidia-a100-40gb-4
      - nvidia-a100-40gb-8
      - nvidia-a100-80gb-1
      - nvidia-a100-80gb-2
      - nvidia-a100-80gb-4
      - nvidia-a100-80gb-8
      - nvidia-h100-1
      - nvidia-h100-2
      - nvidia-h100-4
      - nvidia-h100-8
      - nvidia-h200-1
      - nvidia-h200-2
      - nvidia-h200-4
      - nvidia-h200-8
  disabled: false
  {{- if or .Values.commonAnnotations .Values.qwen_image.annotations }}
  annotations:
    {{- if .Values.commonAnnotations }}
    {{ toYaml .Values.commonAnnotations | nindent 4 }}
    {{- end }}
    {{- if .Values.qwen_image.annotations }}
    {{ toYaml .Values.qwen_image.annotations | nindent 4 }}
    {{- end }}
  {{- end }}
  {{- if or .Values.commonLabels .Values.qwen_image.labels }}
  labels:
    {{- if .Values.commonLabels }}
    {{ toYaml .Values.commonLabels | nindent 4 }}
    {{- end }}
    {{- if .Values.qwen_image.labels }}
    {{ toYaml .Values.qwen_image.labels | nindent 4 }}
    {{- end }}
  {{- end }}
  {{- if or .Values.commonTolerations .Values.qwen_image.tolerations }}
  tolerations:
    {{- if .Values.commonTolerations }}
    {{ toYaml .Values.commonTolerations | nindent 4 }}
    {{- end }}
    {{- if .Values.qwen_image.tolerations }}
    {{ toYaml .Values.qwen_image.tolerations | nindent 4 }}
    {{- end }}
  {{- end }}
  volumes:
    - name: dshm
      emptyDir:
        medium: Memory
    {{- if or (eq .Values.oci.realm "oc5") (eq .Values.oci.realm "oc6") }}
    - name: etc-pki
      hostPath:
        path: /etc/pki
        type: Directory
    {{- end }}
  {{ with .Values.qwen_image }}
  affinity: {{ .affinity | toYaml | nindent 4 }}
  {{ end }}
  supportedModelFormats:
    - modelFramework:
        name: diffusers
        version: 0.34.0.dev0
      modelFormat:
        name: diffusers
        version: 0.34.0.dev0
      autoSelect: true
      modelArchitecture: QwenImagePipeline
      version: "1.0.0"
      priority: 1
      acceleratorConfig:
        nvidia-a100-80gb-1:
          tensorParallelismOverride:
            tensorParallelSize: 1
        nvidia-a100-80gb-2:
          tensorParallelismOverride:
            tensorParallelSize: 2
        nvidia-a100-80gb-4:
          tensorParallelismOverride:
            tensorParallelSize: 4
        nvidia-a100-80gb-8:
          tensorParallelismOverride:
            tensorParallelSize: 8
        nvidia-a100-40gb-1:
          tensorParallelismOverride:
            tensorParallelSize: 1
          runtimeArgsOverride:
            - --dit-layerwise-offload
        nvidia-a100-40gb-2:
          tensorParallelismOverride:
            tensorParallelSize: 2
          runtimeArgsOverride:
            - --dit-layerwise-offload
        nvidia-a100-40gb-4:
          tensorParallelismOverride:
            tensorParallelSize: 4
          runtimeArgsOverride:
            - --dit-layerwise-offload
        nvidia-a100-40gb-8:
          tensorParallelismOverride:
            tensorParallelSize: 8
          runtimeArgsOverride:
            - --dit-layerwise-offload
        nvidia-h100-1:
          tensorParallelismOverride:
            tensorParallelSize: 1
        nvidia-h100-2:
          tensorParallelismOverride:
            tensorParallelSize: 2
        nvidia-h100-4:
          tensorParallelismOverride:
            tensorParallelSize: 4
        nvidia-h100-8:
          tensorParallelismOverride:
            tensorParallelSize: 8
        nvidia-a10-1:
          tensorParallelismOverride:
            tensorParallelSize: 1
        nvidia-a10-2:
          tensorParallelismOverride:
            tensorParallelSize: 2
        nvidia-a10-4:
          tensorParallelismOverride:
            tensorParallelSize: 4
        nvidia-h200-1:
          tensorParallelismOverride:
            tensorParallelSize: 1
        nvidia-h200-2:
          tensorParallelismOverride:
            tensorParallelSize: 2
        nvidia-h200-4:
          tensorParallelismOverride:
            tensorParallelSize: 4
        nvidia-h200-8:
          tensorParallelismOverride:
            tensorParallelSize: 8
    - modelFramework:
        name: diffusers
        version: 0.35.0.dev0
      modelFormat:
        name: diffusers
        version: 0.35.0.dev0
      autoSelect: true
      modelArchitecture: QwenImageEditPipeline
      version: "1.0.0"
      priority: 1
      acceleratorConfig:
        nvidia-a100-80gb-1:
          tensorParallelismOverride:
            tensorParallelSize: 1
        nvidia-a100-80gb-2:
          tensorParallelismOverride:
            tensorParallelSize: 2
        nvidia-a100-80gb-4:
          tensorParallelismOverride:
            tensorParallelSize: 4
        nvidia-a100-80gb-8:
          tensorParallelismOverride:
            tensorParallelSize: 8
        nvidia-a100-40gb-1:
          tensorParallelismOverride:
            tensorParallelSize: 1
          runtimeArgsOverride:
            - --dit-layerwise-offload
        nvidia-a100-40gb-2:
          tensorParallelismOverride:
            tensorParallelSize: 2
          runtimeArgsOverride:
            - --dit-layerwise-offload
        nvidia-a100-40gb-4:
          tensorParallelismOverride:
            tensorParallelSize: 4
          runtimeArgsOverride:
            - --dit-layerwise-offload
        nvidia-a100-40gb-8:
          tensorParallelismOverride:
            tensorParallelSize: 8
          runtimeArgsOverride:
            - --dit-layerwise-offload
        nvidia-h100-1:
          tensorParallelismOverride:
            tensorParallelSize: 1
        nvidia-h100-2:
          tensorParallelismOverride:
            tensorParallelSize: 2
        nvidia-h100-4:
          tensorParallelismOverride:
            tensorParallelSize: 4
        nvidia-h100-8:
          tensorParallelismOverride:
            tensorParallelSize: 8
        nvidia-a10-1:
          tensorParallelismOverride:
            tensorParallelSize: 1
        nvidia-a10-2:
          tensorParallelismOverride:
            tensorParallelSize: 2
        nvidia-a10-4:
          tensorParallelismOverride:
            tensorParallelSize: 4
        nvidia-h200-1:
          tensorParallelismOverride:
            tensorParallelSize: 1
        nvidia-h200-2:
          tensorParallelismOverride:
            tensorParallelSize: 2
        nvidia-h200-4:
          tensorParallelismOverride:
            tensorParallelSize: 4
        nvidia-h200-8:
          tensorParallelismOverride:
            tensorParallelSize: 8
  modelSizeRange:
    max: 32B
    min: 25B
  protocolVersions:
    - openAI
  schedulerName: {{ .Values.commonSchedulerName }}
  containers:
    - name: ome-container
      image: {{ .Values.qwen_image.image.repository | default .Values.sglang_diffusion.commonImage.repository }}:{{ .Values.qwen_image.image.tag | default .Values.sglang_diffusion.latestImage.tag }}
      ports:
        - containerPort: {{ .Values.sglang.port }}
          name: http1
          protocol: TCP
      command:
        - /bin/bash
        - '-lc'
        - --
      args:
        - |
          sglang serve \
          --host 0.0.0.0 \
          --port {{ .Values.sglang.port }} \
          --model-path "$MODEL_PATH" \
          --tp-size 1 \
          --num-gpus 1 \
          --output-path "" \
          --save-input-path "" \
          --enable-metrics \
          --vae-tiling
      volumeMounts:
        - mountPath: /dev/shm
          name: dshm
      resources:
        requests:
          cpu: 32
          memory: 110Gi
          nvidia.com/gpu: 1
        limits:
          cpu: 32
          memory: 110Gi
          nvidia.com/gpu: 1
      readinessProbe:
        httpGet:
          path: /health_generate
          port: 8080
        failureThreshold: 5
        successThreshold: 1
        periodSeconds: 60
        timeoutSeconds: 200
      livenessProbe:
        httpGet:
          path: /health
          port: 8080
        failureThreshold: 5
        successThreshold: 1
        periodSeconds: 60
        timeoutSeconds: 60
      startupProbe:
        httpGet:
          path: /health_generate
          port: 8080
        failureThreshold: 150
        successThreshold: 1
        periodSeconds: 6
        initialDelaySeconds: 60
        timeoutSeconds: 30
  engineConfig:
    schedulerName: {{ .Values.commonSchedulerName }}
    {{- if or .Values.commonAnnotations .Values.qwen_image.annotations }}
    annotations:
      {{- if .Values.commonAnnotations }}
      {{ toYaml .Values.commonAnnotations | nindent 6 }}
      {{- end }}
      {{- if .Values.qwen_image.annotations }}
      {{ toYaml .Values.qwen_image.annotations | nindent 6 }}
      {{- end }}
    {{- end }}
    {{- if or .Values.commonLabels .Values.qwen_image.labels }}
    labels:
      {{- if .Values.commonLabels }}
      {{ toYaml .Values.commonLabels | nindent 6 }}
      {{- end }}
      {{- if .Values.qwen_image.labels }}
      {{ toYaml .Values.qwen_image.labels | nindent 6 }}
      {{- end }}
    {{- end }}
    {{- if or .Values.commonTolerations .Values.qwen_image.tolerations }}
    tolerations:
      {{- if .Values.commonTolerations }}
      {{ toYaml .Values.commonTolerations | nindent 6 }}
      {{- end }}
      {{- if .Values.qwen_image.tolerations }}
      {{ toYaml .Values.qwen_image.tolerations | nindent 6 }}
      {{- end }}
    {{- end }}
    volumes:
      - name: dshm
        emptyDir:
          medium: Memory
      {{- if or (eq .Values.oci.realm "oc5") (eq .Values.oci.realm "oc6") }}
      - name: etc-pki
        hostPath:
          path: /etc/pki
          type: Directory
      {{- end }}
    {{ with .Values.qwen_image }}
    affinity: {{ .affinity | toYaml | nindent 6 }}
    {{ end }}
    runner:
      name: ome-container
      image: {{ .Values.qwen_image.image.repository | default .Values.sglang_diffusion.commonImage.repository }}:{{ .Values.qwen_image.image.tag | default .Values.sglang_diffusion.latestImage.tag }}
      ports:
        - containerPort: {{ .Values.sglang.port }}
          name: http1
          protocol: TCP
      command:
        - /bin/bash
        - '-lc'
        - --
      args:
        - |
           sglang serve \
           --host 0.0.0.0 \
           --port {{ .Values.sglang.port }} \
           --model-path "$MODEL_PATH" \
           --tp-size 1 \
           --num-gpus 1 \
           --output-path "" \
           --save-input-path "" \
           --enable-metrics \
           --vae-tiling
      volumeMounts:
        - mountPath: /dev/shm
          name: dshm
      resources:
        requests:
          cpu: 32
          memory: 110Gi
          nvidia.com/gpu: 1
        limits:
          cpu: 32
          memory: 110Gi
          nvidia.com/gpu: 1
      readinessProbe:
        httpGet:
          path: /health_generate
          port: 8080
        failureThreshold: 5
        successThreshold: 1
        periodSeconds: 60
        timeoutSeconds: 200
      livenessProbe:
        httpGet:
          path: /health
          port: 8080
        failureThreshold: 5
        successThreshold: 1
        periodSeconds: 60
        timeoutSeconds: 60
      startupProbe:
        httpGet:
          path: /health_generate
          port: 8080
        failureThreshold: 150
        successThreshold: 1
        periodSeconds: 6
        initialDelaySeconds: 60
        timeoutSeconds: 30
