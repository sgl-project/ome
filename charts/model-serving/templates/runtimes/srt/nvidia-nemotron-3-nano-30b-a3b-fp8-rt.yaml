apiVersion: ome.io/v1beta1
kind: ClusterServingRuntime
metadata:
  name: srt-nvidia-nemotron-3-nano-30b-a3b-fp8
spec:
  acceleratorRequirements:
    acceleratorClasses:
      - nvidia-h100-1
      - nvidia-a100-80gb-1
      - nvidia-a100-80gb-2
      - nvidia-a100-80gb-4
      - nvidia-a100-80gb-8
      - nvidia-a100-40gb-1
      - nvidia-a100-40gb-2
      - nvidia-a100-40gb-4
      - nvidia-a100-40gb-8
      - nvidia-h100-2
      - nvidia-h100-4
      - nvidia-h100-8
      - nvidia-a10-1
      - nvidia-a10-2
      - nvidia-a10-4
      - nvidia-h200-1
      - nvidia-h200-2
      - nvidia-h200-4
      - nvidia-h200-8
  disabled: false
  {{- if or .Values.commonAnnotations .Values.nvidia_nemotron_3_nano_30b_a3b_fp8.annotations }}
  annotations:
    {{- if .Values.commonAnnotations }}
    {{ toYaml .Values.commonAnnotations | nindent 4 }}
    {{- end }}
    {{- if .Values.nvidia_nemotron_3_nano_30b_a3b_fp8.annotations }}
    {{ toYaml .Values.nvidia_nemotron_3_nano_30b_a3b_fp8.annotations | nindent 4 }}
    {{- end }}
  {{- end }}
  {{- if or .Values.commonLabels .Values.nvidia_nemotron_3_nano_30b_a3b_fp8.labels }}
  labels:
    {{- if .Values.commonLabels }}
    {{ toYaml .Values.commonLabels | nindent 4 }}
    {{- end }}
    {{- if .Values.nvidia_nemotron_3_nano_30b_a3b_fp8.labels }}
    {{ toYaml .Values.nvidia_nemotron_3_nano_30b_a3b_fp8.labels | nindent 4 }}
    {{- end }}
  {{- end }}
  {{- if or .Values.commonTolerations .Values.nvidia_nemotron_3_nano_30b_a3b_fp8.tolerations }}
  tolerations:
    {{- if .Values.commonTolerations }}
    {{ toYaml .Values.commonTolerations | nindent 4 }}
    {{- end }}
    {{- if .Values.nvidia_nemotron_3_nano_30b_a3b_fp8.tolerations }}
    {{ toYaml .Values.nvidia_nemotron_3_nano_30b_a3b_fp8.tolerations | nindent 4 }}
    {{- end }}
  {{- end }}
  supportedModelFormats:
    - modelFramework:
        name: transformers
        version: "4.53.2"
      modelFormat:
        name: safetensors
        version: "1.0.0"
      modelArchitecture: NemotronHForCausalLM
      autoSelect: true
      priority: 1
      acceleratorConfig:
        nvidia-a100-80gb-1:
          tensorParallelismOverride:
            tensorParallelSize: 1
        nvidia-a100-80gb-2:
          tensorParallelismOverride:
            tensorParallelSize: 2
        nvidia-a100-80gb-4:
          tensorParallelismOverride:
            tensorParallelSize: 4
        nvidia-a100-80gb-8:
          tensorParallelismOverride:
            tensorParallelSize: 8
        nvidia-a100-40gb-1:
          tensorParallelismOverride:
            tensorParallelSize: 1
        nvidia-a100-40gb-2:
          tensorParallelismOverride:
            tensorParallelSize: 2
        nvidia-a100-40gb-4:
          tensorParallelismOverride:
            tensorParallelSize: 4
        nvidia-a100-40gb-8:
          tensorParallelismOverride:
            tensorParallelSize: 8
        nvidia-h100-1:
          tensorParallelismOverride:
            tensorParallelSize: 1
        nvidia-h100-2:
          tensorParallelismOverride:
            tensorParallelSize: 2
        nvidia-h100-4:
          tensorParallelismOverride:
            tensorParallelSize: 4
        nvidia-h100-8:
          tensorParallelismOverride:
            tensorParallelSize: 8
        nvidia-a10-1:
          tensorParallelismOverride:
            tensorParallelSize: 1
        nvidia-a10-2:
          tensorParallelismOverride:
            tensorParallelSize: 2
        nvidia-a10-4:
          tensorParallelismOverride:
            tensorParallelSize: 4
        nvidia-h200-1:
          tensorParallelismOverride:
            tensorParallelSize: 1
        nvidia-h200-2:
          tensorParallelismOverride:
            tensorParallelSize: 2
        nvidia-h200-4:
          tensorParallelismOverride:
            tensorParallelSize: 4
        nvidia-h200-8:
          tensorParallelismOverride:
            tensorParallelSize: 8
  volumes:
    - name: dshm
      emptyDir:
        medium: Memory
    {{- if or (eq .Values.oci.realm "oc5") (eq .Values.oci.realm "oc6") }}
    - name: etc-pki
      hostPath:
        path: /etc/pki
        type: Directory
    {{- end }}
  protocolVersions:
    - openAI
  schedulerName: {{ .Values.commonSchedulerName }}
  modelSizeRange:
    min: 28B
    max: 32B
  containers:
    - name: ome-container
      image: {{ .Values.nvidia_nemotron_3_nano_30b_a3b_fp8.image.srt.repository | default .Values.sglang.commonImage.repository }}:{{ .Values.nvidia_nemotron_3_nano_30b_a3b_fp8.image.srt.tag | default .Values.sglang.latestImage.tag }}
      ports:
        - containerPort: 8080
          name: http1
          protocol: TCP
      command:
        - /bin/bash
        - '-lc'
        - --
      args:
        - |
          python3 -m sglang.launch_server \
          --host=0.0.0.0 \
          --port={{ .Values.sglang.port }} \
          --enable-metrics \
          --log-requests \
          --model-path="$MODEL_PATH" \
          --tp 2 \
          --mem-frac=0.9 \
          --served-model-name=vllm-model \
          --trust-remote-code \
          --reasoning-parser=nano_v3 \
          --tool-call-parser=qwen3_coder
      volumeMounts:
        - mountPath: /dev/shm
          name: dshm
      resources:
        requests:
          cpu: 10
          memory: 100Gi
          nvidia.com/gpu: 2
        limits:
          cpu: 10
          memory: 100Gi
          nvidia.com/gpu: 2

      readinessProbe:
        httpGet:
          path: /health_generate
          port: 8080
        failureThreshold: 3
        successThreshold: 1
        periodSeconds: 60
        timeoutSeconds: 200

      livenessProbe:
        httpGet:
          path: /health
          port: 8080
        failureThreshold: 5
        successThreshold: 1
        periodSeconds: 60
        timeoutSeconds: 60

      startupProbe:
        httpGet:
          path: /health_generate
          port: 8080
        failureThreshold: 150
        successThreshold: 1
        periodSeconds: 6
        initialDelaySeconds: 60
        timeoutSeconds: 30
  engineConfig:
    schedulerName: {{ .Values.commonSchedulerName }}
    {{- if or .Values.commonAnnotations .Values.nvidia_nemotron_3_nano_30b_a3b_fp8.annotations }}
    annotations:
      {{- if .Values.commonAnnotations }}
      {{ toYaml .Values.commonAnnotations | nindent 6 }}
      {{- end }}
      {{- if .Values.nvidia_nemotron_3_nano_30b_a3b_fp8.annotations }}
      {{ toYaml .Values.nvidia_nemotron_3_nano_30b_a3b_fp8.annotations | nindent 6 }}
      {{- end }}
    {{- end }}
    {{- if or .Values.commonLabels .Values.nvidia_nemotron_3_nano_30b_a3b_fp8.labels }}
    labels:
      {{- if .Values.commonLabels }}
      {{ toYaml .Values.commonLabels | nindent 6 }}
      {{- end }}
      {{- if .Values.nvidia_nemotron_3_nano_30b_a3b_fp8.labels }}
      {{ toYaml .Values.nvidia_nemotron_3_nano_30b_a3b_fp8.labels | nindent 6 }}
      {{- end }}
    {{- end }}
    {{- if or .Values.commonTolerations .Values.nvidia_nemotron_3_nano_30b_a3b_fp8.tolerations }}
    tolerations:
      {{- if .Values.commonTolerations }}
      {{ toYaml .Values.commonTolerations | nindent 6 }}
      {{- end }}
      {{- if .Values.nvidia_nemotron_3_nano_30b_a3b_fp8.tolerations }}
      {{ toYaml .Values.nvidia_nemotron_3_nano_30b_a3b_fp8.tolerations | nindent 6 }}
      {{- end }}
    {{- end }}
    volumes:
      - name: dshm
        emptyDir:
          medium: Memory
        {{- if or (eq .Values.oci.realm "oc5") (eq .Values.oci.realm "oc6") }}
      - name: etc-pki
        hostPath:
          path: /etc/pki
          type: Directory
        {{- end }}
    {{ with .Values.nvidia_nemotron_3_nano_30b_a3b_fp8 }}
    affinity: {{ .affinity | toYaml | nindent 6 }}
    {{ end }}
    runner:
      name: ome-container
      image: {{ .Values.nvidia_nemotron_3_nano_30b_a3b_fp8.image.srt.repository | default .Values.sglang.commonImage.repository }}:{{ .Values.nvidia_nemotron_3_nano_30b_a3b_fp8.image.srt.tag | default .Values.sglang.latestImage.tag }}
      ports:
        - containerPort: 8080
          name: http1
          protocol: TCP
      command:
        - /bin/bash
        - '-lc'
        - --
      args:
        - |
          python3 -m sglang.launch_server \
          --host=0.0.0.0 \
          --port={{ .Values.sglang.port }} \
          --enable-metrics \
          --log-requests \
          --model-path="$MODEL_PATH" \
          --tp 2 \
          --mem-frac=0.9 \
          --served-model-name=vllm-model \
          --trust-remote-code \
          --reasoning-parser=nano_v3 \
          --tool-call-parser=qwen3_coder
      volumeMounts:
        - mountPath: /dev/shm
          name: dshm
      resources:
        requests:
          cpu: 10
          memory: 80Gi
          nvidia.com/gpu: 2
        limits:
          cpu: 10
          memory: 80Gi
          nvidia.com/gpu: 2

      readinessProbe:
        httpGet:
          path: /health_generate
          port: 8080
        failureThreshold: 3
        successThreshold: 1
        periodSeconds: 60
        timeoutSeconds: 200

      livenessProbe:
        httpGet:
          path: /health
          port: 8080
        failureThreshold: 5
        successThreshold: 1
        periodSeconds: 60
        timeoutSeconds: 60

      startupProbe:
        httpGet:
          path: /health_generate
          port: 8080
        failureThreshold: 150
        successThreshold: 1
        periodSeconds: 6
        initialDelaySeconds: 60
        timeoutSeconds: 30
