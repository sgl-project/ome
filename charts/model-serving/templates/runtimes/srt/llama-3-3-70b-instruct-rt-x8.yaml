apiVersion: ome.io/v1beta1
kind: ClusterServingRuntime
metadata:
  name: srt-llama-3-3-70b-instruct-x8
spec:
  disabled: false
  {{- if or .Values.commonAnnotations .Values.llama_3_3_70b_instruct_x8.annotations }}
  annotations:
    {{- if .Values.commonAnnotations }}
    {{ toYaml .Values.commonAnnotations | nindent 4 }}
    {{- end }}
    {{- if .Values.llama_3_3_70b_instruct_x8.annotations }}
    {{ toYaml .Values.llama_3_3_70b_instruct_x8.annotations | nindent 4 }}
    {{- end }}
  {{- end }}
  {{- if or .Values.commonLabels .Values.llama_3_3_70b_instruct_x8.labels }}
  labels:
    {{- if .Values.commonLabels }}
    {{ toYaml .Values.commonLabels | nindent 4 }}
    {{- end }}
    {{- if .Values.llama_3_3_70b_instruct_x8.labels }}
    {{ toYaml .Values.llama_3_3_70b_instruct_x8.labels | nindent 4 }}
    {{- end }}
  {{- end }}
  {{- if or .Values.commonTolerations .Values.llama_3_3_70b_instruct_x8.tolerations }}
  tolerations:
    {{- if .Values.commonTolerations }}
    {{ toYaml .Values.commonTolerations | nindent 4 }}
    {{- end }}
    {{- if .Values.llama_3_3_70b_instruct_x8.tolerations }}
    {{ toYaml .Values.llama_3_3_70b_instruct_x8.tolerations | nindent 4 }}
    {{- end }}
  {{- end }}
  volumes:
    - name: dshm
      emptyDir:
        medium: Memory
    {{- if or (eq .Values.oci.realm "oc5") (eq .Values.oci.realm "oc6") }}
    - name: etc-pki
      hostPath:
        path: /etc/pki
        type: Directory
    {{- end }}
  {{ with .Values.llama_3_3_70b_instruct_x8 }}
  affinity: {{ .affinity | toYaml | nindent 4 }}
  {{ end }}
  supportedModelFormats:
    - modelFramework:
        name: transformers
        version: "4.47.0.dev0"
      modelFormat:
        name: safetensors
        version: "1.0.0"
      modelArchitecture: LlamaForCausalLM
      autoSelect: false
      priority: 1
  modelSizeRange:
    min: 60B
    max: 75B
  protocolVersions:
    - openAI
  schedulerName: {{ .Values.commonSchedulerName }}
  containers:
    - name: ome-container
      image: {{ .Values.llama_3_3_70b_instruct_x8.image.srt.repository | default .Values.sglang.commonImage.repository }}:{{ .Values.llama_3_3_70b_instruct_x8.image.srt.tag | default .Values.sglang.commonImage.tag }}
      ports:
        - containerPort: {{ .Values.sglang.port }}
          name: http1
          protocol: TCP
      command:
        - /bin/bash
        - '-lc'
        - --
      args:
        - |
          python3 -m sglang.launch_server \
          --host=0.0.0.0 \
          --port={{ .Values.sglang.port }} \
          --grpc-mode \
          --tp-size=8 \
          --served-model-name=vllm-model \
          --model-path="$MODEL_PATH" \
          --router-tokenizer-path="$MODEL_PATH" \
          --router-tool-call-parser=llama3 \
          --router-health-check-timeout-secs 1800 \
          --router-chat-template /sgl-workspace/sglang/examples/chat_template/tool_chat_template_llama3.1_json.jinja
      volumeMounts:
        - mountPath: /dev/shm
          name: dshm
      resources:
        requests:
          cpu: 20
          memory: 160Gi
          nvidia.com/gpu: 8
        limits:
          cpu: 20
          memory: 160Gi
          nvidia.com/gpu: 8

      readinessProbe:
        httpGet:
          path: /health_generate
          port: 8080
        failureThreshold: 3
        successThreshold: 1
        periodSeconds: 60
        timeoutSeconds: 200

      livenessProbe:
        httpGet:
          path: /health
          port: 8080
        failureThreshold: 5
        successThreshold: 1
        periodSeconds: 60
        timeoutSeconds: 60

      startupProbe:
        httpGet:
          path: /health_generate
          port: 8080
        failureThreshold: 150
        successThreshold: 1
        periodSeconds: 6
        initialDelaySeconds: 60
        timeoutSeconds: 30
  engineConfig:
    schedulerName: {{ .Values.commonSchedulerName }}
    {{- if or .Values.commonAnnotations .Values.llama_3_3_70b_instruct_x8.annotations }}
    annotations:
      {{- if .Values.commonAnnotations }}
      {{ toYaml .Values.commonAnnotations | nindent 6 }}
      {{- end }}
      {{- if .Values.llama_3_3_70b_instruct_x8.annotations }}
      {{ toYaml .Values.llama_3_3_70b_instruct_x8.annotations | nindent 6 }}
      {{- end }}
    {{- end }}
    {{- if or .Values.commonLabels .Values.llama_3_3_70b_instruct_x8.labels }}
    labels:
      {{- if .Values.commonLabels }}
      {{ toYaml .Values.commonLabels | nindent 6 }}
      {{- end }}
      {{- if .Values.llama_3_3_70b_instruct_x8.labels }}
      {{ toYaml .Values.llama_3_3_70b_instruct_x8.labels | nindent 6 }}
      {{- end }}
    {{- end }}
    {{- if or .Values.commonTolerations .Values.llama_3_3_70b_instruct_x8.tolerations }}
    tolerations:
      {{- if .Values.commonTolerations }}
      {{ toYaml .Values.commonTolerations | nindent 6 }}
      {{- end }}
      {{- if .Values.llama_3_3_70b_instruct_x8.tolerations }}
      {{ toYaml .Values.llama_3_3_70b_instruct_x8.tolerations | nindent 6 }}
      {{- end }}
    {{- end }}
    volumes:
      - name: dshm
        emptyDir:
          medium: Memory
        {{- if or (eq .Values.oci.realm "oc5") (eq .Values.oci.realm "oc6") }}
      - name: etc-pki
        hostPath:
          path: /etc/pki
          type: Directory
        {{- end }}
    {{ with .Values.llama_3_3_70b_instruct_x8 }}
    affinity: {{ .affinity | toYaml | nindent 6 }}
    {{ end }}
    runner:
      name: ome-container
      image: {{ .Values.llama_3_3_70b_instruct_x8.image.srt.repository | default .Values.sglang.commonImage.repository }}:{{ .Values.llama_3_3_70b_instruct_x8.image.srt.tag | default .Values.sglang.commonImage.tag }}
      ports:
        - containerPort: {{ .Values.sglang.port }}
          name: http1
          protocol: TCP
      command:
        - /bin/bash
        - '-lc'
        - --
      args:
        - |
          python3 -m sglang.launch_server \
          --host=0.0.0.0 \
          --port={{ .Values.sglang.port }} \
          --grpc-mode \
          --tp-size=8 \
          --served-model-name=vllm-model \
          --model-path="$MODEL_PATH" \
          --router-tokenizer-path="$MODEL_PATH" \
          --router-tool-call-parser=llama3 \
          --router-health-check-timeout-secs 1800 \
          --router-chat-template /sgl-workspace/sglang/examples/chat_template/tool_chat_template_llama3.1_json.jinja
      volumeMounts:
        - mountPath: /dev/shm
          name: dshm
      resources:
        requests:
          cpu: 20
          memory: 160Gi
          nvidia.com/gpu: 8
        limits:
          cpu: 20
          memory: 160Gi
          nvidia.com/gpu: 8

      readinessProbe:
        httpGet:
          path: /health_generate
          port: 8080
        failureThreshold: 3
        successThreshold: 1
        periodSeconds: 60
        timeoutSeconds: 200

      livenessProbe:
        httpGet:
          path: /health
          port: 8080
        failureThreshold: 5
        successThreshold: 1
        periodSeconds: 60
        timeoutSeconds: 60

      startupProbe:
        httpGet:
          path: /health_generate
          port: 8080
        failureThreshold: 150
        successThreshold: 1
        periodSeconds: 6
        initialDelaySeconds: 60
        timeoutSeconds: 30
