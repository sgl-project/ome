apiVersion: ome.io/v1beta1
kind: ClusterServingRuntime
metadata:
  name: sglang-xsmall-text-generation
spec:
  {{with .Values.commonAnnotations}}
  annotations: {{ toYaml . | nindent 6 }}
  {{end}}
  {{with .Values.commonLabels}}
  labels: {{ toYaml . | nindent 6 }}
  {{end}}
  {{with .Values.commonTolerations}}
  tolerations: {{ toYaml . | nindent 6 }}
  {{end}}
  volumes:
    - name: dshm
      emptyDir:
        medium: Memory
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node.kubernetes.io/instance-type
                operator: In
                values:
                  - BM.GPU.B4.8
                  - BM.GPU4.8
                  - BM.GPU.A100-v2.8
                  - BM.GPU.H100.8
  supportedModelFormats:
    - name: safetensors
      modelType: transformer
      modelArchitecture: LlamaForCausalLM
      version: "1"
      autoSelect: false
      priority: 1
    - name: safetensors
      modelType: transformer
      modelArchitecture: MistralForCausalLM
      version: "1"
      autoSelect: false
      priority: 1
    - name: safetensors
      modelType: transformer
      modelArchitecture: MistralModel
      version: "1"
      autoSelect: false
      priority: 1
  protocolVersions:
    - openAI
  containers:
    - name: ome-container
      image: {{ .Values.sglang.commonImage.repository }}:{{ .Values.sglang.commonImage.tag }}
      ports:
        - containerPort: 8080
          name: http1
          protocol: TCP
      command:
        - /bin/bash
        - '-lc'
        - --
      args:
        - |
          python3 -m sglang.launch_server \
          --port={{.Values.sglang.port}} \
          --model-path="$MODEL_PATH" \
          --tp-size=1 \
      volumeMounts:
        - mountPath: /dev/shm
          name: dshm
      resources:
        requests:
          cpu: 10
          memory: 160Gi
          nvidia.com/gpu: 1
        limits:
          cpu: 10
          memory: 160Gi
          nvidia.com/gpu: 1

      readinessProbe:
        httpGet:
          path: /health_generate
          port: 8080
        failureThreshold: 3
        successThreshold: 1
        periodSeconds: 60
        timeoutSeconds: 200

      livenessProbe:
        httpGet:
          path: /health
          port: 8080
        failureThreshold: 5
        successThreshold: 1
        periodSeconds: 60
        timeoutSeconds: 60

      startupProbe:
        httpGet:
          path: /health_generate
          port: 8080
        failureThreshold: 150
        successThreshold: 1
        periodSeconds: 6
        initialDelaySeconds: 60
        timeoutSeconds: 30