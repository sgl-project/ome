apiVersion: ome.io/v1beta1
kind: ClusterServingRuntime
metadata:
  name: srt-llama-4-scout-17b-16e-instruct
spec:
  acceleratorRequirements:
    acceleratorClasses:
      - nvidia-h100-4
      - nvidia-a100-80gb-1
      - nvidia-a100-80gb-2
      - nvidia-a100-80gb-4
      - nvidia-a100-80gb-8
      - nvidia-a100-40gb-1
      - nvidia-a100-40gb-2
      - nvidia-a100-40gb-4
      - nvidia-a100-40gb-8
      - nvidia-h100-1
      - nvidia-h100-2
      - nvidia-h100-8
      - nvidia-a10-1
      - nvidia-a10-2
      - nvidia-a10-4
      - nvidia-h200-1
      - nvidia-h200-2
      - nvidia-h200-4
      - nvidia-h200-8
      - nvidia-b200-1
      - nvidia-b200-2
      - nvidia-b200-4
      - nvidia-b200-8
  disabled: false
  {{- if or .Values.commonAnnotations .Values.llama_4_scout_17b_16e_instruct.annotations }}
  annotations:
    {{- if .Values.commonAnnotations }}
    {{ toYaml .Values.commonAnnotations | nindent 4 }}
    {{- end }}
    {{- if .Values.llama_4_scout_17b_16e_instruct.annotations }}
    {{ toYaml .Values.llama_4_scout_17b_16e_instruct.annotations | nindent 4 }}
    {{- end }}
  {{- end }}
  {{- if or .Values.commonLabels .Values.llama_4_scout_17b_16e_instruct.labels }}
  labels:
    {{- if .Values.commonLabels }}
    {{ toYaml .Values.commonLabels | nindent 4 }}
    {{- end }}
    {{- if .Values.llama_4_scout_17b_16e_instruct.labels }}
    {{ toYaml .Values.llama_4_scout_17b_16e_instruct.labels | nindent 4 }}
    {{- end }}
  {{- end }}
  {{- if or .Values.commonTolerations .Values.llama_4_scout_17b_16e_instruct.tolerations }}
  tolerations:
    {{- if .Values.commonTolerations }}
    {{ toYaml .Values.commonTolerations | nindent 4 }}
    {{- end }}
    {{- if .Values.llama_4_scout_17b_16e_instruct.tolerations }}
    {{ toYaml .Values.llama_4_scout_17b_16e_instruct.tolerations | nindent 4 }}
    {{- end }}
  {{- end }}
  supportedModelFormats:
    - modelFramework:
        name: transformers
        version: "4.51.0.dev0"
      modelFormat:
        name: safetensors
        version: "1.0.0"
      modelArchitecture: Llama4ForConditionalGeneration
      autoSelect: true
      priority: 2
      version: "1.0.0"
      acceleratorConfig:
        nvidia-a100-80gb-1:
          tensorParallelismOverride:
            tensorParallelSize: 1
        nvidia-a100-80gb-2:
          tensorParallelismOverride:
            tensorParallelSize: 2
        nvidia-a100-80gb-4:
          tensorParallelismOverride:
            tensorParallelSize: 4
        nvidia-a100-80gb-8:
          tensorParallelismOverride:
            tensorParallelSize: 8
        nvidia-a100-40gb-1:
          tensorParallelismOverride:
            tensorParallelSize: 1
        nvidia-a100-40gb-2:
          tensorParallelismOverride:
            tensorParallelSize: 2
        nvidia-a100-40gb-4:
          tensorParallelismOverride:
            tensorParallelSize: 4
        nvidia-a100-40gb-8:
          tensorParallelismOverride:
            tensorParallelSize: 8
        nvidia-h100-1:
          tensorParallelismOverride:
            tensorParallelSize: 1
        nvidia-h100-2:
          tensorParallelismOverride:
            tensorParallelSize: 2
        nvidia-h100-4:
          tensorParallelismOverride:
            tensorParallelSize: 4
        nvidia-h100-8:
          tensorParallelismOverride:
            tensorParallelSize: 8
        nvidia-a10-1:
          tensorParallelismOverride:
            tensorParallelSize: 1
        nvidia-a10-2:
          tensorParallelismOverride:
            tensorParallelSize: 2
        nvidia-a10-4:
          tensorParallelismOverride:
            tensorParallelSize: 4
        nvidia-h200-1:
          tensorParallelismOverride:
            tensorParallelSize: 1
        nvidia-h200-2:
          tensorParallelismOverride:
            tensorParallelSize: 2
        nvidia-h200-4:
          tensorParallelismOverride:
            tensorParallelSize: 4
        nvidia-h200-8:
          tensorParallelismOverride:
            tensorParallelSize: 8
        nvidia-b200-1:
          tensorParallelismOverride:
            tensorParallelSize: 1
          runtimeArgsOverride:
            - --attention-backend=trtllm_mha
            - --mm-attention-backend=sdpa
        nvidia-b200-2:
          tensorParallelismOverride:
            tensorParallelSize: 2
          runtimeArgsOverride:
            - --attention-backend=trtllm_mha
            - --mm-attention-backend=sdpa
        nvidia-b200-4:
          tensorParallelismOverride:
            tensorParallelSize: 4
          runtimeArgsOverride:
            - --attention-backend=trtllm_mha
            - --mm-attention-backend=sdpa
        nvidia-b200-8:
          tensorParallelismOverride:
            tensorParallelSize: 8
          runtimeArgsOverride:
            - --attention-backend=trtllm_mha
            - --mm-attention-backend=sdpa
  volumes:
    - name: dshm
      emptyDir:
        medium: Memory
    {{- if or (eq .Values.oci.realm "oc5") (eq .Values.oci.realm "oc6") }}
    - name: etc-pki
      hostPath:
        path: /etc/pki
        type: Directory
    {{- end }}
  protocolVersions:
    - openAI
  schedulerName: {{ .Values.commonSchedulerName }}
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node.kubernetes.io/instance-type
                operator: In
                values:
                  - BM.GPU.H100.8
                  - BM.GPU.H200.8
                  - BM.GPU.H200-NC.8
                  - BM.GPU.H100-NC.8
                  - BM.GPU.A100-v2.8
                  - BM.GPU.B200.8
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 1
          preference:
            matchExpressions:
              - key: node.kubernetes.io/instance-type
                operator: In
                values:
                  - BM.GPU.A100-v2.8
                  - BM.GPU.B200.8
        - weight: 100
          preference:
            matchExpressions:
              - key: node.kubernetes.io/instance-type
                operator: In
                values:
                  - BM.GPU.H100.8
                  - BM.GPU.H200.8
                  - BM.GPU.H200-NC.8
                  - BM.GPU.H100-NC.8
  modelSizeRange:
    min: 100B
    max: 110B
  containers:
    - name: ome-container
      image: {{ .Values.llama_4_scout_17b_16e_instruct.image.srt.repository | default .Values.sglang.commonImage.repository }}:{{ .Values.llama_4_scout_17b_16e_instruct.image.srt.tag | default .Values.sglang.latestImage.tag }}
      ports:
        - containerPort: 8080
          name: http1
          protocol: TCP
      env:
        - name: SGLANG_VLM_CACHE_SIZE_MB
          value: "2048"
      command:
        - /bin/bash
        - '-lc'
        - --
      args:
        - |
          python3 -m sglang.launch_server \
          --host=0.0.0.0 \
          --port=8080 \
          --enable-metrics \
          --model-path="$MODEL_PATH" \
          --tp=4 \
          --mem-frac=0.85 \
          --context-length=196608 \
          --enable-multimodal \
          --tool-call-parser=pythonic \
          --chat-template=/sgl-workspace/sglang/examples/chat_template/tool_chat_template_llama4_pythonic.jinja \
          --attention-backend=fa3 \
          --log-requests \
          --log-requests-level=1 \
          --mm-attention-backend=fa3 \
          --disable-fast-image-processor \
          --cuda-graph-max-bs=256 \
          --max-running-requests=300
      volumeMounts:
        - mountPath: /dev/shm
          name: dshm
      resources:
        requests:
          cpu: 64
          memory: 256Gi
          nvidia.com/gpu: 4
        limits:
          cpu: 64
          memory: 256Gi
          nvidia.com/gpu: 4

      readinessProbe:
        httpGet:
          path: /health
          port: 8080
        failureThreshold: 3
        successThreshold: 1
        periodSeconds: 60
        timeoutSeconds: 200

      livenessProbe:
        httpGet:
          path: /health
          port: 8080
        failureThreshold: 5
        successThreshold: 1
        periodSeconds: 60
        timeoutSeconds: 60

      startupProbe:
        httpGet:
          path: /health
          port: 8080
        failureThreshold: 150
        successThreshold: 1
        periodSeconds: 6
        initialDelaySeconds: 60
        timeoutSeconds: 30
  engineConfig:
    schedulerName: {{ .Values.commonSchedulerName }}
    {{- if or .Values.commonAnnotations .Values.llama_4_scout_17b_16e_instruct.annotations }}
    annotations:
      {{- if .Values.commonAnnotations }}
      {{ toYaml .Values.commonAnnotations | nindent 6 }}
      {{- end }}
      {{- if .Values.llama_4_scout_17b_16e_instruct.annotations }}
      {{ toYaml .Values.llama_4_scout_17b_16e_instruct.annotations | nindent 6 }}
      {{- end }}
    {{- end }}
    {{- if or .Values.commonLabels .Values.llama_4_scout_17b_16e_instruct.labels }}
    labels:
      {{- if .Values.commonLabels }}
      {{ toYaml .Values.commonLabels | nindent 6 }}
      {{- end }}
      {{- if .Values.llama_4_scout_17b_16e_instruct.labels }}
      {{ toYaml .Values.llama_4_scout_17b_16e_instruct.labels | nindent 6 }}
      {{- end }}
    {{- end }}
    {{- if or .Values.commonTolerations .Values.llama_4_scout_17b_16e_instruct.tolerations }}
    tolerations:
      {{- if .Values.commonTolerations }}
      {{ toYaml .Values.commonTolerations | nindent 6 }}
      {{- end }}
      {{- if .Values.llama_4_scout_17b_16e_instruct.tolerations }}
      {{ toYaml .Values.llama_4_scout_17b_16e_instruct.tolerations | nindent 6 }}
      {{- end }}
    {{- end }}
    volumes:
      - name: dshm
        emptyDir:
          medium: Memory
        {{- if or (eq .Values.oci.realm "oc5") (eq .Values.oci.realm "oc6") }}
      - name: etc-pki
        hostPath:
          path: /etc/pki
          type: Directory
        {{- end }}
    {{ with .Values.llama_4_scout_17b_16e_instruct }}
    affinity: {{ .affinity | toYaml | nindent 6 }}
    {{ end }}
    runner:
      name: ome-container
      image: {{ .Values.llama_4_scout_17b_16e_instruct.image.srt.repository | default .Values.sglang.commonImage.repository }}:{{ .Values.llama_4_scout_17b_16e_instruct.image.srt.tag | default .Values.sglang.latestImage.tag }}
      ports:
        - containerPort: 8080
          name: http1
          protocol: TCP
      env:
        - name: SGLANG_VLM_CACHE_SIZE_MB
          value: "2048"
      command:
        - /bin/bash
        - '-lc'
        - --
      args:
        - |
          python3 -m sglang.launch_server \
          --host=0.0.0.0 \
          --port=8080 \
          --enable-metrics \
          --model-path="$MODEL_PATH" \
          --tp=4 \
          --mem-frac=0.85 \
          --context-length=196608 \
          --enable-multimodal \
          --tool-call-parser=pythonic \
          --chat-template=/sgl-workspace/sglang/examples/chat_template/tool_chat_template_llama4_pythonic.jinja \
          --attention-backend=fa3 \
          --log-requests \
          --log-requests-level=1 \
          --mm-attention-backend=fa3 \
          --disable-fast-image-processor \
          --cuda-graph-max-bs=256 \
          --max-running-requests=300
      volumeMounts:
        - mountPath: /dev/shm
          name: dshm
      resources:
        requests:
          cpu: 64
          memory: 256Gi
          nvidia.com/gpu: 4
        limits:
          cpu: 64
          memory: 256Gi
          nvidia.com/gpu: 4
          
      readinessProbe:
        httpGet:
          path: /health
          port: 8080
        failureThreshold: 3
        successThreshold: 1
        periodSeconds: 60
        timeoutSeconds: 200

      livenessProbe:
        httpGet:
          path: /health
          port: 8080
        failureThreshold: 5
        successThreshold: 1
        periodSeconds: 60
        timeoutSeconds: 60

      startupProbe:
        httpGet:
          path: /health
          port: 8080
        failureThreshold: 150
        successThreshold: 1
        periodSeconds: 6
        initialDelaySeconds: 60
        timeoutSeconds: 30
