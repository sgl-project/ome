apiVersion: ome.io/v1beta1
kind: ClusterServingRuntime
metadata:
  name: srt-minimax-m2
spec:
  acceleratorRequirements:
    acceleratorClasses:
      - nvidia-h100-4
      - nvidia-h100-8
      - nvidia-h200-4
      - nvidia-h200-8
  disabled: false
  routerConfig:
    annotations:
      prometheus.io/path: /metrics
      prometheus.io/port: '29000'
      prometheus.io/scrape: 'true'
    labels:
      logging-forward: enabled
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
    affinity:
      podAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
                - key: component
                  operator: In
                  values:
                    - engine
            matchLabelKeys:
              - ome.io/inferenceservice
            topologyKey: kubernetes.io/hostname
    volumes:
      - name: customer-model-store
        hostPath:
          path: /mnt/data/models/customer-model-store
          type: Directory
    runner:
      name: router
      image: {{ .Values.minimax_m2.router.image.repository }}:{{ .Values.minimax_m2.router.image.tag }}
      ports:
        - containerPort: 8080
          name: http
      resources:
        requests:
          cpu: 1
          memory: 2Gi
        limits:
          cpu: "1"
          memory: 2Gi
      args:
        - --host
        - 0.0.0.0
        - --port
        - "8080"
        - --model-path
        - /mnt/data/models/customer-model-store
        - --service-discovery
        - --service-discovery-namespace
        - $(NAMESPACE)
        - --service-discovery-port
        - "{{ .Values.sglang.port }}"
        - --selector
        - component=engine ome.io/inferenceservice=$(INFERENCESERVICE_NAME)
        - --enable-igw
        - --request-id-headers
        - opc-request-id
        - --tool-call-parser
        - minimax_m2
        - --reasoning-parser
        - minimax
        - --log-json
        - --disable-retries
        - --disable-circuit-breaker
      env:
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: INFERENCESERVICE_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.labels['ome.io/inferenceservice']
        - name: BASE_MODEL_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.annotations['ome.io/base-model-name']
      volumeMounts:
        - name: customer-model-store
          mountPath: /mnt/data/models/customer-model-store
          subPathExpr: $(BASE_MODEL_NAME)
          readOnly: true
      readinessProbe:
        httpGet:
          path: /readiness
          port: 8080
        failureThreshold: 5
        periodSeconds: 30
        timeoutSeconds: 10
      livenessProbe:
        httpGet:
          path: /liveness
          port: 8080
        failureThreshold: 5
        periodSeconds: 30
        timeoutSeconds: 10
      startupProbe:
        httpGet:
          path: /readiness
          port: 8080
        failureThreshold: 60
        periodSeconds: 10
        timeoutSeconds: 10
        initialDelaySeconds: 60
  {{- if or .Values.commonAnnotations .Values.minimax_m2.annotations }}
  annotations:
    {{- if .Values.commonAnnotations }}
    {{ toYaml .Values.commonAnnotations | nindent 4 }}
    {{- end }}
    {{- if .Values.minimax_m2.annotations }}
    {{ toYaml .Values.minimax_m2.annotations | nindent 4 }}
    {{- end }}
  {{- end }}
  {{- if or .Values.commonLabels .Values.minimax_m2.labels }}
  labels:
    {{- if .Values.commonLabels }}
    {{ toYaml .Values.commonLabels | nindent 4 }}
    {{- end }}
    {{- if .Values.minimax_m2.labels }}
    {{ toYaml .Values.minimax_m2.labels | nindent 4 }}
    {{- end }}
  {{- end }}
  {{- if or .Values.commonTolerations .Values.minimax_m2.tolerations }}
  tolerations:
    {{- if .Values.commonTolerations }}
    {{ toYaml .Values.commonTolerations | nindent 4 }}
    {{- end }}
    {{- if .Values.minimax_m2.tolerations }}
    {{ toYaml .Values.minimax_m2.tolerations | nindent 4 }}
    {{- end }}
  {{- end }}
  volumes:
    - name: dshm
      emptyDir:
        medium: Memory
    {{- if or (eq .Values.oci.realm "oc5") (eq .Values.oci.realm "oc6") }}
    - name: etc-pki
      hostPath:
        path: /etc/pki
        type: Directory
    {{- end }}
  {{ with .Values.minimax_m2 }}
  affinity: {{ .affinity | toYaml | nindent 4 }}
  {{ end }}
  supportedModelFormats:
    - modelFramework:
        name: transformers
        version: "4.57.1"
      modelFormat:
        name: safetensors
        version: "1.0.0"
      modelArchitecture: MiniMaxM2ForCausalLM
      autoSelect: true
      priority: 1
      version: "1.0.0"
      quantization: fp8
      acceleratorConfig:
        nvidia-h100-4:
          tensorParallelismOverride:
            tensorParallelSize: 4
        nvidia-h100-8:
          tensorParallelismOverride:
            tensorParallelSize: 4
            dataParallelSize: 2
        nvidia-h200-4:
          tensorParallelismOverride:
            tensorParallelSize: 4
        nvidia-h200-8:
          tensorParallelismOverride:
            tensorParallelSize: 4
            dataParallelSize: 2
  modelSizeRange:
    min: 220B
    max: 240B
  protocolVersions:
    - openAI
  schedulerName: {{ .Values.commonSchedulerName }}
  engineConfig:
    schedulerName: {{ .Values.commonSchedulerName }}
    {{- if or .Values.commonAnnotations .Values.minimax_m2.annotations }}
    annotations:
      {{- if .Values.commonAnnotations }}
      {{ toYaml .Values.commonAnnotations | nindent 6 }}
      {{- end }}
      {{- if .Values.minimax_m2.annotations }}
      {{ toYaml .Values.minimax_m2.annotations | nindent 6 }}
      {{- end }}
    {{- end }}
    {{- if or .Values.commonLabels .Values.minimax_m2.labels }}
    labels:
      {{- if .Values.commonLabels }}
      {{ toYaml .Values.commonLabels | nindent 6 }}
      {{- end }}
      {{- if .Values.minimax_m2.labels }}
      {{ toYaml .Values.minimax_m2.labels | nindent 6 }}
      {{- end }}
    {{- end }}
    {{- if or .Values.commonTolerations .Values.minimax_m2.tolerations }}
    tolerations:
      {{- if .Values.commonTolerations }}
      {{ toYaml .Values.commonTolerations | nindent 6 }}
      {{- end }}
      {{- if .Values.minimax_m2.tolerations }}
      {{ toYaml .Values.minimax_m2.tolerations | nindent 6 }}
      {{- end }}
    {{- end }}
    volumes:
      - name: dshm
        emptyDir:
          medium: Memory
      {{- if or (eq .Values.oci.realm "oc5") (eq .Values.oci.realm "oc6") }}
      - name: etc-pki
        hostPath:
          path: /etc/pki
          type: Directory
      {{- end }}
    {{ with .Values.minimax_m2 }}
    affinity: {{ .affinity | toYaml | nindent 6 }}
    {{ end }}
    runner:
      name: ome-container
      image: {{ .Values.minimax_m2.image.srt.repository | default .Values.sglang.commonImage.repository }}:{{ .Values.minimax_m2.image.srt.tag | default .Values.sglang.latestImage.tag }}
      ports:
        - containerPort: {{ .Values.sglang.port }}
          name: grpc1
          protocol: TCP
      command:
        - python3
        - -m
        - sglang.launch_server
      args:
        - --grpc-mode
        - --served-model-name
        - vllm-model
        - --host
        - 0.0.0.0
        - --port
        - {{ .Values.sglang.port | quote }}
        - --model-path
        - $(MODEL_PATH)
        - --tp-size
        - "4"
        - --mem-fraction-static
        - "0.85"
        - --trust-remote-code
        - --enable-metrics
      volumeMounts:
        - mountPath: /dev/shm
          name: dshm
      resources:
        requests:
          cpu: 64
          memory: 512Gi
          nvidia.com/gpu: 4
        limits:
          cpu: 64
          memory: 512Gi
          nvidia.com/gpu: 4
      readinessProbe:
        grpc:
          port: 8080
        failureThreshold: 3
        successThreshold: 1
        periodSeconds: 90
        timeoutSeconds: 60
      livenessProbe:
        grpc:
          port: 8080
        failureThreshold: 5
        successThreshold: 1
        periodSeconds: 60
        timeoutSeconds: 60
      startupProbe:
        grpc:
          port: 8080
        failureThreshold: 150
        successThreshold: 1
        periodSeconds: 6
        initialDelaySeconds: 60
        timeoutSeconds: 30
