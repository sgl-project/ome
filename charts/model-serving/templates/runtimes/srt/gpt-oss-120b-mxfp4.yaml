apiVersion: ome.io/v1beta1
kind: ClusterServingRuntime
metadata:
  name: srt-gpt-oss-120b-mxfp4
spec:
  acceleratorRequirements:
    acceleratorClasses:
      - nvidia-a100-80gb-2
      - nvidia-a100-40gb-4
      - nvidia-h100-2
      - nvidia-h200-1
  disabled: false
  {{- if or .Values.commonAnnotations .Values.gpt_oss_120b.annotations }}
  annotations:
    {{- if .Values.commonAnnotations }}
    {{ toYaml .Values.commonAnnotations | nindent 4 }}
    {{- end }}
    {{- if .Values.gpt_oss_120b.annotations }}
    {{ toYaml .Values.gpt_oss_120b.annotations | nindent 4 }}
    {{- end }}
  {{- end }}
  {{- if or .Values.commonLabels .Values.gpt_oss_120b.labels }}
  labels:
    {{- if .Values.commonLabels }}
    {{ toYaml .Values.commonLabels | nindent 4 }}
    {{- end }}
    {{- if .Values.gpt_oss_120b.labels }}
    {{ toYaml .Values.gpt_oss_120b.labels | nindent 4 }}
    {{- end }}
  {{- end }}
  {{- if or .Values.commonTolerations .Values.gpt_oss_120b.tolerations }}
  tolerations:
    {{- if .Values.commonTolerations }}
    {{ toYaml .Values.commonTolerations | nindent 4 }}
    {{- end }}
    {{- if .Values.gpt_oss_120b.tolerations }}
    {{ toYaml .Values.gpt_oss_120b.tolerations | nindent 4 }}
    {{- end }}
  {{- end }}
  volumes:
    - name: dshm
      emptyDir:
        medium: Memory
    {{- if or (eq .Values.oci.realm "oc5") (eq .Values.oci.realm "oc6") }}
    - name: etc-pki
      hostPath:
        path: /etc/pki
        type: Directory
    {{- end }}
  {{ with .Values.gpt_oss_120b }}
  affinity: {{ .affinity | toYaml | nindent 4 }}
  {{ end }}
  supportedModelFormats:
    - modelFramework:
        name: transformers
        version: "4.55.0.dev0"
      modelFormat:
        name: safetensors
        version: "1.0.0"
      modelArchitecture: GptOssForCausalLM
      autoSelect: false
      priority: 1
      quantization: mxfp4
      acceleratorConfig:
        nvidia-a100-80gb-2:
          tensorParallelismOverride:
            tensorParallelSize: 2
        nvidia-a100-40gb-4:
          tensorParallelismOverride:
            tensorParallelSize: 4
        nvidia-h100-2:
          tensorParallelismOverride:
            tensorParallelSize: 2
        nvidia-h200-1:
          tensorParallelismOverride:
            tensorParallelSize: 1
  modelSizeRange:
    min: 115B
    max: 125B
  protocolVersions:
    - openAI
  schedulerName: {{ .Values.commonSchedulerName }}
  containers:
    - name: ome-container
      image: {{ .Values.gpt_oss_120b.image.repository | default .Values.sglang.commonImage.repository }}:{{ .Values.gpt_oss_120b.image.tag | default .Values.sglang.commonImage.tag }}
      ports:
        - containerPort: {{ .Values.sglang.port }}
          name: http1
          protocol: TCP
      command:
        - /bin/bash
        - '-lc'
        - --
      args:
        - |
          python -m sglang.launch_server \
          --model-path="$MODEL_PATH" \
          --host 127.0.0.1 \
          --port 31000 \
          --grpc-mode \
          --tp-size=2 \
          --enable-metrics \
          --log-requests \
          --log-requests-level=1 \
          --served-model-name="gpt-oss-120b" & sleep 120 && \
          python -m smg.launch_router \
          --worker-urls grpc://127.0.0.1:31000 \
          --host 0.0.0.0 \
          --port={{ .Values.sglang.port }} \
          --reasoning-parser=gpt-oss \
          --log-json
      volumeMounts:
        - mountPath: /dev/shm
          name: dshm
      resources:
        requests:
          cpu: 25
          memory: 100Gi
          nvidia.com/gpu: 2
        limits:
          cpu: 25
          memory: 100Gi
          nvidia.com/gpu: 2

      readinessProbe:
        httpGet:
          path: /health
          port: 8080
        failureThreshold: 3
        successThreshold: 1
        periodSeconds: 60
        timeoutSeconds: 200

      livenessProbe:
        httpGet:
          path: /health
          port: 8080
        failureThreshold: 5
        successThreshold: 1
        periodSeconds: 60
        timeoutSeconds: 60

      startupProbe:
        httpGet:
          path: /health
          port: 8080
        failureThreshold: 150
        successThreshold: 1
        periodSeconds: 6
        initialDelaySeconds: 60
        timeoutSeconds: 30
  engineConfig:
    schedulerName: {{ .Values.commonSchedulerName }}
    {{- if or .Values.commonAnnotations .Values.gpt_oss_120b.annotations }}
    annotations:
      {{- if .Values.commonAnnotations }}
      {{ toYaml .Values.commonAnnotations | nindent 6 }}
      {{- end }}
      {{- if .Values.gpt_oss_120b.annotations }}
      {{ toYaml .Values.gpt_oss_120b.annotations | nindent 6 }}
      {{- end }}
    {{- end }}
    {{- if or .Values.commonLabels .Values.gpt_oss_120b.labels }}
    labels:
      {{- if .Values.commonLabels }}
      {{ toYaml .Values.commonLabels | nindent 6 }}
      {{- end }}
      {{- if .Values.gpt_oss_120b.labels }}
      {{ toYaml .Values.gpt_oss_120b.labels | nindent 6 }}
      {{- end }}
    {{- end }}
    {{- if or .Values.commonTolerations .Values.gpt_oss_120b.tolerations }}
    tolerations:
      {{- if .Values.commonTolerations }}
      {{ toYaml .Values.commonTolerations | nindent 6 }}
      {{- end }}
      {{- if .Values.gpt_oss_120b.tolerations }}
      {{ toYaml .Values.gpt_oss_120b.tolerations | nindent 6 }}
      {{- end }}
    {{- end }}
    volumes:
      - name: dshm
        emptyDir:
          medium: Memory
        {{- if or (eq .Values.oci.realm "oc5") (eq .Values.oci.realm "oc6") }}
      - name: etc-pki
        hostPath:
          path: /etc/pki
          type: Directory
        {{- end }}
    {{ with .Values.gpt_oss_120b }}
    affinity: {{ .affinity | toYaml | nindent 6 }}
    {{ end }}
    runner:
      name: ome-container
      image: {{ .Values.gpt_oss_120b.image.repository | default .Values.sglang.commonImage.repository }}:{{ .Values.gpt_oss_120b.image.tag | default .Values.sglang.commonImage.tag }}
      ports:
        - containerPort: {{ .Values.sglang.port }}
          name: http1
          protocol: TCP
      command:
        - /bin/bash
        - '-lc'
        - --
      args:
        - |
          python -m sglang.launch_server \
          --model-path="$MODEL_PATH" \
          --host 127.0.0.1 \
          --port 31000 \
          --grpc-mode \
          --tp-size=2 \
          --enable-metrics \
          --log-requests \
          --log-requests-level=1 \
          --served-model-name="gpt-oss-120b" & sleep 120 && \
          python -m smg.launch_router \
          --worker-urls grpc://127.0.0.1:31000 \
          --host 0.0.0.0 \
          --port={{ .Values.sglang.port }} \
          --reasoning-parser=gpt-oss \
          --log-json
      volumeMounts:
        - mountPath: /dev/shm
          name: dshm
      resources:
        requests:
          cpu: 25
          memory: 100Gi
          nvidia.com/gpu: 2
        limits:
          cpu: 25
          memory: 100Gi
          nvidia.com/gpu: 2

      readinessProbe:
        httpGet:
          path: /health
          port: 8080
        failureThreshold: 3
        successThreshold: 1
        periodSeconds: 60
        timeoutSeconds: 200

      livenessProbe:
        httpGet:
          path: /health
          port: 8080
        failureThreshold: 5
        successThreshold: 1
        periodSeconds: 60
        timeoutSeconds: 60

      startupProbe:
        httpGet:
          path: /health
          port: 8080
        failureThreshold: 150
        successThreshold: 1
        periodSeconds: 6
        initialDelaySeconds: 60
        timeoutSeconds: 30
