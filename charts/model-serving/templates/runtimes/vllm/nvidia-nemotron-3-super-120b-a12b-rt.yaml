apiVersion: ome.io/v1beta1
kind: ClusterServingRuntime
metadata:
  name: vllm-nvidia-nemotron-3-super-120b-a12b
spec:
  acceleratorRequirements:
    acceleratorClasses:
      - nvidia-a100-80gb-1
      - nvidia-a100-80gb-2
      - nvidia-a100-80gb-4
      - nvidia-a100-80gb-8
      - nvidia-a100-40gb-1
      - nvidia-a100-40gb-2
      - nvidia-a100-40gb-4
      - nvidia-a100-40gb-8
      - nvidia-h100-1
      - nvidia-h100-2
      - nvidia-h100-4
      - nvidia-h100-8
      - nvidia-a10-1
      - nvidia-a10-2
      - nvidia-a10-4
      - nvidia-h200-1
      - nvidia-h200-2
      - nvidia-h200-4
      - nvidia-h200-8
  disabled: false
  {{- if or .Values.commonAnnotations .Values.nvidia_nemotron_3_super_120b_a12b.annotations }}
  annotations:
    {{- if .Values.commonAnnotations }}
    {{ toYaml .Values.commonAnnotations | nindent 4 }}
    {{- end }}
    {{- if .Values.nvidia_nemotron_3_super_120b_a12b.annotations }}
    {{ toYaml .Values.nvidia_nemotron_3_super_120b_a12b.annotations | nindent 4 }}
    {{- end }}
  {{- end }}
  {{- if or .Values.commonLabels .Values.nvidia_nemotron_3_super_120b_a12b.labels }}
  labels:
    {{- if .Values.commonLabels }}
    {{ toYaml .Values.commonLabels | nindent 4 }}
    {{- end }}
    {{- if .Values.nvidia_nemotron_3_super_120b_a12b.labels }}
    {{ toYaml .Values.nvidia_nemotron_3_super_120b_a12b.labels | nindent 4 }}
    {{- end }}
  {{- end }}
  {{- if or .Values.commonTolerations .Values.nvidia_nemotron_3_super_120b_a12b.tolerations }}
  tolerations:
    {{- if .Values.commonTolerations }}
    {{ toYaml .Values.commonTolerations | nindent 4 }}
    {{- end }}
    {{- if .Values.nvidia_nemotron_3_super_120b_a12b.tolerations }}
    {{ toYaml .Values.nvidia_nemotron_3_super_120b_a12b.tolerations | nindent 4 }}
    {{- end }}
  {{- end }}
  volumes:
    - name: dshm
      emptyDir:
        medium: Memory
    {{- if or (eq .Values.oci.realm "oc5") (eq .Values.oci.realm "oc6") }}
    - name: etc-pki
      hostPath:
        path: /etc/pki
        type: Directory
    {{- end }}
  {{ with .Values.nvidia_nemotron_3_super_120b_a12b }}
  affinity: {{ .affinity | toYaml | nindent 4 }}
  {{ end }}
  supportedModelFormats:
    - modelFramework:
        name: transformers
        version: "4.57.6"
      modelFormat:
        name: safetensors
        version: "1.0.0"
      modelArchitecture: NemotronHForCausalLM
      autoSelect: true
      priority: 1
      acceleratorConfig:
        nvidia-a100-80gb-1:
          tensorParallelismOverride:
            tensorParallelSize: 1
        nvidia-a100-80gb-2:
          tensorParallelismOverride:
            tensorParallelSize: 2
        nvidia-a100-80gb-4:
          tensorParallelismOverride:
            tensorParallelSize: 4
        nvidia-a100-80gb-8:
          tensorParallelismOverride:
            tensorParallelSize: 8
        nvidia-a100-40gb-1:
          tensorParallelismOverride:
            tensorParallelSize: 1
        nvidia-a100-40gb-2:
          tensorParallelismOverride:
            tensorParallelSize: 2
        nvidia-a100-40gb-4:
          tensorParallelismOverride:
            tensorParallelSize: 4
        nvidia-a100-40gb-8:
          tensorParallelismOverride:
            tensorParallelSize: 8
        nvidia-h100-1:
          tensorParallelismOverride:
            tensorParallelSize: 1
        nvidia-h100-2:
          tensorParallelismOverride:
            tensorParallelSize: 2
        nvidia-h100-4:
          tensorParallelismOverride:
            tensorParallelSize: 4
        nvidia-h100-8:
          tensorParallelismOverride:
            tensorParallelSize: 8
        nvidia-a10-1:
          tensorParallelismOverride:
            tensorParallelSize: 1
        nvidia-a10-2:
          tensorParallelismOverride:
            tensorParallelSize: 2
        nvidia-a10-4:
          tensorParallelismOverride:
            tensorParallelSize: 4
        nvidia-h200-1:
          tensorParallelismOverride:
            tensorParallelSize: 1
        nvidia-h200-2:
          tensorParallelismOverride:
            tensorParallelSize: 2
        nvidia-h200-4:
          tensorParallelismOverride:
            tensorParallelSize: 4
        nvidia-h200-8:
          tensorParallelismOverride:
            tensorParallelSize: 8
  modelSizeRange:
    min: 115B
    max: 125B
  protocolVersions:
    - openAI
  schedulerName: {{ .Values.commonSchedulerName }}
  containers:
    - name: ome-container
      image: {{ .Values.nvidia_nemotron_3_super_120b_a12b.image.vllm.repository | default .Values.vllm.commonImage.repository }}:{{ .Values.nvidia_nemotron_3_super_120b_a12b.image.vllm.tag | default .Values.vllm.latestImage.tag }}
      ports:
        - containerPort: {{ .Values.vllm.port }}
          name: http1
          protocol: TCP
      command:
        - /bin/bash
        - '-lc'
        - --
      args:
        - |
          vllm serve "$MODEL_PATH" \
          --host 0.0.0.0 \
          --port {{ .Values.vllm.port }} \
          --async-scheduling \
          --dtype auto \
          --kv-cache-dtype fp8 \
          --tensor-parallel-size 8 \
          --pipeline-parallel-size 1 \
          --data-parallel-size 1 \
          --max-model-len 1048576 \
          --enable-expert-parallel \
          --swap-space 0 \
          --trust-remote-code \
          --gpu-memory-utilization 0.9 \
          --enable-chunked-prefill \
          --mamba-ssm-cache-dtype float16 \
          --served-model-name {{ .Values.vllm.serveModelName }} \
          --enable-auto-tool-choice \
          --tool-call-parser qwen3_coder \
          --reasoning-parser nano_v3 \
          --reasoning-parser-plugin /app/nano_v3_reasoning_parser.py
      env:
        - name: VLLM_ALLOW_LONG_MAX_MODEL_LEN
          value: '1'
      volumeMounts:
        - mountPath: /dev/shm
          name: dshm
      resources:
        requests:
          cpu: 128
          memory: 512Gi
          nvidia.com/gpu: 8
        limits:
          cpu: 128
          memory: 512Gi
          nvidia.com/gpu: 8
      readinessProbe:
        httpGet:
          path: /health
          port: 8080
        failureThreshold: 3
        successThreshold: 1
        periodSeconds: 60
        timeoutSeconds: 200
      livenessProbe:
        httpGet:
          path: /health
          port: 8080
        failureThreshold: 5
        successThreshold: 1
        periodSeconds: 60
        timeoutSeconds: 60
      startupProbe:
        httpGet:
          path: /health
          port: 8080
        failureThreshold: 150
        successThreshold: 1
        periodSeconds: 6
        initialDelaySeconds: 60
        timeoutSeconds: 30
  engineConfig:
    schedulerName: {{ .Values.commonSchedulerName }}
    {{- if or .Values.commonAnnotations .Values.nvidia_nemotron_3_super_120b_a12b.annotations }}
    annotations:
      {{- if .Values.commonAnnotations }}
      {{ toYaml .Values.commonAnnotations | nindent 6 }}
      {{- end }}
      {{- if .Values.nvidia_nemotron_3_super_120b_a12b.annotations }}
      {{ toYaml .Values.nvidia_nemotron_3_super_120b_a12b.annotations | nindent 6 }}
      {{- end }}
    {{- end }}
    {{- if or .Values.commonLabels .Values.nvidia_nemotron_3_super_120b_a12b.labels }}
    labels:
      {{- if .Values.commonLabels }}
      {{ toYaml .Values.commonLabels | nindent 6 }}
      {{- end }}
      {{- if .Values.nvidia_nemotron_3_super_120b_a12b.labels }}
      {{ toYaml .Values.nvidia_nemotron_3_super_120b_a12b.labels | nindent 6 }}
      {{- end }}
    {{- end }}
    {{- if or .Values.commonTolerations .Values.nvidia_nemotron_3_super_120b_a12b.tolerations }}
    tolerations:
      {{- if .Values.commonTolerations }}
      {{ toYaml .Values.commonTolerations | nindent 6 }}
      {{- end }}
      {{- if .Values.nvidia_nemotron_3_super_120b_a12b.tolerations }}
      {{ toYaml .Values.nvidia_nemotron_3_super_120b_a12b.tolerations | nindent 6 }}
      {{- end }}
    {{- end }}
    volumes:
      - name: dshm
        emptyDir:
          medium: Memory
      {{- if or (eq .Values.oci.realm "oc5") (eq .Values.oci.realm "oc6") }}
      - name: etc-pki
        hostPath:
          path: /etc/pki
          type: Directory
      {{- end }}
    {{ with .Values.nvidia_nemotron_3_super_120b_a12b }}
    affinity: {{ .affinity | toYaml | nindent 6 }}
    {{ end }}
    runner:
      name: ome-container
      image: {{ .Values.nvidia_nemotron_3_super_120b_a12b.image.vllm.repository | default .Values.vllm.commonImage.repository }}:{{ .Values.nvidia_nemotron_3_super_120b_a12b.image.vllm.tag | default .Values.vllm.latestImage.tag }}
      ports:
        - containerPort: {{ .Values.vllm.port }}
          name: http1
          protocol: TCP
      command:
        - /bin/bash
        - '-lc'
        - --
      args:
        - |
          vllm serve "$MODEL_PATH" \
          --host 0.0.0.0 \
          --port {{ .Values.vllm.port }} \
          --async-scheduling \
          --dtype auto \
          --kv-cache-dtype fp8 \
          --tensor-parallel-size 8 \
          --pipeline-parallel-size 1 \
          --data-parallel-size 1 \
          --max-model-len 1048576 \
          --enable-expert-parallel \
          --swap-space 0 \
          --trust-remote-code \
          --gpu-memory-utilization 0.9 \
          --enable-chunked-prefill \
          --mamba-ssm-cache-dtype float16 \
          --served-model-name {{ .Values.vllm.serveModelName }} \
          --enable-auto-tool-choice \
          --tool-call-parser qwen3_coder \
          --reasoning-parser nano_v3 \
          --reasoning-parser-plugin /app/nano_v3_reasoning_parser.py
      env:
        - name: VLLM_ALLOW_LONG_MAX_MODEL_LEN
          value: '1'
      volumeMounts:
        - mountPath: /dev/shm
          name: dshm
      resources:
        requests:
          cpu: 128
          memory: 512Gi
          nvidia.com/gpu: 8
        limits:
          cpu: 128
          memory: 512Gi
          nvidia.com/gpu: 8
      readinessProbe:
        httpGet:
          path: /health
          port: 8080
        failureThreshold: 3
        successThreshold: 1
        periodSeconds: 60
        timeoutSeconds: 200
      livenessProbe:
        httpGet:
          path: /health
          port: 8080
        failureThreshold: 5
        successThreshold: 1
        periodSeconds: 60
        timeoutSeconds: 60
      startupProbe:
        httpGet:
          path: /health
          port: 8080
        failureThreshold: 150
        successThreshold: 1
        periodSeconds: 6
        initialDelaySeconds: 60
        timeoutSeconds: 30