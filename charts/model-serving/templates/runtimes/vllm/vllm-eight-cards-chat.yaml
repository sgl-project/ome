apiVersion: ome.io/v1beta1
kind: ClusterServingRuntime
metadata:
  name: vllm-eight-card-chat
spec:
  {{- if or .Values.commonAnnotations .Values.llama_3_1_405b_instruct.annotations }}
  annotations:
    {{- if .Values.commonAnnotations }}
    {{ toYaml .Values.commonAnnotations | nindent 6 }}
    {{- end }}
    {{- if .Values.llama_3_1_405b_instruct.annotations }}
    {{ toYaml .Values.llama_3_1_405b_instruct.annotations | nindent 6 }}
    {{- end }}
  {{- end }}
  {{with .Values.commonLabels}}
  labels: {{ toYaml . | nindent 6 }}
  {{end}}
  {{with .Values.commonTolerations}}
  tolerations: {{ toYaml . | nindent 6 }}
  {{end}}
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node.kubernetes.io/instance-type
                operator: In
                values:
                  - BM.GPU.H100.8
  supportedModelFormats:
    - name: safetensors
      modelType: transformer
      modelArchitecture: LlamaForCausalLM
      version: "1"
      autoSelect: false
      priority: 1
  volumes:
    - name: dshm
      emptyDir:
        medium: Memory
    - emptyDir: { }
      name: log-volume
  protocolVersions:
    - openAI
  containers:
    - name: ome-container
      image: {{ .Values.llama_3_1_405b_instruct.image.repository }}:{{ .Values.llama_3_1_405b_instruct.image.tag }}
      command:
        - /bin/bash
        - '-lc'
        - --
      ports:
        - containerPort: 8080
          name: http1
          protocol: TCP
      env:
        - name: VLLM_RPC_TIMEOUT
          value: '30000'
        - name: VLLM_ENGINE_ITERATION_TIMEOUT_S
          value: '120'
      args:
        - |
          python3 -m vllm.entrypoints.openai.api_server \
          --port={{.Values.vllm.port}} \
          --middleware=vllm.entrypoints.openai.middleware.log_opc_header \
          --model="$MODEL_PATH" \
          --max-log-len=1 \
          --served-model-name={{.Values.vllm.serveModelName}} \
          --tensor-parallel-size=8 \
          --enable-chunked-prefill \
          --gpu-memory-utilization=0.95 \
          --max-model-len=131072 \
          --preemption-mode=swap \
          --swap-space=10 \
          --enable-auto-tool-choice \
          --tool-call-parser llama3_json \
          --chat-template examples/tool_chat_template_llama3.1_json.jinja
      volumeMounts:
        - mountPath: /dev/shm
          name: dshm
        - mountPath: /tmp/ray
          name: log-volume
      resources:
        requests:
          cpu: 120
          memory: 1000Gi
          nvidia.com/gpu: 8
        limits:
          cpu: 120
          memory: 1000Gi
          nvidia.com/gpu: 8

      readinessProbe:
        httpGet:
          path: /health
          port: 8080
        failureThreshold: 3
        successThreshold: 1
        periodSeconds: 60
        timeoutSeconds: 200

      livenessProbe:
        httpGet:
          path: /health
          port: 8080
        failureThreshold: 5
        successThreshold: 1
        periodSeconds: 60
        timeoutSeconds: 60

      startupProbe:
        httpGet:
          path: /health
          port: 8080
        failureThreshold: 150
        successThreshold: 1
        periodSeconds: 6
        initialDelaySeconds: 15
        timeoutSeconds: 30