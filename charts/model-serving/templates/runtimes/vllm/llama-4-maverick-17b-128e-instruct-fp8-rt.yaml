apiVersion: ome.io/v1beta1
kind: ClusterServingRuntime
metadata:
  name: vllm-llama-4-maverick-17b-128e-instruct-fp8
spec:
  acceleratorRequirements:
    acceleratorClasses:
      - nvidia-h100-8
      - nvidia-a100-80gb-8
      - nvidia-h200-4
      - nvidia-h200-8
      - nvidia-b200-2
      - nvidia-b200-4
      - nvidia-b200-8
  disabled: false
  {{- if or .Values.commonAnnotations .Values.llama_4_maverick_17b_128e_instruct_fp8.annotations }}
  annotations:
    {{- if .Values.commonAnnotations }}
    {{ toYaml .Values.commonAnnotations | nindent 4 }}
    {{- end }}
    {{- if .Values.llama_4_maverick_17b_128e_instruct_fp8.annotations }}
    {{ toYaml .Values.llama_4_maverick_17b_128e_instruct_fp8.annotations | nindent 4 }}
    {{- end }}
  {{- end }}
  {{- if or .Values.commonLabels .Values.llama_4_maverick_17b_128e_instruct_fp8.labels }}
  labels:
    {{- if .Values.commonLabels }}
    {{ toYaml .Values.commonLabels | nindent 4 }}
    {{- end }}
    {{- if .Values.llama_4_maverick_17b_128e_instruct_fp8.labels }}
    {{ toYaml .Values.llama_4_maverick_17b_128e_instruct_fp8.labels | nindent 4 }}
    {{- end }}
  {{- end }}
  {{- if or .Values.commonTolerations .Values.llama_4_maverick_17b_128e_instruct_fp8.tolerations }}
  tolerations:
    {{- if .Values.commonTolerations }}
    {{ toYaml .Values.commonTolerations | nindent 4 }}
    {{- end }}
    {{- if .Values.llama_4_maverick_17b_128e_instruct_fp8.tolerations }}
    {{ toYaml .Values.llama_4_maverick_17b_128e_instruct_fp8.tolerations | nindent 4 }}
    {{- end }}
  {{- end }}
  supportedModelFormats:
    - modelFramework:
        name: transformers
        version: "4.51.0.dev0"
      modelFormat:
        name: safetensors
        version: "1.0.0"
      modelArchitecture: Llama4ForConditionalGeneration
      autoSelect: false
      priority: 1
      version: "1.0.0"
      quantization: fp8
      acceleratorConfig:
        nvidia-a100-80gb-8:
          tensorParallelismOverride:
            tensorParallelSize: 8
        nvidia-h100-8:
          tensorParallelismOverride:
            tensorParallelSize: 8
        nvidia-h200-4:
          tensorParallelismOverride:
            tensorParallelSize: 4
        nvidia-h200-8:
          tensorParallelismOverride:
            tensorParallelSize: 8
        nvidia-b200-2:
          tensorParallelismOverride:
            tensorParallelSize: 2
        nvidia-b200-4:
          tensorParallelismOverride:
            tensorParallelSize: 4
        nvidia-b200-8:
          tensorParallelismOverride:
            tensorParallelSize: 8
    - modelFramework:
        name: transformers
        version: "4.51.0.dev0"
      modelFormat:
        name: safetensors
        version: "1.0.0"
      modelArchitecture: Llama4ForConditionalGeneration
      autoSelect: false
      priority: 1
      version: "1.0.0"
      quantization: compressed-tensors
      acceleratorConfig:
        nvidia-a100-80gb-8:
          tensorParallelismOverride:
            tensorParallelSize: 8
        nvidia-h100-8:
          tensorParallelismOverride:
            tensorParallelSize: 8
        nvidia-h200-4:
          tensorParallelismOverride:
            tensorParallelSize: 4
        nvidia-h200-8:
          tensorParallelismOverride:
            tensorParallelSize: 8
        nvidia-b200-2:
          tensorParallelismOverride:
            tensorParallelSize: 2
        nvidia-b200-4:
          tensorParallelismOverride:
            tensorParallelSize: 4
        nvidia-b200-8:
          tensorParallelismOverride:
            tensorParallelSize: 8
  volumes:
    - name: dshm
      emptyDir:
        medium: Memory
    {{- if or (eq .Values.oci.realm "oc5") (eq .Values.oci.realm "oc6") }}
    - name: etc-pki
      hostPath:
        path: /etc/pki
        type: Directory
    {{- end }}
  protocolVersions:
    - openAI
  schedulerName: {{ .Values.commonSchedulerName }}
  modelSizeRange:
    min: 400B
    max: 410B
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node.kubernetes.io/instance-type
                operator: In
                values:
                  - BM.GPU.H100.8
                  - BM.GPU.H200.8
                  - BM.GPU.H200-NC.8
                  - BM.GPU.H100-NC.8
  containers:
    - name: ome-container
      image: {{ .Values.llama_4_maverick_17b_128e_instruct_fp8.image.vllm.repository | default .Values.vllm.commonImage.repository }}:{{ .Values.llama_4_maverick_17b_128e_instruct_fp8.image.vllm.tag | default .Values.vllm.latestImage.tag }}
      ports:
        - containerPort: 8080
          name: http1
          protocol: TCP
      args:
        - $(MODEL_PATH)
        - --port=8080
        - --max-log-len=0
        - --served-model-name=vllm-model
        - --tensor-parallel-size=8
        - --max-model-len=524288
        - '--limit-mm-per-prompt={"image": 10}'
        - --enable-auto-tool-choice
        - --tool-call-parser=pythonic
        - --chat-template=examples/tool_chat_template_llama4_pythonic.jinja
      volumeMounts:
        - mountPath: /dev/shm
          name: dshm
      resources:
        requests:
          cpu: 128
          memory: 512Gi
          nvidia.com/gpu: 8
        limits:
          cpu: 128
          memory: 512Gi
          nvidia.com/gpu: 8

      readinessProbe:
        httpGet:
          path: /health
          port: 8080
        failureThreshold: 3
        successThreshold: 1
        periodSeconds: 60
        timeoutSeconds: 200

      livenessProbe:
        httpGet:
          path: /health
          port: 8080
        failureThreshold: 5
        successThreshold: 1
        periodSeconds: 60
        timeoutSeconds: 60

      startupProbe:
        httpGet:
          path: /health
          port: 8080
        failureThreshold: 150
        successThreshold: 1
        periodSeconds: 6
        initialDelaySeconds: 60
        timeoutSeconds: 30
  engineConfig:
    {{- if or .Values.commonAnnotations .Values.llama_4_maverick_17b_128e_instruct_fp8.annotations }}
    annotations:
      {{- if .Values.commonAnnotations }}
      {{ toYaml .Values.commonAnnotations | nindent 6 }}
      {{- end }}
      {{- if .Values.llama_4_maverick_17b_128e_instruct_fp8.annotations }}
      {{ toYaml .Values.llama_4_maverick_17b_128e_instruct_fp8.annotations | nindent 6 }}
      {{- end }}
    {{- end }}
    {{- if or .Values.commonLabels .Values.llama_4_maverick_17b_128e_instruct_fp8.labels }}
    labels:
      {{- if .Values.commonLabels }}
      {{ toYaml .Values.commonLabels | nindent 6 }}
      {{- end }}
      {{- if .Values.llama_4_maverick_17b_128e_instruct_fp8.labels }}
      {{ toYaml .Values.llama_4_maverick_17b_128e_instruct_fp8.labels | nindent 6 }}
      {{- end }}
    {{- end }}
    {{- if or .Values.commonTolerations .Values.llama_4_maverick_17b_128e_instruct_fp8.tolerations }}
    tolerations:
      {{- if .Values.commonTolerations }}
      {{ toYaml .Values.commonTolerations | nindent 6 }}
      {{- end }}
      {{- if .Values.llama_4_maverick_17b_128e_instruct_fp8.tolerations }}
      {{ toYaml .Values.llama_4_maverick_17b_128e_instruct_fp8.tolerations | nindent 6 }}
      {{- end }}
    {{- end }}
    volumes:
      - name: dshm
        emptyDir:
          medium: Memory
      {{- if or (eq .Values.oci.realm "oc5") (eq .Values.oci.realm "oc6") }}
      - name: etc-pki
        hostPath:
          path: /etc/pki
          type: Directory
      {{- end }}
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node.kubernetes.io/instance-type
                  operator: In
                  values:
                    - BM.GPU.H100.8
                    - BM.GPU.H200.8
                    - BM.GPU.H200-NC.8
                    - BM.GPU.H100-NC.8
    schedulerName: {{ .Values.commonSchedulerName }}
    runner:
      name: ome-container
      image: {{ .Values.llama_4_maverick_17b_128e_instruct_fp8.image.vllm.repository | default .Values.vllm.commonImage.repository }}:{{ .Values.llama_4_maverick_17b_128e_instruct_fp8.image.vllm.tag | default .Values.vllm.latestImage.tag }}
      ports:
        - containerPort: 8080
          name: http1
          protocol: TCP
      args:
        - $(MODEL_PATH)
        - --port=8080
        - --max-log-len=0
        - --served-model-name=vllm-model
        - --tensor-parallel-size=8
        - --max-model-len=524288
        - '--limit-mm-per-prompt={"image": 10}'
        - --enable-auto-tool-choice
        - --tool-call-parser=pythonic
        - --chat-template=examples/tool_chat_template_llama4_pythonic.jinja
      volumeMounts:
        - mountPath: /dev/shm
          name: dshm
      resources:
        requests:
          cpu: 128
          memory: 512Gi
          nvidia.com/gpu: 8
        limits:
          cpu: 128
          memory: 512Gi
          nvidia.com/gpu: 8
      readinessProbe:
        httpGet:
          path: /health
          port: 8080
        failureThreshold: 3
        successThreshold: 1
        periodSeconds: 60
        timeoutSeconds: 200
      livenessProbe:
        httpGet:
          path: /health
          port: 8080
        failureThreshold: 5
        successThreshold: 1
        periodSeconds: 60
        timeoutSeconds: 60
      startupProbe:
        httpGet:
          path: /health
          port: 8080
        failureThreshold: 150
        successThreshold: 1
        periodSeconds: 6
        initialDelaySeconds: 60
        timeoutSeconds: 30
