apiVersion: ome.io/v1beta1
kind: ClusterServingRuntime
metadata:
  name: vllm-nemotron-3-nano-omni-30b-a3b-reasoning
spec:
  acceleratorRequirements:
    acceleratorClasses:
      - nvidia-a100-80gb-1
      - nvidia-a100-80gb-2
      - nvidia-a100-80gb-4
      - nvidia-a100-80gb-8
      - nvidia-a100-40gb-1
      - nvidia-a100-40gb-2
      - nvidia-a100-40gb-4
      - nvidia-a100-40gb-8
      - nvidia-h100-1
      - nvidia-h100-2
      - nvidia-h100-4
      - nvidia-h100-8
      - nvidia-a10-1
      - nvidia-a10-2
      - nvidia-a10-4
      - nvidia-h200-1
      - nvidia-h200-2
      - nvidia-h200-4
      - nvidia-h200-8
  disabled: false
  {{- if or .Values.commonAnnotations .Values.nemotron_3_nano_omni_30b_a3b_reasoning.annotations }}
  annotations:
    {{- if .Values.commonAnnotations }}
    {{ toYaml .Values.commonAnnotations | nindent 4 }}
    {{- end }}
    {{- if .Values.nemotron_3_nano_omni_30b_a3b_reasoning.annotations }}
    {{ toYaml .Values.nemotron_3_nano_omni_30b_a3b_reasoning.annotations | nindent 4 }}
    {{- end }}
  {{- end }}
  {{- if or .Values.commonLabels .Values.nemotron_3_nano_omni_30b_a3b_reasoning.labels }}
  labels:
    {{- if .Values.commonLabels }}
    {{ toYaml .Values.commonLabels | nindent 4 }}
    {{- end }}
    {{- if .Values.nemotron_3_nano_omni_30b_a3b_reasoning.labels }}
    {{ toYaml .Values.nemotron_3_nano_omni_30b_a3b_reasoning.labels | nindent 4 }}
    {{- end }}
  {{- end }}
  {{- if or .Values.commonTolerations .Values.nemotron_3_nano_omni_30b_a3b_reasoning.tolerations }}
  tolerations:
    {{- if .Values.commonTolerations }}
    {{ toYaml .Values.commonTolerations | nindent 4 }}
    {{- end }}
    {{- if .Values.nemotron_3_nano_omni_30b_a3b_reasoning.tolerations }}
    {{ toYaml .Values.nemotron_3_nano_omni_30b_a3b_reasoning.tolerations | nindent 4 }}
    {{- end }}
  {{- end }}
  volumes:
    - name: dshm
      emptyDir:
        medium: Memory
    {{- if or (eq .Values.oci.realm "oc5") (eq .Values.oci.realm "oc6") }}
    - name: etc-pki
      hostPath:
        path: /etc/pki
        type: Directory
    {{- end }}
  {{ with .Values.nemotron_3_nano_omni_30b_a3b_reasoning }}
  affinity: {{ .affinity | toYaml | nindent 4 }}
  {{ end }}
  supportedModelFormats:
    - modelFramework:
        name: transformers
        version: "4.55.4"
      modelFormat:
        name: safetensors
        version: "1.0.0"
      modelArchitecture: NemotronH_Nano_Omni_Reasoning_V3
      autoSelect: true
      priority: 1
      version: "1.0.0"
      acceleratorConfig:
        nvidia-a100-80gb-1:
          tensorParallelismOverride:
            tensorParallelSize: 1
        nvidia-a100-80gb-2:
          tensorParallelismOverride:
            tensorParallelSize: 2
        nvidia-a100-80gb-4:
          tensorParallelismOverride:
            tensorParallelSize: 4
        nvidia-a100-80gb-8:
          tensorParallelismOverride:
            tensorParallelSize: 8
        nvidia-a100-40gb-1:
          tensorParallelismOverride:
            tensorParallelSize: 1
        nvidia-a100-40gb-2:
          tensorParallelismOverride:
            tensorParallelSize: 2
        nvidia-a100-40gb-4:
          tensorParallelismOverride:
            tensorParallelSize: 4
        nvidia-a100-40gb-8:
          tensorParallelismOverride:
            tensorParallelSize: 8
        nvidia-h100-1:
          tensorParallelismOverride:
            tensorParallelSize: 1
        nvidia-h100-2:
          tensorParallelismOverride:
            tensorParallelSize: 2
        nvidia-h100-4:
          tensorParallelismOverride:
            tensorParallelSize: 4
        nvidia-h100-8:
          tensorParallelismOverride:
            tensorParallelSize: 8
        nvidia-a10-1:
          tensorParallelismOverride:
            tensorParallelSize: 1
        nvidia-a10-2:
          tensorParallelismOverride:
            tensorParallelSize: 2
        nvidia-a10-4:
          tensorParallelismOverride:
            tensorParallelSize: 4
        nvidia-h200-1:
          tensorParallelismOverride:
            tensorParallelSize: 1
        nvidia-h200-2:
          tensorParallelismOverride:
            tensorParallelSize: 2
        nvidia-h200-4:
          tensorParallelismOverride:
            tensorParallelSize: 4
        nvidia-h200-8:
          tensorParallelismOverride:
            tensorParallelSize: 8
  modelSizeRange:
    min: 29B
    max: 34B
  protocolVersions:
    - openAI
  schedulerName: {{ .Values.commonSchedulerName }}
  containers:
    - name: ome-container
      image: {{ .Values.nemotron_3_nano_omni_30b_a3b_reasoning.image.vllm.repository | default .Values.vllm.commonImage.repository }}:{{ .Values.nemotron_3_nano_omni_30b_a3b_reasoning.image.vllm.tag | default .Values.vllm.latestImage.tag }}
      ports:
        - containerPort: {{ .Values.vllm.port }}
          name: http1
          protocol: TCP
      command:
        - /bin/bash
        - '-lc'
        - --
      args:
        - |
          vllm serve "$MODEL_PATH" \
          --host 0.0.0.0 \
          --port {{ .Values.vllm.port }} \
          --served-model-name {{ .Values.vllm.serveModelName }} \
          --enable-chunked-prefill \
          --gpu-memory-utilization 0.9 \
          --max-model-len 131072 \
          --media-io-kwargs '{"video":{"num_frames":512,"fps":1}}' \
          --tensor-parallel-size 1 \
          --trust-remote-code \
          --video-pruning-rate 0.5 \
          --reasoning-parser nemotron_v3 \
          --tool-call-parser qwen3_coder \
          --enable-auto-tool-choice \
          --max-num-seqs 256
      volumeMounts:
        - mountPath: /dev/shm
          name: dshm
      resources:
        requests:
          cpu: 40
          memory: 120Gi
          nvidia.com/gpu: 1
        limits:
          cpu: 40
          memory: 120Gi
          nvidia.com/gpu: 1
      readinessProbe:
        httpGet:
          path: /health
          port: 8080
        failureThreshold: 3
        successThreshold: 1
        periodSeconds: 60
        timeoutSeconds: 200
      livenessProbe:
        httpGet:
          path: /health
          port: 8080
        failureThreshold: 5
        successThreshold: 1
        periodSeconds: 60
        timeoutSeconds: 60
      startupProbe:
        httpGet:
          path: /health
          port: 8080
        failureThreshold: 150
        successThreshold: 1
        periodSeconds: 6
        initialDelaySeconds: 60
        timeoutSeconds: 30
  engineConfig:
    schedulerName: {{ .Values.commonSchedulerName }}
    {{- if or .Values.commonAnnotations .Values.nemotron_3_nano_omni_30b_a3b_reasoning.annotations }}
    annotations:
      {{- if .Values.commonAnnotations }}
      {{ toYaml .Values.commonAnnotations | nindent 6 }}
      {{- end }}
      {{- if .Values.nemotron_3_nano_omni_30b_a3b_reasoning.annotations }}
      {{ toYaml .Values.nemotron_3_nano_omni_30b_a3b_reasoning.annotations | nindent 6 }}
      {{- end }}
    {{- end }}
    {{- if or .Values.commonLabels .Values.nemotron_3_nano_omni_30b_a3b_reasoning.labels }}
    labels:
      {{- if .Values.commonLabels }}
      {{ toYaml .Values.commonLabels | nindent 6 }}
      {{- end }}
      {{- if .Values.nemotron_3_nano_omni_30b_a3b_reasoning.labels }}
      {{ toYaml .Values.nemotron_3_nano_omni_30b_a3b_reasoning.labels | nindent 6 }}
      {{- end }}
    {{- end }}
    {{- if or .Values.commonTolerations .Values.nemotron_3_nano_omni_30b_a3b_reasoning.tolerations }}
    tolerations:
      {{- if .Values.commonTolerations }}
      {{ toYaml .Values.commonTolerations | nindent 6 }}
      {{- end }}
      {{- if .Values.nemotron_3_nano_omni_30b_a3b_reasoning.tolerations }}
      {{ toYaml .Values.nemotron_3_nano_omni_30b_a3b_reasoning.tolerations | nindent 6 }}
      {{- end }}
    {{- end }}
    volumes:
      - name: dshm
        emptyDir:
          medium: Memory
      {{- if or (eq .Values.oci.realm "oc5") (eq .Values.oci.realm "oc6") }}
      - name: etc-pki
        hostPath:
          path: /etc/pki
          type: Directory
      {{- end }}
    {{ with .Values.nemotron_3_nano_omni_30b_a3b_reasoning }}
    affinity: {{ .affinity | toYaml | nindent 6 }}
    {{ end }}
    runner:
      name: ome-container
      image: {{ .Values.nemotron_3_nano_omni_30b_a3b_reasoning.image.vllm.repository | default .Values.vllm.commonImage.repository }}:{{ .Values.nemotron_3_nano_omni_30b_a3b_reasoning.image.vllm.tag | default .Values.vllm.latestImage.tag }}
      ports:
        - containerPort: {{ .Values.vllm.port }}
          name: http1
          protocol: TCP
      command:
        - /bin/bash
        - '-lc'
        - --
      args:
        - |
          vllm serve "$MODEL_PATH" \
          --host 0.0.0.0 \
          --port {{ .Values.vllm.port }} \
          --served-model-name {{ .Values.vllm.serveModelName }} \
          --enable-chunked-prefill \
          --gpu-memory-utilization 0.9 \
          --max-model-len 131072 \
          --media-io-kwargs '{"video":{"num_frames":512,"fps":1}}' \
          --tensor-parallel-size 1 \
          --trust-remote-code \
          --video-pruning-rate 0.5 \
          --reasoning-parser nemotron_v3 \
          --tool-call-parser qwen3_coder \
          --enable-auto-tool-choice \
          --max-num-seqs 256
      volumeMounts:
        - mountPath: /dev/shm
          name: dshm
      resources:
        requests:
          cpu: 40
          memory: 120Gi
          nvidia.com/gpu: 1
        limits:
          cpu: 40
          memory: 120Gi
          nvidia.com/gpu: 1
      readinessProbe:
        httpGet:
          path: /health
          port: 8080
        failureThreshold: 3
        successThreshold: 1
        periodSeconds: 60
        timeoutSeconds: 200
      livenessProbe:
        httpGet:
          path: /health
          port: 8080
        failureThreshold: 5
        successThreshold: 1
        periodSeconds: 60
        timeoutSeconds: 60
      startupProbe:
        httpGet:
          path: /health
          port: 8080
        failureThreshold: 150
        successThreshold: 1
        periodSeconds: 6
        initialDelaySeconds: 60
        timeoutSeconds: 30
