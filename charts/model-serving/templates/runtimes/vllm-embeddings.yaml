apiVersion: ome.io/v1beta1
kind: ClusterServingRuntime
metadata:
  name: vllm-embeddings
spec:
  {{with .Values.commonAnnotations}}
  annotations: {{ toYaml . | nindent 6 }}
  {{end}}
  {{with .Values.commonLabels}}
  labels: {{ toYaml . | nindent 6 }}
  {{end}}
  {{with .Values.commonTolerations}}
  tolerations: {{ toYaml . | nindent 6 }}
  {{end}}
  volumes:
    - name: dshm
      emptyDir:
        medium: Memory
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node.kubernetes.io/instance-type
                operator: In
                values:
                  - BM.GPU.B4.8
                  - BM.GPU4.8
                  - BM.GPU.A100-v2.8
                  - BM.GPU.H100.8
  supportedModelFormats:
    - name: safetensors
      modelType: transformer
      modelArchitecture: MistralModel
      version: "1"
      autoSelect: true
      priority: 1
  protocolVersions:
    - openAI
  containers:
    - name: ome-container
      image: {{ .Values.vllm.commonImage.repository }}:{{ .Values.vllm.commonImage.tag }}
      ports:
        - containerPort: 8080
          name: http
          protocol: TCP
      command:
        - /bin/bash
        - '-lc'
        - --
      args:
        - |
          python3 -m vllm.entrypoints.openai.api_server \
          --port={{.Values.vllm.port}} \
          --disable-log-stats \
          --model="$MODEL_PATH" \
          --disable-log-requests \
          --served-model-name={{.Values.vllm.serveModelName}} \
          --tensor-parallel-size=1 \
          --middleware=vllm.entrypoints.openai.middleware.log_opc_header \
          --enforce-eager \
          --gpu-memory-utilization=0.8 \
      volumeMounts:
        - mountPath: /dev/shm
          name: dshm
      resources:
        requests:
          cpu: 10
          memory: 160Gi
          nvidia.com/gpu: 1
        limits:
          cpu: 10
          memory: 160Gi
          nvidia.com/gpu: 1

      readinessProbe:
        httpGet:
          path: /health
          port: 8080
        failureThreshold: 3
        successThreshold: 1
        periodSeconds: 60
        timeoutSeconds: 200

      livenessProbe:
        httpGet:
          path: /health
          port: 8080
        failureThreshold: 5
        successThreshold: 1
        periodSeconds: 60
        timeoutSeconds: 60

      startupProbe:
        httpGet:
          path: /health
          port: 8080
        failureThreshold: 150
        successThreshold: 1
        periodSeconds: 6
        initialDelaySeconds: 60
        timeoutSeconds: 30