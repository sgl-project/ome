vllm:
  port: 8080
  serveModelName: vllm-model
  commonImage:
    repository: &defaultVLLMImage fra.ocir.io/idqj093njucb/official-vllm-openai
    tag: &defaultVLLMImageTag 0.5.3.post1.7f8d612d-log
  llama3_2_image:
    tag: &llama_3_2ImageTag v0.6.2.e019c49f
  vllm_embeding_image:
    tag : &vllm_embedingImageTag 0.3.3-hotfix-embedding-fix.28d8b56bb1a
  vllm_chat_image:
    tag: &vllm_chatImageTag 0.4.0.post1.d7823e5e491
  vllm_multimodal_image:
    tag: &vllm_multimodalImageTag 0.5.1.a24e62ea0ad
  vllm_latest_image:
    tag: &vllm_latest_image v0.6.4.post1.a6221a14

sglang:
  port: 8080
  commonImage:
    repository: &defaultSGLangImage phx.ocir.io/idqj093njucb/sglang
    tag: &defaultSGLangImageTag a95d558

cohere:
  port: 8080
  commandRv3Image:
    repository: us-chicago-1.ocir.io/idqj093njucb/cohere-oci-all
    tag: "v0.7.4-093024"
  readinessProbe:
    httpGet:
      path: /ping
      port: 8080
    failureThreshold: 5
    successThreshold: 1
    periodSeconds: 10
    timeoutSeconds: 20
  livenessProbe:
    httpGet:
      path: /ping
      port: 8080
    failureThreshold: 5
    successThreshold: 1
    periodSeconds: 10
    timeoutSeconds: 20
  startupProbe:
    httpGet:
      path: /ping
      port: 8080
    failureThreshold: 100
    successThreshold: 1
    periodSeconds: 3
    initialDelaySeconds: 60
    timeoutSeconds: 5

commonAnnotations:
  # DO NOT ADD chainsaw.k8s-integration.oracle.com/inject: "enabled" in serving runtime, this must be set in each isvc
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/metrics"
  chainsaw.k8s-integration.oracle.com/compartmentId: "ocid1.compartment.oc1..aaaaaaaathgntpo75bdehisnl6wkxfc4slkd6rpheafbt5a6ekm2ri4bmeva" # hardcode to dev tenancy compartment id
  chainsaw.k8s-integration.oracle.com/logPath: "vllm"
  chainsaw.k8s-integration.oracle.com/namespace: "vllm"

commonLabels:
  logging-forward: enabled
  sidecar.istio.io/inject: 'true'

commonTolerations:
  - key: "nvidia.com/gpu"
    operator: "Exists"
    effect: "NoSchedule"

llama_3_1_70b_instruct:
  enabled: false
  annotations:
    ome.io/autoscalerClass: "keda"
  affinity: {}
  tolerations: []
  topologySpreadConstraints: []
  volumes: []
  minReplicas: 1
  maxReplicas: 1
  scaleMetric: {}
  image:
    repository: *defaultVLLMImage
    tag: *defaultVLLMImageTag

llama_3_1_70b_instruct_2024_12:
  enabled: false
  annotations:
    ome.io/autoscalerClass: "keda"
  affinity: { }
  tolerations: [ ]
  topologySpreadConstraints: [ ]
  volumes: [ ]
  minReplicas: 1
  maxReplicas: 1
  scaleMetric: { }
  image:
    repository: *defaultVLLMImage
    tag: *vllm_latest_image

llama_3_1_405b_instruct:
  enabled: false
  enableRDMA: false
  singleNode: false
  annotations:
    traffic.sidecar.istio.io/includeInboundPorts: '8080,9001,9002'
    traffic.sidecar.istio.io/includeOutboundPorts: '8080,9001,9002'
    ome.io/deploymentMode: MultiNodeRayVLLM
  affinity: {}
  tolerations: []
  topologySpreadConstraints: []
  volumes: []
  # The number of replicas to start with must be 2 or more, as the model is too large to fit in a single GPU node
  minReplicas: 1
  maxReplicas: 1
  image:
    repository: *defaultVLLMImage
    tag: *defaultVLLMImageTag

