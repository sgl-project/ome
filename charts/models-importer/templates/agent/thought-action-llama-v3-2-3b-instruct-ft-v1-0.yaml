{{- if index .Values "thought-action-llama-v3-2-3b-instruct-ft-v1-0" "enabled" -}}
apiVersion: ome.io/v1beta1
kind: ClusterBaseModel
metadata:
  name: thought-action-llama-v3-2-3b-instruct-ft-v1-0
  labels:
    genai-managed-base-model-v1beta1: "true"
    genai-model-deprecated-date: "{{ index .Values "thought-action-llama-v3-2-3b-instruct-ft-v1-0" "timeDeprecated" }}"
    genai-model-on-demand-retired-date: "{{ index .Values "thought-action-llama-v3-2-3b-instruct-ft-v1-0" "timeOnDemandRetired" }}"
    genai-model-dedicated-retired-date: "{{ index .Values "thought-action-llama-v3-2-3b-instruct-ft-v1-0" "timeDedicatedRetired" }}"
  annotations:
    models.ome.io/runtime: "vllm-llama-3-2-3b-instruct"
    models.ome.io/category: "SMALL"
    models.ome.io/experimental: "{{ index .Values "thought-action-llama-v3-2-3b-instruct-ft-v1-0" "isExperimental" }}"
    models.ome.io/internal: "{{ index .Values "thought-action-llama-v3-2-3b-instruct-ft-v1-0" "isInternal" }}"
    models.ome.io/lifecycle-phase: "{{ index .Values "thought-action-llama-v3-2-3b-instruct-ft-v1-0" "lifecyclePhase" }}"
spec:
  compartmentID: {{ .Values.compartmentID }}
  disabled: false
  displayName: olm.thought-action-llama-v3.2-3b-instruct-ft-v1.0
  storage:
    storageUri: "oci://n/{{ .Values.osnamespace }}/b/{{ index .Values "thought-action-llama-v3-2-3b-instruct-ft-v1-0" "osBucket" }}/o/{{ index .Values "thought-action-llama-v3-2-3b-instruct-ft-v1-0" "vendor" }}/{{ index .Values "thought-action-llama-v3-2-3b-instruct-ft-v1-0" "osPrefixOverride" }}"
    path: "/mnt/data/models/{{ index .Values "thought-action-llama-v3-2-3b-instruct-ft-v1-0" "vendor" }}/{{ index .Values "thought-action-llama-v3-2-3b-instruct-ft-v1-0" "osPrefixOverride" }}"
  vendor: olm
  version: "1.0"
  modelFormat:
    name: safetensors
    version: "1.0.0"
  modelFramework:
    name: transformers
    version: "4.48.3"
  modelArchitecture: LlamaForCausalLM
  modelParameterSize: 3.21B
  modelCapabilities:
    - "CHAT"
  maxTokens: 131072
  additionalMetadata:
    {{- $shape := default "SMALL_GENERIC_V2" (index .Values "thought-action-llama-v3-2-3b-instruct-ft-v1-0" "compatibleDACShapes") }}
    {{- if $shape }}
    dacShapeConfigs: |-
      compatibleDACShapes:
        - name: {{ $shape }}
          quotaUnit: 1
          default: true
    {{- end }}
    internalName: "thought-action-llama-v3.2-3b-instruct-ft-v1.0"
    type: "Serving"
  modelConfiguration:
    {
      "_name_or_path": "/mnt/bv/mengguo/model/Base/Llama-3.2-3B-Instruct",
      "architectures": [
        "LlamaForCausalLM"
      ],
      "attention_bias": false,
      "attention_dropout": 0.0,
      "bos_token_id": 128000,
      "eos_token_id": [
        128001,
        128008,
        128009
      ],
      "head_dim": 128,
      "hidden_act": "silu",
      "hidden_size": 3072,
      "initializer_range": 0.02,
      "intermediate_size": 8192,
      "max_position_embeddings": 131072,
      "mlp_bias": false,
      "model_type": "llama",
      "num_attention_heads": 24,
      "num_hidden_layers": 28,
      "num_key_value_heads": 8,
      "pretraining_tp": 1,
      "rms_norm_eps": 1e-05,
      "rope_scaling": {
        "factor": 32.0,
        "high_freq_factor": 4.0,
        "low_freq_factor": 1.0,
        "original_max_position_embeddings": 8192,
        "rope_type": "llama3"
      },
      "rope_theta": 500000.0,
      "tie_word_embeddings": true,
      "torch_dtype": "float32",
      "transformers_version": "4.48.3",
      "use_cache": true,
      "vocab_size": 128256
    }
{{- end }}