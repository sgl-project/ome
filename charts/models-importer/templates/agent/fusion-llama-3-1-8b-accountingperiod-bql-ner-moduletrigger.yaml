{{- if index .Values "fusion-llama-3-1-8b-accountingperiod-bql-ner-moduletrigger" "enabled" -}}
apiVersion: ome.io/v1beta1
kind: ClusterBaseModel
metadata:
  name: fusion-llama-3-1-8b-accountingperiod-bql-ner-moduletrigger
  labels:
    genai-managed-base-model-v1beta1: "true"
    genai-model-deprecated-date: "{{ index .Values "fusion-llama-3-1-8b-accountingperiod-bql-ner-moduletrigger" "timeDeprecated" }}"
    genai-model-on-demand-retired-date: "{{ index .Values "fusion-llama-3-1-8b-accountingperiod-bql-ner-moduletrigger" "timeOnDemandRetired" }}"
    genai-model-dedicated-retired-date: "{{ index .Values "fusion-llama-3-1-8b-accountingperiod-bql-ner-moduletrigger" "timeDedicatedRetired" }}"
  annotations:
    models.ome.io/runtime: "vllm-llama-3-1-8b-instruct"
    models.ome.io/category: "SMALL"
    models.ome.io/experimental: "{{ index .Values "fusion-llama-3-1-8b-accountingperiod-bql-ner-moduletrigger" "isExperimental" }}"
    models.ome.io/internal: "{{ index .Values "fusion-llama-3-1-8b-accountingperiod-bql-ner-moduletrigger" "isInternal" }}"
    models.ome.io/lifecycle-phase: "{{ index .Values "fusion-llama-3-1-8b-accountingperiod-bql-ner-moduletrigger" "lifecyclePhase" }}"
spec:
  compartmentID: {{ .Values.compartmentID }}
  disabled: false
  displayName: olm.fusion-llama-3.1-8b-accountingperiod-bql-ner-moduletrigger
  storage:
    storageUri: "oci://n/{{ .Values.osnamespace }}/b/{{ index .Values "fusion-llama-3-1-8b-accountingperiod-bql-ner-moduletrigger" "osBucket" }}/o/{{ index .Values "fusion-llama-3-1-8b-accountingperiod-bql-ner-moduletrigger" "vendor" }}/{{ index .Values "fusion-llama-3-1-8b-accountingperiod-bql-ner-moduletrigger" "osPrefixOverride" }}"
    path: "/mnt/data/models/{{ index .Values "fusion-llama-3-1-8b-accountingperiod-bql-ner-moduletrigger" "vendor" }}/{{ index .Values "fusion-llama-3-1-8b-accountingperiod-bql-ner-moduletrigger" "osPrefixOverride" }}"
    {{- with index .Values "fusion-llama-3-1-8b-accountingperiod-bql-ner-moduletrigger" "nodeAntiAffinity" }}
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node.kubernetes.io/instance-type
                operator: NotIn
                values:
                {{- range . }}
                  - {{ . }}
                {{- end }}
    {{- end }}
  vendor: olm
  version: "1.0.0"
  modelFormat:
    name: safetensors
    version: "1.0.0"
  modelFramework:
    name: transformers
    version: "4.53.2"
  modelArchitecture: LlamaForCausalLM
  modelParameterSize: 8.03B
  modelCapabilities:
    - "CHAT"
  maxTokens: 131072
  additionalMetadata:
    {{- $shape := default "SMALL_GENERIC_V2" (index .Values "fusion-llama-3-1-8b-accountingperiod-bql-ner-moduletrigger" "compatibleDACShapes") }}
    {{- if $shape }}
    dacShapeConfigs: |-
      compatibleDACShapes:
        - name: {{ $shape }}
          quotaUnit: 1
          default: true
    {{- end }}
    internalName: "fusion-llama-3-1-8b-accountingperiod-bql-ner-moduletrigger"
    type: "Serving"
  modelConfiguration:
    {
      "architectures": [
        "LlamaForCausalLM"
      ],
      "attention_bias": false,
      "attention_dropout": 0.0,
      "bos_token_id": 128000,
      "eos_token_id": [
        128001,
        128008,
        128009
      ],
      "head_dim": 128,
      "hidden_act": "silu",
      "hidden_size": 4096,
      "initializer_range": 0.02,
      "intermediate_size": 14336,
      "max_position_embeddings": 131072,
      "mlp_bias": false,
      "model_type": "llama",
      "num_attention_heads": 32,
      "num_hidden_layers": 32,
      "num_key_value_heads": 8,
      "pretraining_tp": 1,
      "rms_norm_eps": 1e-05,
      "rope_scaling": {
        "factor": 8.0,
        "high_freq_factor": 4.0,
        "low_freq_factor": 1.0,
        "original_max_position_embeddings": 8192,
        "rope_type": "llama3"
      },
      "rope_theta": 500000.0,
      "tie_word_embeddings": false,
      "torch_dtype": "bfloat16",
      "transformers_version": "4.53.2",
      "use_cache": true,
      "vocab_size": 128256
    }
{{- end }}