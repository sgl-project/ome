{{- if index .Values "nl2rqs-7b-v3" "enabled" -}}
apiVersion: ome.io/v1beta1
kind: ClusterBaseModel
metadata:
  name: nl2rqs-7b-v3
  labels:
    genai-managed-base-model-v1beta1: "true"
  annotations:
    models.ome.io/runtime: "vllm-xsmall-text-generation"
    models.ome.io/category: "SMALL"
    models.ome.io/experimental: "{{ index .Values "nl2rqs-7b-v3" "isExperimental" }}"
    models.ome.io/internal: "{{ index .Values "nl2rqs-7b-v3" "isInternal" }}"
    models.ome.io/lifecycle-phase: "{{ index .Values "nl2rqs-7b-v3" "lifecyclePhase" }}"
spec:
  compartmentID: {{ .Values.compartmentID }}
  disabled: false
  displayName: olm.nl2rqs-7b-v3
  storage:
    path: "oci://n/{{ .Values.osnamespace }}/b/{{ index .Values "nl2rqs-7b-v3" "osBucket" }}/o/{{ index .Values "nl2rqs-7b-v3" "vendor" }}/{{ index .Values "nl2rqs-7b-v3" "osPrefixOverride" }}"
    storageUri: /mnt/data/models/olm/nl2rqs-7b-v3
  vendor: olm
  version: "3.0"
  modelFormat:
    name: safetensors
    version: "1"
  modelType: transformer
  modelArchitecture: Qwen2ForCausalLM
  modelParameterSize: 7B
  modelCapabilities:
    - "CHAT"
  maxTokens: 65536
  additionalMetadata:
    dacShapeConfigs: |-
      compatibleDACShapes:
        - name: SMALL_GENERIC_V2
          quotaUnit: 1
          default: true
{{- end }}