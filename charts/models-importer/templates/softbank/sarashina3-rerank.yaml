{{- if index .Values "sarashina3-rerank" "enabled" -}}
apiVersion: ome.io/v1beta1
kind: ClusterBaseModel
metadata:
  name: sarashina3-rerank
  labels:
    genai-managed-base-model-v1beta1: "true"
    genai-model-deprecated-date: "{{ index .Values "sarashina3-rerank" "timeDeprecated" }}"
    genai-model-on-demand-retired-date: "{{ index .Values "sarashina3-rerank" "timeOnDemandRetired" }}"
    genai-model-dedicated-retired-date: "{{ index .Values "sarashina3-rerank" "timeDedicatedRetired" }}"
  annotations:
    models.ome.io/runtime: "vllm-sarashina-modernbert-based-reranker-1-4b"
    models.ome.io/category: "SMALL"
    models.ome.io/experimental: "{{ index .Values "sarashina3-rerank" "isExperimental" }}"
    models.ome.io/internal: "{{ index .Values "sarashina3-rerank" "isInternal" }}"
    models.ome.io/lifecycle-phase: "{{ index .Values "sarashina3-rerank" "lifecyclePhase" }}"
    ome.io/base-model-decryption-key-name: "sarashina_rerank"
    ome.io/base-model-decryption-secret-name: "sarashina_rerank-dek"
spec:
  compartmentID: {{ .Values.compartmentID }}
  disabled: false
  displayName: softbank.sarashina3-rerank
  storage:
    storageUri: "oci://n/{{ .Values.osnamespace }}/b/{{ index .Values "sarashina3-rerank" "osBucket" }}/o/{{ index .Values "sarashina3-rerank" "vendor" }}/{{ index .Values "sarashina3-rerank" "osPrefixOverride" }}"
    path: "/mnt/data/models/{{ index .Values "sarashina3-rerank" "vendor" }}/{{ index .Values "sarashina3-rerank" "osPrefixOverride" }}"
  vendor: {{ index .Values "sarashina3-rerank" "vendor" }}
  version: "1.0.0"
  modelFormat:
    name: safetensors
    version: "1.0.0"
  modelFramework:
    name: transformers
    version: "5.0.0"
  modelArchitecture: ModernBertForSequenceClassification
  modelParameterSize: 1.4B
  modelCapabilities:
    - "TEXT_RERANK"
  maxTokens: 4096
  additionalMetadata:
    {{- $cfg := default "SB_B200_X1" (index .Values "sarashina3-rerank" "compatibleDACShapes") }}
    {{- if $cfg }}
    dacShapeConfigs: |-
      compatibleDACShapes:
        - name: {{ $cfg }}
          quotaUnit: 1
          default: true
    {{ end }}
    internalName: "sarashina3-rerank"
    type: "Serving"
{{- end }}
