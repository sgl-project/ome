{{- if index .Values "sarashina3-nano-7b" "enabled" -}}
apiVersion: ome.io/v1beta1
kind: ClusterBaseModel
metadata:
  name: sarashina3-nano-7b
  labels:
    genai-managed-base-model-v1beta1: "true"
    genai-model-deprecated-date: "{{ index .Values "sarashina3-nano-7b" "timeDeprecated" }}"
    genai-model-on-demand-retired-date: "{{ index .Values "sarashina3-nano-7b" "timeOnDemandRetired" }}"
    genai-model-dedicated-retired-date: "{{ index .Values "sarashina3-nano-7b" "timeDedicatedRetired" }}"
  annotations:
    models.ome.io/runtime: "vllm-sarashina-7b-sft-dpo-oracle"
    models.ome.io/category: "SMALL"
    models.ome.io/experimental: "{{ index .Values "sarashina3-nano-7b" "isExperimental" }}"
    models.ome.io/internal: "{{ index .Values "sarashina3-nano-7b" "isInternal" }}"
    models.ome.io/lifecycle-phase: "{{ index .Values "sarashina3-nano-7b" "lifecyclePhase" }}"
    ome.io/base-model-decryption-key-name: "sarashina3"
    ome.io/base-model-decryption-secret-name: "sarashina3-dek"
spec:
  compartmentID: {{ .Values.compartmentID }}
  disabled: false
  displayName: softbank.sarashina3-nano
  storage:
    storageUri: "oci://n/{{ .Values.osnamespace }}/b/{{ index .Values "sarashina3-nano-7b" "osBucket" }}/o/{{ index .Values "sarashina3-nano-7b" "vendor" }}/{{ index .Values "sarashina3-nano-7b" "osPrefixOverride" }}"
    path: "/mnt/data/models/{{ index .Values "sarashina3-nano-7b" "vendor" }}/{{ index .Values "sarashina3-nano-7b" "osPrefixOverride" }}"
  vendor: {{ index .Values "sarashina3-nano-7b" "vendor" }}
  version: "1.0.0"
  modelFormat:
    name: safetensors
    version: "1.0.0"
  modelFramework:
    name: transformers
    version: "4.46.3"
  modelArchitecture: LlamaForCausalLM
  modelParameterSize: 7B
  modelCapabilities:
    - "CHAT"
  maxTokens: 32768
  additionalMetadata:
    {{- $cfg := default "SB_B200_X1" (index .Values "sarashina3-nano-7b" "compatibleDACShapes") }}
    {{- if $cfg }}
    dacShapeConfigs: |-
      compatibleDACShapes:
        - name: {{ $cfg }}
          quotaUnit: 1
          default: true
    {{ end }}
    internalName: "sarashina3-nano-7b"
    type: "Serving"
{{- end }}
