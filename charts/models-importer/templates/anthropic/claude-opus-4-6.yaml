{{- if index .Values "claude-opus-4-6" "enabled" -}}
apiVersion: ome.io/v1beta1
kind: ClusterBaseModel
metadata:
  name: claude-opus-4-6
  labels:
    genai-managed-base-model-v1beta1: "true"
  annotations:
    models.ome.io/runtime: ""
    models.ome.io/category: "LARGE"
    models.ome.io/experimental: "{{ index .Values "claude-opus-4-6" "isExperimental" }}"
    models.ome.io/internal: "{{ index .Values "claude-opus-4-6" "isInternal" }}"
    models.ome.io/lifecycle-phase: "{{ index .Values "claude-opus-4-6" "lifecyclePhase" }}"
spec:
  compartmentID: {{ .Values.compartmentID }}
  disabled: false
  displayName: anthropic.claude-opus-4-6
  storage:
    storageUri: "vendor://anthropic/models/{{ index .Values "claude-opus-4-6" "osPrefixOverride" }}"
  vendor: {{ index .Values "claude-opus-4-6" "vendor" }}
  version: "1.0.0"
  modelFormat:
    name: safetensors
    version: "1.0.0"
  modelFramework:
    name: transformer
    version: "1"
  modelArchitecture: OpenAIForCausalLM
  modelParameterSize: 1.8T
  modelCapabilities:
    - "CHAT"
  maxTokens: 128000
  additionalMetadata:
    image-text-to-text: "{{ index .Values "claude-opus-4-6" "enableImageInput" }}"
{{- end }}
