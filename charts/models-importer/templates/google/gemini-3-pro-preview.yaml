{{- if index .Values "gemini-3-pro-preview" "enabled" -}}
apiVersion: ome.io/v1beta1
kind: ClusterBaseModel
metadata:
  name: gemini-3-pro-preview
  labels:
    genai-managed-base-model-v1beta1: "true"
    genai-model-deprecated-date: "{{ index .Values "gemini-3-pro-preview" "timeDeprecated" }}"
    genai-model-on-demand-retired-date: "{{ index .Values "gemini-3-pro-preview" "timeOnDemandRetired" }}"
    genai-model-dedicated-retired-date: "{{ index .Values "gemini-3-pro-preview" "timeDedicatedRetired" }}"
  annotations:
    models.ome.io/runtime: ""
    models.ome.io/category: "LARGE"
    models.ome.io/experimental: "{{ index .Values "gemini-3-pro-preview" "isExperimental" }}"
    models.ome.io/internal: "{{ index .Values "gemini-3-pro-preview" "isInternal" }}"
    models.ome.io/lifecycle-phase: "{{ index .Values "gemini-3-pro-preview" "lifecyclePhase" }}"
spec:
  compartmentID: {{ .Values.compartmentID }}
  disabled: false
  displayName: google.gemini-3-pro-preview
  storage:
    storageUri: "vendor://google/models/{{ index .Values "gemini-3-pro-preview" "osPrefixOverride" }}"
  vendor: {{ index .Values "gemini-3-pro-preview" "vendor" }}
  version: "1.0.0"
  modelFormat:
    name: safetensors
    version: "1.0.0"
  modelFramework:
    name: transformer
    version: "1"
  modelArchitecture: GeminiForCausalLM
  modelParameterSize: 1.8T
  modelCapabilities:
    - "CHAT"
  maxTokens: 1048576
  additionalMetadata:
    image-text-to-text: "{{ index .Values "gemini-3-pro-preview" "enableImageInput" }}"
{{- end }}