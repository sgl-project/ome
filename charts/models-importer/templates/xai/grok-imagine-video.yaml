{{- if index .Values "grok-imagine-video" "enabled" -}}
apiVersion: ome.io/v1beta1
kind: ClusterBaseModel
metadata:
  name: grok-imagine-video
  labels:
    genai-managed-base-model-v1beta1: "true"
  annotations:
    models.ome.io/runtime: ""
    models.ome.io/category: "SMALL"
    models.ome.io/experimental: "{{ index .Values "grok-imagine-video" "isExperimental" }}"
    models.ome.io/internal: "{{ index .Values "grok-imagine-video" "isInternal" }}"
    models.ome.io/lifecycle-phase: "{{ index .Values "grok-imagine-video" "lifecyclePhase" }}"
spec:
  compartmentID: {{ .Values.compartmentID }}
  disabled: false
  displayName: xai.grok-imagine-video
  storage:
    storageUri: "vendor://xai/models/{{ index .Values "grok-imagine-video" "osPrefixOverride" }}"
  vendor: {{ index .Values "grok-imagine-video" "vendor" }}
  version: "1.0.0"
  modelFormat:
    name: safetensors
    version: "1.0.0"
  modelFramework:
    name: transformer
    version: "1"
  modelArchitecture: xAiForCausalLM
  modelParameterSize: 12B
  modelCapabilities:
    - "TEXT_TO_VIDEO"
    - "IMAGE_TEXT_TO_VIDEO"
  maxTokens: 256000
  {{- end }}