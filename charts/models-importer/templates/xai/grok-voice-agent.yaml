{{- if index .Values "grok-voice-agent" "enabled" -}}
apiVersion: ome.io/v1beta1
kind: ClusterBaseModel
metadata:
  name: grok-voice-agent
  labels:
    genai-managed-base-model-v1beta1: "true"
  annotations:
    models.ome.io/runtime: ""
    models.ome.io/category: "SMALL"
    models.ome.io/experimental: "{{ index .Values "grok-voice-agent" "isExperimental" }}"
    models.ome.io/internal: "{{ index .Values "grok-voice-agent" "isInternal" }}"
    models.ome.io/lifecycle-phase: "{{ index .Values "grok-voice-agent" "lifecyclePhase" }}"
spec:
  compartmentID: {{ .Values.compartmentID }}
  disabled: false
  displayName: xai.grok-voice-agent
  storage:
    storageUri: "vendor://xai/models/{{ index .Values "grok-voice-agent" "osPrefixOverride" }}"
  vendor: {{ index .Values "grok-voice-agent" "vendor" }}
  version: "1.0.0"
  modelFormat:
    name: safetensors
    version: "1.0.0"
  modelFramework:
    name: transformer
    version: "1"
  modelArchitecture: xAiForCausalLM
  modelParameterSize: 1.7T
  modelCapabilities:
    - "AUDIO_TO_AUDIO"
    - "REALTIME"
  maxTokens: 256000
  {{- end }}