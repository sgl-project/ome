{{- if index .Values "grok-code-fast-1" "enabled" -}}
apiVersion: ome.io/v1beta1
kind: ClusterBaseModel
metadata:
  name: grok-code-fast-1
  labels:
    genai-managed-base-model-v1beta1: "true"
{{ include "models-importer.genaiModelLabels" (dict "root" $ "model" "grok-code-fast-1") | nindent 4 }}
  annotations:
    models.ome.io/runtime: ""
    models.ome.io/category: "SMALL"
    models.ome.io/experimental: "{{ index .Values "grok-code-fast-1" "isExperimental" }}"
    models.ome.io/internal: "{{ index .Values "grok-code-fast-1" "isInternal" }}"
    models.ome.io/lifecycle-phase: "{{ index .Values "grok-code-fast-1" "lifecyclePhase" }}"
spec:
  compartmentID: {{ .Values.compartmentID }}
  disabled: false
  displayName: xai.grok-code-fast-1
  storage:
    storageUri: "vendor://xai/models/{{ index .Values "grok-code-fast-1" "osPrefixOverride" }}"
  vendor: {{ index .Values "grok-code-fast-1" "vendor" }}
  version: "1.0.0"
  modelFormat:
    name: safetensors
    version: "1.0.0"
  modelFramework:
    name: transformer
    version: "1"
  modelArchitecture: xAiForCausalLM
  modelParameterSize: 314B
  modelCapabilities:
    - "CHAT"
  maxTokens: 256000
  {{- end }}
