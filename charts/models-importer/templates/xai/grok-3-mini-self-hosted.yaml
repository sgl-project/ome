{{- if index .Values "grok-3-mini-low" "enabled" -}}
apiVersion: ome.io/v1beta1
kind: ClusterBaseModel
metadata:
  name: grok-3-mini-low
  labels:
    genai-managed-base-model-v1beta1: "true"
    genai-model-deprecated-date: "{{ index .Values "grok-3-mini-low" "timeDeprecated" }}"
    genai-model-on-demand-retired-date: "{{ index .Values "grok-3-mini-low" "timeOnDemandRetired" }}"
    genai-model-dedicated-retired-date: "{{ index .Values "grok-3-mini-low" "timeDedicatedRetired" }}"
  annotations:
    models.ome.io/runtime: "xai-grok-3-mini-rt"
    models.ome.io/category: "SMALL"
    models.ome.io/experimental: "{{ index .Values "grok-3-mini-low" "isExperimental" }}"
    models.ome.io/internal: "{{ index .Values "grok-3-mini-low" "isInternal" }}"
    models.ome.io/lifecycle-phase: "{{ index .Values "grok-3-mini-low" "lifecyclePhase" }}"
spec:
  compartmentID: {{ .Values.compartmentID }}
  disabled: false
  displayName: xai.grok-3-mini
  storage:
    storageUri: "oci://n/{{ .Values.osnamespace }}/b/{{ index .Values "grok-3-mini-low" "osBucket" }}/o/{{ index .Values "grok-3-mini-low" "vendor" }}/{{ index .Values "grok-3-mini-low" "osPrefixOverride" }}"
    path: "/mnt/data/models/{{ index .Values "grok-3-mini-low" "vendor" }}/{{ index .Values "grok-3-mini-low" "osPrefixOverride" }}"
  vendor: {{ index .Values "grok-3-mini-low" "vendor" }}
  version: "1.0.0"
  modelFormat:
    name: safetensors
    version: "1.0.0"
  modelFramework:
    name: transformer
    version: "1"
  modelArchitecture: xAiForCausalLM
  modelParameterSize: 1.212T
  modelCapabilities:
    - "CHAT"
  maxTokens: 131072
  additionalMetadata:
    internalName: "grok-3-mini-low"
    type: "Serving"
{{- end }}