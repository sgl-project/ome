{{- if index .Values "gpt-audio" "enabled" -}}
apiVersion: ome.io/v1beta1
kind: ClusterBaseModel
metadata:
  name: gpt-audio
  labels:
    genai-managed-base-model-v1beta1: "true"
  annotations:
    models.ome.io/runtime: ""
    models.ome.io/category: "LARGE"
    models.ome.io/experimental: "{{ index .Values "gpt-audio" "isExperimental" }}"
    models.ome.io/internal: "{{ index .Values "gpt-audio" "isInternal" }}"
    models.ome.io/lifecycle-phase: "{{ index .Values "gpt-audio" "lifecyclePhase" }}"
spec:
  compartmentID: {{ .Values.compartmentID }}
  disabled: false
  displayName: openai.gpt-audio
  storage:
    storageUri: "vendor://openai/models/{{ index .Values "gpt-audio" "osPrefixOverride" }}"
  vendor: {{ index .Values "gpt-audio" "vendor" }}
  version: "1.0.0"
  modelFormat:
    name: safetensors
    version: "1.0.0"
  modelFramework:
    name: transformer
    version: "1"
  modelArchitecture: OpenAIForCausalLM
  modelParameterSize: 1.8T
  modelCapabilities:
    - "CHAT"
    - "AUDIO_TO_TEXT"
    - "TEXT_TO_AUDIO"
  apiCapabilities:
    - "OPENAI_V1_CHAT_COMPLETIONS"
  maxTokens: 128000
{{- end }}