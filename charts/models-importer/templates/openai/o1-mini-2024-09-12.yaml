{{- if index .Values "o1-mini-2024-09-12" "enabled" -}}
apiVersion: ome.io/v1beta1
kind: ClusterBaseModel
metadata:
  name: o1-mini-2024-09-12
  labels:
    genai-managed-base-model-v1beta1: "true"
  annotations:
    models.ome.io/runtime: ""
    models.ome.io/category: "SMALL"
    models.ome.io/experimental: "{{ index .Values "o1-mini-2024-09-12" "isExperimental" }}"
    models.ome.io/internal: "{{ index .Values "o1-mini-2024-09-12" "isInternal" }}"
    models.ome.io/lifecycle-phase: "{{ index .Values "o1-mini-2024-09-12" "lifecyclePhase" }}"
spec:
  compartmentID: {{ .Values.compartmentID }}
  disabled: false
  displayName: o1-mini-2024-09-12
  storage:
    storageUri: "vendor://openai/models/{{ index .Values "o1-mini-2024-09-12" "osPrefixOverride" }}"
  vendor: {{ index .Values "o1-mini-2024-09-12" "vendor" }}
  version: "1.0.0"
  modelFormat:
    name: safetensors
    version: "1"
  modelFramework:
    name: transformer
    version: "1"
  modelArchitecture: OpenAIForCasualLM
  modelParameterSize: 8B
  modelCapabilities:
    - "CHAT"
  maxTokens: 200000

{{- end }}