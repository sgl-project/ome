{{- if index .Values "gpt-5-2-chat-latest" "enabled" -}}
apiVersion: ome.io/v1beta1
kind: ClusterBaseModel
metadata:
  name: gpt-5-2-chat-latest
  labels:
    genai-managed-base-model-v1beta1: "true"
  annotations:
    models.ome.io/runtime: ""
    models.ome.io/category: "LARGE"
    models.ome.io/experimental: "{{ index .Values "gpt-5-2-chat-latest" "isExperimental" }}"
    models.ome.io/internal: "{{ index .Values "gpt-5-2-chat-latest" "isInternal" }}"
    models.ome.io/lifecycle-phase: "{{ index .Values "gpt-5-2-chat-latest" "lifecyclePhase" }}"
spec:
  compartmentID: {{ .Values.compartmentID }}
  disabled: false
  displayName: openai.gpt-5.2-chat-latest
  storage:
    storageUri: "vendor://openai/models/{{ index .Values "gpt-5-2-chat-latest" "osPrefixOverride" }}"
  vendor: {{ index .Values "gpt-5-2-chat-latest" "vendor" }}
  version: "1.0.0"
  modelFormat:
    name: safetensors
    version: "1.0.0"
  modelFramework:
    name: transformer
    version: "1"
  modelArchitecture: OpenAIForCausalLM
  modelParameterSize: 1.8T
  modelCapabilities:
    - "CHAT"
  maxTokens: 16384
  additionalMetadata:
    image-text-to-text: "{{ index .Values "gpt-5-2-chat-latest" "enableImageInput" }}"
{{- end }}
