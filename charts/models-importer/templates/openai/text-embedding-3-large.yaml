{{- if index .Values "text-embedding-3-large" "enabled" -}}
apiVersion: ome.io/v1beta1
kind: ClusterBaseModel
metadata:
  name: text-embedding-3-large
  labels:
    genai-managed-base-model-v1beta1: "true"
  annotations:
    models.ome.io/runtime: ""
    models.ome.io/category: "LARGE"
    models.ome.io/experimental: "{{ index .Values "text-embedding-3-large" "isExperimental" }}"
    models.ome.io/internal: "{{ index .Values "text-embedding-3-large" "isInternal" }}"
    models.ome.io/lifecycle-phase: "{{ index .Values "text-embedding-3-large" "lifecyclePhase" }}"
spec:
  compartmentID: {{ .Values.compartmentID }}
  disabled: false
  displayName: openai.text-embedding-3-large
  storage:
    storageUri: "vendor://openai/models/{{ index .Values "text-embedding-3-large" "osPrefixOverride" }}"
  vendor: {{ index .Values "text-embedding-3-large" "vendor" }}
  version: "1.0.0"
  modelFormat:
    name: safetensors
    version: "1.0.0"
  modelFramework:
    name: transformer
    version: "1"
  modelArchitecture: OpenAIForCausalLM
  modelParameterSize: 200B
  modelCapabilities:
    - "TEXT_EMBEDDINGS"
  maxTokens: 200000

{{- end }}