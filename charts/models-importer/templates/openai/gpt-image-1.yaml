{{- if index .Values "gpt-image-1" "enabled" -}}
apiVersion: ome.io/v1beta1
kind: ClusterBaseModel
metadata:
  name: gpt-image-1
  labels:
    genai-managed-base-model-v1beta1: "true"
{{ include "models-importer.genaiModelLabels" (dict "root" $ "model" "gpt-image-1") | nindent 4 }}
  annotations:
    models.ome.io/runtime: ""
    models.ome.io/category: "LARGE"
    models.ome.io/experimental: "{{ index .Values "gpt-image-1" "isExperimental" }}"
    models.ome.io/internal: "{{ index .Values "gpt-image-1" "isInternal" }}"
    models.ome.io/lifecycle-phase: "{{ index .Values "gpt-image-1" "lifecyclePhase" }}"
spec:
  compartmentID: {{ .Values.compartmentID }}
  disabled: false
  displayName: openai.gpt-image-1
  storage:
    storageUri: "vendor://openai/models/{{ index .Values "gpt-image-1" "osPrefixOverride" }}"
  vendor: {{ index .Values "gpt-image-1" "vendor" }}
  version: "1.0.0"
  modelFormat:
    name: safetensors
    version: "1.0.0"
  modelFramework:
    name: transformer
    version: "1"
  modelArchitecture: OpenAIForCausalLM
  modelParameterSize: 1.8T
  modelCapabilities:
    - "TEXT_TO_IMAGE"
    - "IMAGE_TEXT_TO_IMAGE"
  maxTokens: 128000
{{- end }}
