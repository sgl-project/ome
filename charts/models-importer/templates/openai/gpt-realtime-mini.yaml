{{- if index .Values "gpt-realtime-mini" "enabled" -}}
apiVersion: ome.io/v1beta1
kind: ClusterBaseModel
metadata:
  name: gpt-realtime-mini
  labels:
    genai-managed-base-model-v1beta1: "true"
  annotations:
    models.ome.io/runtime: ""
    models.ome.io/category: "SMALL"
    models.ome.io/experimental: "{{ index .Values "gpt-realtime-mini" "isExperimental" }}"
    models.ome.io/internal: "{{ index .Values "gpt-realtime-mini" "isInternal" }}"
    models.ome.io/lifecycle-phase: "{{ index .Values "gpt-realtime-mini" "lifecyclePhase" }}"
spec:
  compartmentID: {{ .Values.compartmentID }}
  disabled: false
  displayName: openai.gpt-realtime-mini
  storage:
    storageUri: "vendor://openai/models/{{ index .Values "gpt-realtime-mini" "osPrefixOverride" }}"
  vendor: {{ index .Values "gpt-realtime-mini" "vendor" }}
  version: "1.0.0"
  modelFormat:
    name: safetensors
    version: "1.0.0"
  modelFramework:
    name: transformer
    version: "1"
  modelArchitecture: OpenAIForCausalLM
  modelParameterSize: 1.8T
  modelCapabilities:
    - "REALTIME"
    - "AUDIO_TO_AUDIO"
  apiCapabilities:
    - "OPENAI_V1_REALTIME"
  maxTokens: 128000
{{- end }}