{{- if index .Values "sora-2-pro" "enabled" -}}
apiVersion: ome.io/v1beta1
kind: ClusterBaseModel
metadata:
  name: sora-2-pro
  labels:
    genai-managed-base-model-v1beta1: "true"
  annotations:
    models.ome.io/runtime: ""
    models.ome.io/category: "SMALL"
    models.ome.io/experimental: "{{ index .Values "sora-2-pro" "isExperimental" }}"
    models.ome.io/internal: "{{ index .Values "sora-2-pro" "isInternal" }}"
    models.ome.io/lifecycle-phase: "{{ index .Values "sora-2-pro" "lifecyclePhase" }}"
spec:
  compartmentID: {{ .Values.compartmentID }}
  disabled: false
  displayName: openai.sora-2-pro
  storage:
    storageUri: "vendor://openai/models/{{ index .Values "sora-2-pro" "osPrefixOverride" }}"
  vendor: {{ index .Values "sora-2-pro" "vendor" }}
  version: "1.0.0"
  modelFormat:
    name: safetensors
    version: "1.0.0"
  modelFramework:
    name: transformer
    version: "1"
  modelArchitecture: OpenAIForCausalLM
  modelParameterSize: 1.8T
  modelCapabilities:
    - "TEXT_TO_VIDEO"
    - "IMAGE_TEXT_TO_VIDEO"
  maxTokens: 1047576
{{- end }}