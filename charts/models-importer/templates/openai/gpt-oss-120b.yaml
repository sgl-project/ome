{{- if index .Values "gpt-oss-120b" "enabled" -}}
apiVersion: ome.io/v1beta1
kind: ClusterBaseModel
metadata:
  name: gpt-oss-120b
  labels:
    genai-model-deprecated-date: "{{ index .Values "gpt-oss-120b" "timeDeprecated" }}"
    genai-model-on-demand-retired-date: "{{ index .Values "gpt-oss-120b" "timeOnDemandRetired" }}"
    genai-model-dedicated-retired-date: "{{ index .Values "gpt-oss-120b" "timeDedicatedRetired" }}"
  annotations:
    # TODO clean up annotations after migration, which is used in MP
    models.ome.io/runtime: "vllm-gpt-oss-120b"
    models.ome.io/category: "SMALL"
    models.ome.io/experimental: "{{ index .Values "gpt-oss-120b" "isExperimental" }}"
    models.ome.io/internal: "{{ index .Values "gpt-oss-120b" "isInternal" }}"
    models.ome.io/lifecycle-phase: "{{ index .Values "gpt-oss-120b" "lifecyclePhase" }}"
    ome.oracle.com/skip-config-parsing: "true"
spec:
  compartmentID: {{ .Values.compartmentID }}
  disabled: false
  displayName: openai.gpt-oss-120b
  storage:
    storageUri: "oci://n/{{ .Values.osnamespace }}/b/{{ index .Values "gpt-oss-120b" "osBucket" }}/o/{{ index .Values "gpt-oss-120b" "vendor" }}/{{ index .Values "gpt-oss-120b" "osPrefixOverride" }}"
    path: "/mnt/data/models/{{ index .Values "gpt-oss-120b" "vendor" }}/{{ index .Values "gpt-oss-120b" "osPrefixOverride" }}"
  vendor: openai
  version: "1.0.0"
  modelFramework:
    name: transformers
    version: "4.55.0.dev0"
  modelFormat:
    name: safetensors
    version: "1.0.0"
  modelArchitecture: GptOssForCausalLM
  modelParameterSize: 120B
  modelCapabilities:
    - "CHAT"
  maxTokens: 131072
  quantization: mxfp4
  modelConfiguration:
    {
      "architectures": [
        "GptOssForCausalLM"
      ],
      "attention_bias": true,
      "attention_dropout": 0.0,
      "eos_token_id": 200002,
      "experts_per_token": 4,
      "head_dim": 64,
      "hidden_act": "silu",
      "hidden_size": 2880,
      "initial_context_length": 4096,
      "initializer_range": 0.02,
      "intermediate_size": 2880,
      "layer_types": [
        "sliding_attention",
        "full_attention",
        "sliding_attention",
        "full_attention",
        "sliding_attention",
        "full_attention",
        "sliding_attention",
        "full_attention",
        "sliding_attention",
        "full_attention",
        "sliding_attention",
        "full_attention",
        "sliding_attention",
        "full_attention",
        "sliding_attention",
        "full_attention",
        "sliding_attention",
        "full_attention",
        "sliding_attention",
        "full_attention",
        "sliding_attention",
        "full_attention",
        "sliding_attention",
        "full_attention",
        "sliding_attention",
        "full_attention",
        "sliding_attention",
        "full_attention",
        "sliding_attention",
        "full_attention",
        "sliding_attention",
        "full_attention",
        "sliding_attention",
        "full_attention",
        "sliding_attention",
        "full_attention"
      ],
      "max_position_embeddings": 131072,
      "model_type": "gpt_oss",
      "num_attention_heads": 64,
      "num_experts_per_tok": 4,
      "num_hidden_layers": 36,
      "num_key_value_heads": 8,
      "num_local_experts": 128,
      "output_router_logits": false,
      "pad_token_id": 199999,
      "quantization_config": {
        "modules_to_not_convert": [
          "model.layers.*.self_attn",
          "model.layers.*.mlp.router",
          "model.embed_tokens",
          "lm_head"
        ],
        "quant_method": "mxfp4"
      },
      "rms_norm_eps": 1e-05,
      "rope_scaling": {
        "beta_fast": 32.0,
        "beta_slow": 1.0,
        "factor": 32.0,
        "original_max_position_embeddings": 4096,
        "rope_type": "yarn",
        "truncate": false
      },
      "rope_theta": 150000,
      "router_aux_loss_coef": 0.9,
      "sliding_window": 128,
      "swiglu_limit": 7.0,
      "tie_word_embeddings": false,
      "transformers_version": "4.55.0.dev0",
      "use_cache": true,
      "vocab_size": 201088
    }

{{- end }}
