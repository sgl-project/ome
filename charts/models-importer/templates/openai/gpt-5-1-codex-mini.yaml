{{- if index .Values "gpt-5-1-codex-mini" "enabled" -}}
apiVersion: ome.io/v1beta1
kind: ClusterBaseModel
metadata:
  name: gpt-5-1-codex-mini
  labels:
    genai-managed-base-model-v1beta1: "true"
{{ include "models-importer.genaiModelLabels" (dict "root" $ "model" "gpt-5-1-codex-mini") | nindent 4 }}
  annotations:
    models.ome.io/runtime: ""
    models.ome.io/category: "LARGE"
    models.ome.io/experimental: "{{ index .Values "gpt-5-1-codex-mini" "isExperimental" }}"
    models.ome.io/internal: "{{ index .Values "gpt-5-1-codex-mini" "isInternal" }}"
    models.ome.io/lifecycle-phase: "{{ index .Values "gpt-5-1-codex-mini" "lifecyclePhase" }}"
spec:
  compartmentID: {{ .Values.compartmentID }}
  disabled: false
  displayName: openai.gpt-5.1-codex-mini
  storage:
    storageUri: "vendor://openai/models/{{ index .Values "gpt-5-1-codex-mini" "osPrefixOverride" }}"
  vendor: {{ index .Values "gpt-5-1-codex-mini" "vendor" }}
  version: "1.0.0"
  modelFormat:
    name: safetensors
    version: "1.0.0"
  modelFramework:
    name: transformer
    version: "1"
  modelArchitecture: OpenAIForCausalLM
  modelParameterSize: 3.6B
  modelCapabilities:
    - "CHAT"
  maxTokens: 128000
  additionalMetadata:
    image-text-to-text: "{{ index .Values "gpt-5-1-codex-mini" "enableImageInput" }}"
{{- end }}
