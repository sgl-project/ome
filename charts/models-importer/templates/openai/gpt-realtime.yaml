{{- if index .Values "gpt-realtime" "enabled" -}}
apiVersion: ome.io/v1beta1
kind: ClusterBaseModel
metadata:
  name: gpt-realtime
  labels:
    genai-managed-base-model-v1beta1: "true"
  annotations:
    models.ome.io/runtime: ""
    models.ome.io/category: "LARGE"
    models.ome.io/experimental: "{{ index .Values "gpt-realtime" "isExperimental" }}"
    models.ome.io/internal: "{{ index .Values "gpt-realtime" "isInternal" }}"
    models.ome.io/lifecycle-phase: "{{ index .Values "gpt-realtime" "lifecyclePhase" }}"
spec:
  compartmentID: {{ .Values.compartmentID }}
  disabled: false
  displayName: openai.gpt-realtime
  storage:
    storageUri: "vendor://openai/models/{{ index .Values "gpt-realtime" "osPrefixOverride" }}"
  vendor: {{ index .Values "gpt-realtime" "vendor" }}
  version: "1.0.0"
  modelFormat:
    name: safetensors
    version: "1.0.0"
  modelFramework:
    name: transformer
    version: "1"
  modelArchitecture: OpenAIForCausalLM
  modelParameterSize: 1.8T
  modelCapabilities:
    - "REALTIME"
    - "AUDIO_TO_AUDIO"
  maxTokens: 128000
{{- end }}