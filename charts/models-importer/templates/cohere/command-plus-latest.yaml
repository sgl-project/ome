apiVersion: ome.io/v1beta1
kind: ClusterBaseModel
metadata:
  name: command-plus-latest
  labels:
    genai-managed-base-model-v1beta1: "true"
    genai-model-reference: {{ index .Values "cohere-command-plus-latest" "modelReference" | default "" }}
  annotations:
spec:
  compartmentID: {{ .Values.compartmentID }}
  disabled: false
  displayName: cohere.command-plus-latest
  storage:
    storageUri: "vendor://cohere/models/{{ index .Values "cohere-command-plus-latest" "osPrefixOverride" }}"
  vendor: {{ index .Values "cohere-command-r-plus-082024-v1-6-128k" "vendor" }}
  version: "1.6"
  modelFormat:
    name: tensorrtllm
    version: 'v0.11.0'
  modelFramework:
    name: tensorrtllm
    version: 'v0.11.0'
  modelArchitecture: CohereForCausalLM
  modelParameterSize: 101.32B
  modelCapabilities:
    - "CHAT"
  maxTokens: 131072
  additionalMetadata:
    internalName: "command-plus-latest"
    type: "Serving"