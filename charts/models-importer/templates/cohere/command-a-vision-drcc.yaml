{{- if index .Values "command-a-vision-drcc" "enabled" -}}
apiVersion: ome.io/v1beta1
kind: ClusterBaseModel
metadata:
  name: command-a-vision-drcc
  labels:
    genai-managed-base-model-v1beta1: "true"
    genai-model-deprecated-date: "{{ index .Values "command-a-vision-drcc" "timeDeprecated" }}"
    genai-model-on-demand-retired-date: "{{ index .Values "command-a-vision-drcc" "timeOnDemandRetired" }}"
    genai-model-dedicated-retired-date: "{{ index .Values "command-a-vision-drcc" "timeDedicatedRetired" }}"
  annotations:
    models.ome.io/runtime: "cohere-command-a-vision-drcc"
    models.ome.io/category: "LARGE"
    models.ome.io/experimental: "{{ index .Values "command-a-vision-drcc" "isExperimental" }}"
    models.ome.io/internal: "{{ index .Values "command-a-vision-drcc" "isInternal" }}"
    models.ome.io/lifecycle-phase: "{{ index .Values "command-a-vision-drcc" "lifecyclePhase" }}"
    ome.io/base-model-decryption-key-name: "command_3"
    ome.io/base-model-decryption-secret-name: "command_3-dek"
spec:
  compartmentID: {{ .Values.compartmentID }}
  disabled: false
  displayName: cohere.command-a-vision
  storage:
    storageUri: "oci://n/{{ .Values.osnamespace }}/b/{{ index .Values "command-a-vision-drcc" "osBucket" }}/o/{{ index .Values "command-a-vision-drcc" "vendor" }}/{{ index .Values "command-a-vision-drcc" "osPrefixOverride" }}"
    path: "/mnt/data/models/{{ index .Values "command-a-vision-drcc" "vendor" }}/{{ index .Values "command-a-vision-drcc" "osPrefixOverride" }}"
  vendor: {{ index .Values "command-a-vision-drcc" "vendor" }}
  version: "1.0"
  # keep trt structure for now
  modelFormat:
    name: tensorrtllm
    version: 'v0.8.0'
  modelFramework:
    name: tensorrtllm
    version: 'v0.8.0'
  modelArchitecture: CohereForCausalLM
  modelParameterSize: 111B
  modelCapabilities:
    - "CHAT"
  maxTokens: 256000
  additionalMetadata:
    {{ $defaultDACShape := default "COHERE_A100_40G_X4" (index .Values "command-a-vision-drcc" "defaultDACShape") -}}
    {{ $additionalDACShapes := index .Values "command-a-vision-drcc" "additionalDACShapes" | default (list) -}}
    dacShapeConfigs: |-
      compatibleDACShapes:
        - name: {{ $defaultDACShape }}
          quotaUnit: 1
          default: true
        {{- range $additionalDACShapes }}
        - name: {{ . }}
          quotaUnit: 1
          default: false
        {{- end }}
    image-text-to-text: "true"
    internalName: "command-a-vision-drcc"
    type: "Serving"
{{- end }}