{{- if index .Values "cohere-command-latest" "enabled" -}}
apiVersion: ome.io/v1beta1
kind: ClusterBaseModel
metadata:
  name: command-latest
  labels:
    genai-managed-base-model-v1beta1: "true"
    genai-model-reference: "{{ index .Values "cohere-command-latest" "modelReference" }}"
  annotations:
spec:
  compartmentID: {{ .Values.compartmentID }}
  disabled: false
  displayName: cohere.command-latest
  storage:
    storageUri: "vendor://cohere/models/{{ index .Values "cohere-command-latest" "osPrefixOverride" }}"
  vendor: {{ index .Values "cohere-command-latest" "vendor" }}
  version: "1.7"
  modelFormat:
    name: tensorrtllm
    version: 'v0.11.0'
  modelFramework:
    name: tensorrtllm
    version: 'v0.11.0'
  modelArchitecture: CohereForCausalLM
  modelParameterSize: 101.32B
  modelCapabilities:
    - "CHAT"
  maxTokens: 131072
  additionalMetadata:
    internalName: "command-latest"
    type: "Serving"
{{- end }}