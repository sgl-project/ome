{{- if index .Values "cohere-rerank-v4-0-pro" "enabled" -}}
apiVersion: ome.io/v1beta1
kind: ClusterBaseModel
metadata:
  name: rerank-v4-0-pro
  labels:
    genai-managed-base-model-v1beta1: "true"
    genai-model-deprecated-date: "{{ index .Values "cohere-rerank-v4-0-pro" "timeDeprecated" }}"
    genai-model-on-demand-retired-date: "{{ index .Values "cohere-rerank-v4-0-pro" "timeOnDemandRetired" }}"
    genai-model-dedicated-retired-date: "{{ index .Values "cohere-rerank-v4-0-pro" "timeDedicatedRetired" }}"
  annotations:
    models.ome.io/runtime: "cohere-rerank-v4-0-pro"
    models.ome.io/category: "SMALL"
    models.ome.io/experimental: "{{ index .Values "cohere-rerank-v4-0-pro" "isExperimental" }}"
    models.ome.io/internal: "{{ index .Values "cohere-rerank-v4-0-pro" "isInternal" }}"
    models.ome.io/lifecycle-phase: "{{ index .Values "cohere-rerank-v4-0-pro" "lifecyclePhase" }}"
    ome.io/base-model-decryption-key-name: "rerank"
    ome.io/base-model-decryption-secret-name: "rerank-dek"
spec:
  compartmentID: {{ .Values.compartmentID }}
  disabled: false
  displayName: cohere.rerank-v4.0-pro
  storage:
    storageUri: "oci://n/{{ .Values.osnamespace }}/b/{{ index .Values "cohere-rerank-v4-0-pro" "osBucket" }}/o/{{ index .Values "cohere-rerank-v4-0-pro" "vendor" }}/{{ index .Values "cohere-rerank-v4-0-pro" "osPrefixOverride" }}"
    path: "/mnt/data/models/{{ index .Values "cohere-rerank-v4-0-pro" "vendor" }}/{{ index .Values "cohere-rerank-v4-0-pro" "osPrefixOverride" }}"
  vendor: {{ index .Values "cohere-rerank-v4-0-pro" "vendor" }}
  version: "4.0"
  modelFormat:
    name: onnx
    version: '1'
  modelFramework:
    name: onnxruntime
    version: '1'
  modelArchitecture: CohereForCausalLM
  modelParameterSize: 2.8B
  modelCapabilities:
    - "TEXT_RERANK"
  maxTokens: 4096
  additionalMetadata:
    {{ $defaultDACShape := default "COHERE_H100_X1" (index .Values "cohere-rerank-v4-0-pro" "defaultDACShape") -}}
    {{ $additionalDACShapes := index .Values "cohere-rerank-v4-0-pro" "additionalDACShapes" | default (list) -}}
    dacShapeConfigs: |-
      compatibleDACShapes:
        - name: {{ $defaultDACShape }}
          quotaUnit: 1
          default: true
        {{- range $additionalDACShapes }}
        - name: {{ . }}
          quotaUnit: 1
          default: false
        {{- end }}
    internalName: "rerank-v4-0-pro"
    type: "Serving"
{{- end }}