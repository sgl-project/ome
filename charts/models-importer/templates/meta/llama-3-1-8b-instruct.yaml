{{- if index .Values "llama-3-1-8b-instruct" "enabled" -}}
apiVersion: ome.io/v1beta1
kind: ClusterBaseModel
metadata:
  name: llama-3-1-8b-instruct
  labels:
    genai-model-deprecated-date: "{{ index .Values "llama-3-1-8b-instruct" "timeDeprecated" }}"
    genai-model-on-demand-retired-date: "{{ index .Values "llama-3-1-8b-instruct" "timeOnDemandRetired" }}"
    genai-model-dedicated-retired-date: "{{ index .Values "llama-3-1-8b-instruct" "timeDedicatedRetired" }}"
  annotations:
    # TODO clean up annotations after migration, which is used in MP
    models.ome.io/runtime: "vllm-llama-3-1-8b-instruct"
    models.ome.io/category: "SMALL"
    models.ome.io/experimental: "{{ index .Values "llama-3-1-8b-instruct" "isExperimental" }}"
    models.ome.io/internal: "{{ index .Values "llama-3-1-8b-instruct" "isInternal" }}"
    models.ome.io/lifecycle-phase: "{{ index .Values "llama-3-1-8b-instruct" "lifecyclePhase" }}"
    ome.oracle.com/skip-config-parsing: "true"
spec:
  compartmentID: {{ .Values.compartmentID }}
  disabled: false
  displayName: meta.llama-3-1-8b-instruct
  storage:
    storageUri: "oci://n/{{ .Values.osnamespace }}/b/{{ index .Values "llama-3-1-8b-instruct" "osBucket" }}/o/{{ index .Values "llama-3-1-8b-instruct" "vendor" }}/{{ index .Values "llama-3-1-8b-instruct" "osPrefixOverride" }}"
    path: "/mnt/data/models/{{ index .Values "llama-3-1-8b-instruct" "vendor" }}/{{ index .Values "llama-3-1-8b-instruct" "osPrefixOverride" }}"
  vendor: meta
  version: "1.0.0"
  modelFramework:
    name: transformers
    version: "4.42.3"
  modelFormat:
    name: safetensors
    version: "1.0.0"
  modelArchitecture: LlamaForCausalLM
  modelParameterSize: 8.03B
  modelCapabilities:
    - "TEXT_CLASSIFICATION"
  maxTokens: 131072
  additionalMetadata:
    {{- $shape := default "SMALL_GENERIC_V1" (index .Values "llama-3-1-8b-instruct" "compatibleDACShapes") }}
    {{- if $shape }}
    dacShapeConfigs: |-
      compatibleDACShapes:
        - name: "{{ $shape }}"
          quotaUnit: 1
          default: true
    {{- end }}
  modelConfiguration:
    {
      "architectures": [
        "LlamaForCausalLM"
      ],
      "attention_bias": false,
      "attention_dropout": 0.0,
      "bos_token_id": 128000,
      "eos_token_id": [
        128001,
        128008,
        128009
      ],
      "hidden_act": "silu",
      "hidden_size": 4096,
      "initializer_range": 0.02,
      "intermediate_size": 14336,
      "max_position_embeddings": 131072,
      "mlp_bias": false,
      "model_type": "llama",
      "num_attention_heads": 32,
      "num_hidden_layers": 32,
      "num_key_value_heads": 8,
      "pretraining_tp": 1,
      "rms_norm_eps": 1e-05,
      "rope_scaling": {
        "factor": 8.0,
        "low_freq_factor": 1.0,
        "high_freq_factor": 4.0,
        "original_max_position_embeddings": 8192,
        "rope_type": "llama3"
      },
      "rope_theta": 500000.0,
      "tie_word_embeddings": false,
      "torch_dtype": "bfloat16",
      "transformers_version": "4.42.3",
      "use_cache": true,
      "vocab_size": 128256
    }

{{- end }}
