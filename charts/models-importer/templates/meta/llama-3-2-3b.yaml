{{- if index .Values "llama-3-2-3b" "enabled" -}}
apiVersion: ome.io/v1beta1
kind: ClusterBaseModel
metadata:
  name: llama-3-2-3b
  labels:
    genai-managed-base-model-v1beta1: "true"
  annotations:
    # TODO clean up annotations after migration, which is used in MP
    models.ome.io/runtime: "vllm-llama-3-2-3b-instruct"
    models.ome.io/category: "SMALL"
    models.ome.io/experimental: "{{ index .Values "llama-3-2-3b" "isExperimental" }}"
    models.ome.io/internal: "{{ index .Values "llama-3-2-3b" "isInternal" }}"
    models.ome.io/lifecycle-phase: "{{ index .Values "llama-3-2-3b" "lifecyclePhase" }}"
spec:
  compartmentID: {{ .Values.compartmentID }}
  disabled: false
  displayName: meta.llama-3.2-3b
  storage:
    storageUri: "oci://n/{{ .Values.osnamespace }}/b/{{ index .Values "llama-3-2-3b" "osBucket" }}/o/{{ index .Values "llama-3-2-3b" "vendor" }}/{{ index .Values "llama-3-2-3b" "osPrefixOverride" }}"
    path: /mnt/data/models/meta/llama-3-2-3b
  vendor: meta
  version: "1.0.0"
  modelFormat:
    name: safetensors
    version: "1"
  modelType: transformer
  modelArchitecture: LlamaForCausalLM
  modelParameterSize: 3B
  modelCapabilities:
    - "CHAT"
  maxTokens: 131072
  additionalMetadata:
    dacShapeConfigs: |-
      compatibleDACShapes:
        - name: SMALL_GENERIC_V2
          quotaUnit: 1
          default: true
  modelConfiguration:
    {
      "architectures": [
        "LlamaForCausalLM"
      ],
      "attention_bias": false,
      "attention_dropout": 0.0,
      "bos_token_id": 128000,
      "eos_token_id": 128001,
      "head_dim": 128,
      "hidden_act": "silu",
      "hidden_size": 3072,
      "initializer_range": 0.02,
      "intermediate_size": 8192,
      "max_position_embeddings": 131072,
      "mlp_bias": false,
      "model_type": "llama",
      "num_attention_heads": 24,
      "num_hidden_layers": 28,
      "num_key_value_heads": 8,
      "pretraining_tp": 1,
      "rms_norm_eps": 1e-05,
      "rope_scaling": {
        "factor": 32.0,
        "high_freq_factor": 4.0,
        "low_freq_factor": 1.0,
        "original_max_position_embeddings": 8192,
        "rope_type": "llama3"
      },
      "rope_theta": 500000.0,
      "tie_word_embeddings": true,
      "torch_dtype": "bfloat16",
      "transformers_version": "4.45.0.dev0",
      "use_cache": true,
      "vocab_size": 128256
    }
{{- end -}}