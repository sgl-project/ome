{{- if index .Values "llama-guard-4-12b" "enabled" -}}
apiVersion: ome.io/v1beta1
kind: ClusterBaseModel
metadata:
  name: llama-guard-4-12b
  labels:
    genai-managed-base-model-v1beta1: "true"
    genai-model-deprecated-date: "{{ index .Values "llama-guard-4-12b" "timeDeprecated" }}"
    genai-model-on-demand-retired-date: "{{ index .Values "llama-guard-4-12b" "timeOnDemandRetired" }}"
    genai-model-dedicated-retired-date: "{{ index .Values "llama-guard-4-12b" "timeDedicatedRetired" }}"
  annotations:
    # TODO clean up annotations after migration, which is used in MP
    models.ome.io/runtime: "vllm-llama-guard-4-12b"
    models.ome.io/category: "SMALL"
    models.ome.io/experimental: "{{ index .Values "llama-guard-4-12b" "isExperimental" }}"
    models.ome.io/internal: "{{ index .Values "llama-guard-4-12b" "isInternal" }}"
    models.ome.io/lifecycle-phase: "{{ index .Values "llama-guard-4-12b" "lifecyclePhase" }}"
spec:
  vendor: meta
  disabled: false
  compartmentID: {{ .Values.compartmentID }}
  displayName: meta.llama-guard-4-12b
  version: "1.0.0"
  modelFramework:
    name: transformers
    version: "4.52.0.dev0"
  modelFormat:
    name: safetensors
    version: "1.0.0"
  modelArchitecture: Llama4ForConditionalGeneration
  modelParameterSize: 12B
  maxTokens: 10485760
  modelCapabilities:
    - "IMAGE_CONTENT_MODERATION"
  storage:
    storageUri: "oci://n/{{ .Values.osnamespace }}/b/{{ index .Values "llama-guard-4-12b" "osBucket" }}/o/{{ index .Values "llama-guard-4-12b" "vendor" }}/{{ index .Values "llama-guard-4-12b" "osPrefixOverride" }}"
    path: "/mnt/data/models/{{ index .Values "llama-guard-4-12b" "vendor" }}/{{ index .Values "llama-guard-4-12b" "osPrefixOverride" }}"
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node.kubernetes.io/instance-type
                operator: In
                values:
                  - BM.GPU.A100-v2.8
                  - BM.GPU.H100.8
                  - BM.GPU.B4.8
  additionalMetadata:
    image-text-to-text: "true"
{{- end }}
