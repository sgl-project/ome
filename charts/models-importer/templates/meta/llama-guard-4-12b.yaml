{{- if index .Values "llama-guard-4-12b" "enabled" -}}
apiVersion: ome.io/v1beta1
kind: ClusterBaseModel
metadata:
  name: llama-guard-4-12b
spec:
  vendor: meta
  disabled: false
  compartmentID: {{ .Values.compartmentID }}
  displayName: meta.llama-guard-4-12b
  version: "1.0.0"
  modelFramework:
    name: transformers
    version: "4.52.0.dev0"
  modelFormat:
    name: safetensors
    version: "1.0.0"
  modelArchitecture: Llama4ForConditionalGeneration
  modelParameterSize: 12B
  maxTokens: 10485760
  modelCapabilities:
    - "CHAT"
  storage:
    storageUri: "oci://n/{{ .Values.osnamespace }}/b/{{ index .Values "llama-guard-4-12b" "osBucket" }}/o/{{ index .Values "llama-guard-4-12b" "vendor" }}/{{ index .Values "llama-guard-4-12b" "osPrefixOverride" }}"
    path: "/mnt/data/models/{{ index .Values "llama-guard-4-12b" "vendor" }}/{{ index .Values "llama-guard-4-12b" "osPrefixOverride" }}"
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node.kubernetes.io/instance-type
                operator: In
                values:
                  - BM.GPU.A100-v2.8
                  - BM.GPU.H100.8
                  - BM.GPU.B4.8

{{- end }}
