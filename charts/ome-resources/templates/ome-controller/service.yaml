---
apiVersion: v1
kind: Service
metadata:
  name: ome-webhook-server-service
  namespace: {{ .Release.Namespace }}
spec:
  ports:
    - port: 443
      targetPort: webhook-server
  selector:
    control-plane: ome-controller-manager

---
apiVersion: v1
kind: Service
metadata:
  name: ome-controller-manager-service
  namespace: {{ .Release.Namespace }}
  labels:
    control-plane: ome-controller-manager
    controller-tools.k8s.io: "1.0"
spec:
  selector:
    control-plane: ome-controller-manager
    controller-tools.k8s.io: "1.0"
  ports:
  - name: https
    port: 8443
    targetPort: https
    protocol: TCP
  - name: metrics
    port: 8080
    targetPort: metrics
    protocol: TCP
