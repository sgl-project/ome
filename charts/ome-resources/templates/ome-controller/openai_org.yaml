{{- if or .Values.openai.enabled .Values.openaiProxy.enabled }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{.Values.openai.namespace}}
{{- end }}
{{- if .Values.openai.enabled }}
---
apiVersion: ome.io/v1beta1
kind: Organization
metadata:
  name: genai-openai-0001
spec:
  organizationId: {{.Values.ome.ociETC.serviceCompartmentId}}
  vendor: openai
  disabled: false
  secretRef:
    name: openai-admin-key
    key: OPENAI_ADMIN_API_KEY
    namespace: {{.Values.openai.namespace}}
---
apiVersion: v1
kind: Secret
metadata:
  name: openai-admin-key
  namespace: {{.Values.openai.namespace}}
  annotations:
    helm.sh/resource-policy: keep
