---
apiVersion: v1
kind: Service
metadata:
  name: opensource-ome-webhook-server-service
  namespace: {{ .Release.Namespace }}
spec:
  ports:
    - port: 443
      targetPort: webhook-server
  selector:
    control-plane: opensource-ome-controller-manager

---
apiVersion: v1
kind: Service
metadata:
  name: opensource-ome-controller-manager-service
  namespace: {{ .Release.Namespace }}
  labels:
    control-plane: opensource-ome-controller-manager
    controller-tools.k8s.io: "1.0"
spec:
  selector:
    control-plane: opensource-ome-controller-manager
    controller-tools.k8s.io: "1.0"
  ports:
    - port: 8443
      targetPort: https
      protocol: TCP