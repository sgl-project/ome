apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ome-model-agent-daemonset
  namespace: {{ .Release.Namespace }}
spec:
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels: 
      app.kubernetes.io/component: "ome-model-agent-daemonset"
  template:
    metadata:
      labels:
        app.kubernetes.io/component: "ome-model-agent-daemonset"
        logging-forward: enabled
    spec:
      priorityClassName: {{ .Values.modelAgent.priorityClassName }}
      serviceAccountName: {{ .Values.modelAgent.serviceAccountName }}
      {{- if .Values.modelAgent.affinity }}
      affinity:
        {{- toYaml .Values.modelAgent.affinity | nindent 8 }}
      {{- end }}
      volumes:
      - name: host-models
        persistentVolumeClaim:
          claimName: ome-model-agent-pvc
      containers:
      - name: model-agent
        image: "{{ .Values.modelAgent.image.repository }}:{{ .Values.modelAgent.image.tag }}"
        imagePullPolicy: {{ .Values.modelAgent.image.pullPolicy }}
        args: 
        - --models-root-dir-on-host
        - {{ .Values.modelDownload.hostPath }}
        - --models-root-dir
        - {{ .Values.modelDownload.hostPath }}
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        volumeMounts:
        - name: host-models
          readOnly: false
          mountPath: {{ .Values.modelDownload.hostPath }}
        livenessProbe:
          httpGet:
            path: /livez
            port: {{ .Values.modelAgent.health.port }}
          initialDelaySeconds: 5
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /healthz
            port: {{ .Values.modelAgent.health.port }}
          initialDelaySeconds: 5
        {{- if .Values.resources }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        {{- end }}   
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists  
          effect: NoSchedule
