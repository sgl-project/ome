apiVersion: v1
kind: ConfigMap
metadata:
  name: model-agent-config-map
  namespace: {{ .Release.Namespace }}
data:
  # Instance type mappings for various cloud providers:
  # - Oracle Cloud (OCI) shapes
  # - AWS instance types
  # - Azure instance types
  # - Google Cloud instance types
  # - CoreWeave instance types
  # - Nebius instance types
  instance-type-map: |-
    {
      "BM.GPU.A10.4": "A10",
      "BM.GPU.A100-v2.8": "A100-80G",
      "BM.GPU4.8": "A100-40G",
      "BM.GPU.B4.8": "A100-40G",
      "BM.GPU.H100.8": "H100",
      "BM.GPU.H100-NC.8": "H100",
      "BM.GPU.H200.8": "H200",
      "BM.GPU.H200-NC.8": "H200",
      "BM.GPU.B200.8": "B200",
      "p5.48xlarge": "H100",
      "Standard_ND96isr_H100_v5": "H100",
      "a3-highgpu-8g": "H100",
      "gd-8xh100ib-i128": "H100",
      "gd-8xh200ib-i128": "H200",
      "gd-8xl40-i128": "L40",
      "gpu-h100-sxm": "H100",
      "gpu-h200-sxm": "H200",
      "gpu-b200-sxm": "B200",
      "gpu-l40s": "L40S"
    }
  # Total node VRAM in GiB keyed by short shape alias from instance-type-map.
  # Each value is the aggregate VRAM across all GPUs on a typical node of that
  # shape (e.g. H100 = 8 × 80 GiB SXM).
  # Unknown shapes fail open (precheck disabled for that node).
  gpu-shape-memory-gb-map: |-
    {
      "A10": 96,
      "A100-40G": 320,
      "A100-80G": 640,
      "H100": 640,
      "H200": 1128,
      "B200": 1536,
      "L40": 384,
      "L40S": 384
    }
  # Safety multiplier applied to the estimated weight bytes before comparing
  # against per-node VRAM. Leaves headroom for activations / KV cache / CUDA
  # workspace. Clamped to [1.0, 4.0]; values outside the range fall back to
  # the built-in default of 1.2.
  model-download-vram-safety-factor: "1.2"
