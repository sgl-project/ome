# Default values for download-agent.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
replicaCount: 1

enableHooks: false

image:
  repository: us-ashburn-1.ocir.io/idqj093njucb/download-agent
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: 1.0

nameOverride: ""
fullnameOverride: "generic-download-agent"

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

nodeSelector: {}

tolerations:
  - key: "nvidia.com/gpu"
    operator: "Exists"
    effect: "NoSchedule"

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
      - matchExpressions:
        - key: nvidia.com/gpu.present
          operator: In
          values:
          - "true"

containers:
  command: ["/download-agent", "download-agent", "-c", "/configs/generic-download-agent.yaml", "-v", "generic"]

containerEnv:
  modelName: "model-name"
  authType: "InstancePrincipal"
  enableSizeLimitCheck: "true"
  numOfThreadsForReplication: "8"
  sourceObjectBucketName: "model-store"
  sourceObjectPrefix: "model-prefix"
  sourceObjectCompartmentId: "ocid1.compartment.oc1..aaaaaaaa2hdk363zzvlegei25gbspsps74cec467hgl3gocyrcsopcguh6pq"
  sourceRegionOverride: "ap-osaka-1"
  sourceEnableOboToken: "false"
  sourceOboToken: ""
  targetObjectBucketName: "model-store"
  targetObjectPrefix: "model-prefix"
  targetObjectCompartmentId: "ocid1.compartment.oc1..aaaaaaaathgntpo75bdehisnl6wkxfc4slkd6rpheafbt5a6ekm2ri4bmeva"
  region: "us-chicago-1"


