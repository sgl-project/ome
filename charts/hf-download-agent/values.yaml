# Default values for download-agent.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
replicaCount: 1

image:
  repository: ap-osaka-1.ocir.io/idqj093njucb/download-agent
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: 1.0

nameOverride: ""
fullnameOverride: "hf-download-agent"

podAnnotations: {}

podSecurityContext: {}
# fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
# runAsUser: 1000

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
#   memory: 128Mi

nodeSelector: {}

tolerations:
  - key: "nvidia.com/gpu"
    operator: "Exists"
    effect: "NoSchedule"

affinity: {}

containers:
  command: ["/download-agent", "download-agent", "-c", "/configs/hf-download-agent.yaml", "-v", "hf"]

containerEnv:
  modelName: "t5-small"
  internalModelName: "t5-small"
  downloadCommit: "main"
  authType: "InstancePrincipal"
  hfToken: "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"
  objectBucketName: "model-store"
  objectNamespace: "idqj093njucb"
  objectCompartmentId: "ocid1.compartment.oc1..aaaaaaaathgntpo75bdehisnl6wkxfc4slkd6rpheafbt5a6ekm2ri4bmeva"
  region: "ap-osaka-1"
  regionOverride: "ap-osaka-1"