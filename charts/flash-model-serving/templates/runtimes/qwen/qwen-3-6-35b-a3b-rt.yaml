apiVersion: ome.io/v1beta1
kind: ClusterServingRuntime
metadata:
  name: vllm-qwen-3-6-35b-a3b-v2
spec:
  acceleratorRequirements:
    acceleratorClasses:
      - nvidia-h100-2
      - nvidia-h100-4
      - nvidia-h100-8
      - nvidia-a100-80gb-2
      - nvidia-a100-80gb-4
      - nvidia-a100-80gb-8
      - nvidia-h200-2
      - nvidia-h200-4
      - nvidia-h200-8
      - nvidia-b200-2
      - nvidia-b200-4
  disabled: false
  routerConfig:
    annotations:
      {{- .Values.router.annotations | toYaml | nindent 6 }}
    labels:
      {{- .Values.router.labels | toYaml | nindent 6 }}
    runner:
      name: router
      image: {{ .Values.oci.ocir_domain }}/{{ .Values.oci.os_ns }}/{{ .Values.qwen_3_6_35b_a3b.router.image.repository }}:{{ .Values.qwen_3_6_35b_a3b.router.image.tag }}
      terminationMessagePolicy: FallbackToLogsOnError
      ports:
        - containerPort: {{ .Values.router.port }}
          name: http
          protocol: TCP
      resources:
        requests:
          cpu: "1"
          memory: 2Gi
        limits:
          cpu: "8"
          memory: 16Gi
      args:
        - --host
        - 0.0.0.0
        - --port
        - "{{ .Values.router.port }}"
        - --service-discovery
        - --service-discovery-namespace
        - $(NAMESPACE)
        - --service-discovery-port
        - "{{ .Values.engine.port }}"
        - --selector
        - component=engine ome.io/inferenceservice=$(INFERENCESERVICE_NAME)
        - --enable-igw
        - --request-id-headers
        - opc-request-id
        - --log-json
        - --disable-retries
        - --disable-circuit-breaker
        - --disable-tokenizer-autoload
      env:
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: INFERENCESERVICE_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.labels['ome.io/inferenceservice']
      readinessProbe:
        httpGet:
          path: /readiness
          port: {{ .Values.router.port }}
        failureThreshold: 5
        periodSeconds: 30
        timeoutSeconds: 10
      livenessProbe:
        httpGet:
          path: /liveness
          port: {{ .Values.router.port }}
        failureThreshold: 5
        periodSeconds: 30
        timeoutSeconds: 10
      startupProbe:
        httpGet:
          path: /health
          port: {{ .Values.router.port }}
        failureThreshold: 5
        periodSeconds: 20
        timeoutSeconds: 10
        initialDelaySeconds: 30
  supportedModelFormats:
    - modelFramework:
        name: transformers
        version: "4.57.1"
      modelFormat:
        name: safetensors
        version: "1.0.0"
      autoSelect: true
      modelArchitecture: Qwen3_5MoeForConditionalGeneration
      version: "1.0.0"
      priority: 2
      acceleratorConfig:
        nvidia-h100-2:
          tensorParallelismOverride:
            tensorParallelSize: 2
        nvidia-h100-4:
          tensorParallelismOverride:
            tensorParallelSize: 4
        nvidia-h100-8:
          environmentOverride:
            VLLM_USE_FLASHINFER_MOE_FP8: "0"
          tensorParallelismOverride:
            tensorParallelSize: 8
        nvidia-a100-80gb-2:
          tensorParallelismOverride:
            tensorParallelSize: 2
        nvidia-a100-80gb-4:
          tensorParallelismOverride:
            tensorParallelSize: 4
        nvidia-a100-80gb-8:
          environmentOverride:
            VLLM_USE_FLASHINFER_MOE_FP8: "0"
          tensorParallelismOverride:
            tensorParallelSize: 8
        nvidia-h200-2:
          tensorParallelismOverride:
            tensorParallelSize: 2
        nvidia-h200-4:
          tensorParallelismOverride:
            tensorParallelSize: 4
        nvidia-h200-8:
          environmentOverride:
            VLLM_USE_FLASHINFER_MOE_FP8: "0"
          tensorParallelismOverride:
            tensorParallelSize: 8
        nvidia-b200-2:
          tensorParallelismOverride:
            tensorParallelSize: 2
        nvidia-b200-4:
          tensorParallelismOverride:
            tensorParallelSize: 4
  modelSizeRange:
    min: 34B
    max: 36B
  protocolVersions:
    - openAI
  engineConfig:
    schedulerName: {{ .Values.schedulerName }}
    {{- if or .Values.engine.annotations .Values.qwen_3_6_35b_a3b.annotations }}
    annotations:
      {{- if .Values.engine.annotations }}
      {{- .Values.engine.annotations | toYaml | nindent 6 }}
      {{- end }}
      {{- if .Values.qwen_3_6_35b_a3b.annotations }}
      {{- .Values.qwen_3_6_35b_a3b.annotations | toYaml | nindent 6 }}
      {{- end }}
    {{- end }}
    {{- if or .Values.engine.labels .Values.qwen_3_6_35b_a3b.labels }}
    labels:
      {{- if .Values.engine.labels }}
      {{- .Values.engine.labels | toYaml | nindent 6 }}
      {{- end }}
      {{- if .Values.qwen_3_6_35b_a3b.labels }}
      {{- .Values.qwen_3_6_35b_a3b.labels | toYaml | nindent 6 }}
      {{- end }}
    {{- end }}
    {{- if or .Values.engine.tolerations .Values.qwen_3_6_35b_a3b.tolerations }}
    tolerations:
      {{- if .Values.engine.tolerations }}
      {{- .Values.engine.tolerations | toYaml | nindent 6 }}
      {{- end }}
      {{- if .Values.qwen_3_6_35b_a3b.tolerations }}
      {{- .Values.qwen_3_6_35b_a3b.tolerations | toYaml | nindent 6 }}
      {{- end }}
    {{- end }}
    {{- if .Values.qwen_3_6_35b_a3b.topologySpreadConstraints }}
    topologySpreadConstraints:
      {{- .Values.qwen_3_6_35b_a3b.topologySpreadConstraints | toYaml | nindent 6 }}
    {{- end }}
    {{- $scaleConfig := .Values.qwen_3_6_35b_a3b.scaleMetric }}
    {{- if $scaleConfig }}
    {{- if kindIs "map" $scaleConfig }}
    {{- with (coalesce (get $scaleConfig "type") (get $scaleConfig "metric")) }}
    scaleMetric: {{ . }}
    {{- end }}
    {{- with (coalesce (get $scaleConfig "target") (get $scaleConfig "scaleTarget")) }}
    scaleTarget: {{ . }}
    {{- end }}
    {{- else }}
    scaleMetric: {{ $scaleConfig }}
    {{- end }}
    {{- end }}
    volumes:
      - name: dshm
        emptyDir:
          medium: Memory
      {{- if or (eq .Values.oci.realm "oc5") (eq .Values.oci.realm "oc6") }}
      - name: etc-pki
        hostPath:
          path: /etc/pki
          type: Directory
      {{- end }}
      {{- if .Values.qwen_3_6_35b_a3b.volumes }}
      {{- .Values.qwen_3_6_35b_a3b.volumes | toYaml | nindent 6 }}
      {{- end }}
    runner:
      name: ome-container
      image: {{ .Values.oci.ocir_domain }}/{{ .Values.oci.os_ns }}/{{ .Values.qwen_3_6_35b_a3b.engine.image.repository }}:{{ .Values.qwen_3_6_35b_a3b.engine.image.tag }}
      terminationMessagePolicy: FallbackToLogsOnError
      ports:
        - containerPort: {{ .Values.engine.port }}
          name: http1
          protocol: TCP
      command:
        - vllm
        - serve
      args:
        - $(MODEL_PATH)
        - --port={{ .Values.engine.port }}
        - --max-log-len=0
        - --served-model-name={{ .Values.serveModelName }}
        - --tensor-parallel-size=2
        - --gpu-memory-utilization=0.9
        - --max-model-len=262144
        - --max-cudagraph-capture-size=256
        - --no-scheduler-reserve-full-isl
        - --limit-mm-per-prompt={"image":5,"video":1}
        - --reasoning-parser=qwen3
        - --enable-auto-tool-choice
        - --tool-call-parser=qwen3_coder
      env:
        - name: VLLM_RPC_TIMEOUT
          value: '30000'
        - name: VLLM_ENGINE_ITERATION_TIMEOUT_S
          value: '120'
      volumeMounts:
        - mountPath: /dev/shm
          name: dshm
      resources:
        requests:
          cpu: 10
          memory: 80Gi
          nvidia.com/gpu: 2
        limits:
          cpu: 10
          memory: 80Gi
          nvidia.com/gpu: 2
      readinessProbe:
        httpGet:
          path: /health
          port: {{ .Values.engine.port }}
        failureThreshold: 3
        successThreshold: 1
        periodSeconds: 90
        timeoutSeconds: 60
      livenessProbe:
        httpGet:
          path: /health
          port: {{ .Values.engine.port }}
        failureThreshold: 5
        successThreshold: 1
        periodSeconds: 60
        timeoutSeconds: 60
      startupProbe:
        httpGet:
          path: /health
          port: {{ .Values.engine.port }}
        failureThreshold: 150
        successThreshold: 1
        periodSeconds: 6
        initialDelaySeconds: 60
        timeoutSeconds: 30
