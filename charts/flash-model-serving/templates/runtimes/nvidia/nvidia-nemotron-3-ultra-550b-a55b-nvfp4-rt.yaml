apiVersion: ome.io/v1beta1
kind: ClusterServingRuntime
metadata:
  name: vllm-nvidia-nemotron-3-ultra-550b-a55b-nvfp4
spec:
  acceleratorRequirements:
    acceleratorClasses:
      - nvidia-b200-4
      - nvidia-b200-8
  disabled: false
  routerConfig:
    annotations:
      {{- .Values.router.annotations | toYaml | nindent 6 }}
    labels:
      {{- .Values.router.labels | toYaml | nindent 6 }}
    runner:
      name: router
      image: {{ .Values.oci.ocir_domain }}/{{ .Values.oci.os_ns }}/{{ .Values.nvidia_nemotron_3_ultra_550b_a55b_nvfp4.router.image.repository }}:{{ .Values.nvidia_nemotron_3_ultra_550b_a55b_nvfp4.router.image.tag }}
      terminationMessagePolicy: FallbackToLogsOnError
      ports:
        - containerPort: {{ .Values.router.port }}
          name: http
          protocol: TCP
      resources:
        requests:
          cpu: "1"
          memory: 2Gi
        limits:
          cpu: "8"
          memory: 16Gi
      args:
        - --host
        - 0.0.0.0
        - --port
        - "{{ .Values.router.port }}"
        - --service-discovery
        - --service-discovery-namespace
        - $(NAMESPACE)
        - --service-discovery-port
        - "{{ .Values.engine.port }}"
        - --selector
        - component=engine ome.io/inferenceservice=$(INFERENCESERVICE_NAME)
        - --enable-igw
        - --request-id-headers
        - opc-request-id
        - --log-json
        - --disable-retries
        - --disable-circuit-breaker
        - --disable-tokenizer-autoload
      env:
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: INFERENCESERVICE_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.labels['ome.io/inferenceservice']
      readinessProbe:
        httpGet:
          path: /readiness
          port: {{ .Values.router.port }}
        failureThreshold: 5
        periodSeconds: 30
        timeoutSeconds: 10
      livenessProbe:
        httpGet:
          path: /liveness
          port: {{ .Values.router.port }}
        failureThreshold: 5
        periodSeconds: 30
        timeoutSeconds: 10
      startupProbe:
        httpGet:
          path: /health
          port: {{ .Values.router.port }}
        failureThreshold: 5
        periodSeconds: 30
        timeoutSeconds: 10
        initialDelaySeconds: 30
  supportedModelFormats:
    - modelFramework:
        name: transformers
        version: "5.3.0"
      modelFormat:
        name: safetensors
        version: "1.0.0"
      autoSelect: true
      modelArchitecture: NemotronHForCausalLM
      priority: 1
      acceleratorConfig:
        nvidia-b200-4:
          tensorParallelismOverride:
            tensorParallelSize: 4
        nvidia-b200-8:
          tensorParallelismOverride:
            tensorParallelSize: 8
  modelSizeRange:
    min: 330B
    max: 340B
  protocolVersions:
    - openAI
  engineConfig:
    schedulerName: {{ .Values.schedulerName }}
    {{- if or .Values.engine.annotations .Values.nvidia_nemotron_3_ultra_550b_a55b_nvfp4.annotations }}
    annotations:
      {{- if .Values.engine.annotations }}
      {{- .Values.engine.annotations | toYaml | nindent 6 }}
      {{- end }}
      {{- if .Values.nvidia_nemotron_3_ultra_550b_a55b_nvfp4.annotations }}
      {{- .Values.nvidia_nemotron_3_ultra_550b_a55b_nvfp4.annotations | toYaml | nindent 6 }}
      {{- end }}
    {{- end }}
    {{- if or .Values.engine.labels .Values.nvidia_nemotron_3_ultra_550b_a55b_nvfp4.labels }}
    labels:
      {{- if .Values.engine.labels }}
      {{- .Values.engine.labels | toYaml | nindent 6 }}
      {{- end }}
      {{- if .Values.nvidia_nemotron_3_ultra_550b_a55b_nvfp4.labels }}
      {{- .Values.nvidia_nemotron_3_ultra_550b_a55b_nvfp4.labels | toYaml | nindent 6 }}
      {{- end }}
    {{- end }}
    {{- if or .Values.engine.tolerations .Values.nvidia_nemotron_3_ultra_550b_a55b_nvfp4.tolerations }}
    tolerations:
      {{- if .Values.engine.tolerations }}
      {{- .Values.engine.tolerations | toYaml | nindent 6 }}
      {{- end }}
      {{- if .Values.nvidia_nemotron_3_ultra_550b_a55b_nvfp4.tolerations }}
      {{- .Values.nvidia_nemotron_3_ultra_550b_a55b_nvfp4.tolerations | toYaml | nindent 6 }}
      {{- end }}
    {{- end }}
    {{- if .Values.nvidia_nemotron_3_ultra_550b_a55b_nvfp4.topologySpreadConstraints }}
    topologySpreadConstraints:
      {{- .Values.nvidia_nemotron_3_ultra_550b_a55b_nvfp4.topologySpreadConstraints | toYaml | nindent 6 }}
    {{- end }}
    {{- $scaleConfig := .Values.nvidia_nemotron_3_ultra_550b_a55b_nvfp4.scaleMetric }}
    {{- if $scaleConfig }}
    {{- if kindIs "map" $scaleConfig }}
    {{- with (coalesce (get $scaleConfig "type") (get $scaleConfig "metric")) }}
    scaleMetric: {{ . }}
    {{- end }}
    {{- with (coalesce (get $scaleConfig "target") (get $scaleConfig "scaleTarget")) }}
    scaleTarget: {{ . }}
    {{- end }}
    {{- else }}
    scaleMetric: {{ $scaleConfig }}
    {{- end }}
    {{- end }}
    volumes:
      - name: dshm
        emptyDir:
          medium: Memory
      {{- if or (eq .Values.oci.realm "oc5") (eq .Values.oci.realm "oc6") }}
      - name: etc-pki
        hostPath:
          path: /etc/pki
          type: Directory
      {{- end }}
      {{- if .Values.nvidia_nemotron_3_ultra_550b_a55b_nvfp4.volumes }}
      {{- .Values.nvidia_nemotron_3_ultra_550b_a55b_nvfp4.volumes | toYaml | nindent 6 }}
      {{- end }}
    runner:
      name: ome-container
      image: {{ .Values.oci.ocir_domain }}/{{ .Values.oci.os_ns }}/{{ .Values.nvidia_nemotron_3_ultra_550b_a55b_nvfp4.engine.image.repository }}:{{ .Values.nvidia_nemotron_3_ultra_550b_a55b_nvfp4.engine.image.tag }}
      terminationMessagePolicy: FallbackToLogsOnError
      ports:
        - containerPort: {{ .Values.engine.port }}
          name: http1
          protocol: TCP
      command:
        - vllm
        - serve
      args:
        - $(MODEL_PATH)
        - --port={{ .Values.engine.port }}
        - --served-model-name={{ .Values.serveModelName }}
        - --tensor-parallel-size=4
        - --pipeline-parallel-size=1
        - --data-parallel-size=1
        - --trust-remote-code
        - --dtype=auto
        - --kv-cache-dtype=nvfp4
        - --mamba-ssm-cache-dtype=float16
        - --max-model-len=1048576
        - --max-num-seqs=64
        - --gpu-memory-utilization=0.9
        - --max-cudagraph-capture-size=128
        - --enable-chunked-prefill
        - --enable-expert-parallel
        - --async-scheduling
        - --no-scheduler-reserve-full-isl
        - --reasoning-parser-plugin=$(MODEL_PATH)/ultra_v3_reasoning_parser.py
        - --reasoning-parser=ultra_v3
        - --enable-auto-tool-choice
        - --tool-call-parser=qwen3_xml
        - --chat-template=$(MODEL_PATH)/chat_template.jinja
      env:
        - name: VLLM_ALLOW_LONG_MAX_MODEL_LEN
          value: '1'
        - name: VLLM_FLASHINFER_MOE_BACKEND
          value: latency
        - name: VLLM_USE_FLASHINFER_MOE_FP4
          value: '1'
        - name: VLLM_USE_FLASHINFER_MOE_FP8
          value: '1'
        - name: VLLM_FLASHINFER_ALLREDUCE_BACKEND
          value: trtllm
        - name: VLLM_RPC_TIMEOUT
          value: '30000'
        - name: VLLM_ENGINE_ITERATION_TIMEOUT_S
          value: '600'
      volumeMounts:
        - mountPath: /dev/shm
          name: dshm
      resources:
        requests:
          cpu: 64
          memory: 512Gi
          nvidia.com/gpu: 4
        limits:
          cpu: 64
          memory: 512Gi
          nvidia.com/gpu: 4
      readinessProbe:
        httpGet:
          path: /health
          port: {{ .Values.engine.port }}
        failureThreshold: 3
        successThreshold: 1
        periodSeconds: 90
        timeoutSeconds: 60
      livenessProbe:
        httpGet:
          path: /health
          port: {{ .Values.engine.port }}
        failureThreshold: 5
        successThreshold: 1
        periodSeconds: 60
        timeoutSeconds: 60
      startupProbe:
        httpGet:
          path: /health
          port: {{ .Values.engine.port }}
        failureThreshold: 720
        successThreshold: 1
        periodSeconds: 10
        initialDelaySeconds: 120
        timeoutSeconds: 30
