{{- if index .Values "gpt-5-5-pro" "enabled" -}}
apiVersion: ome.io/v1beta1
kind: ClusterBaseModel
metadata:
  name: gpt-5-5-pro
  labels:
    {{ include "proxy-models-importer.genaiModelLabels" (dict "root" $ "model" "gpt-5-5-pro") | nindent 4 }}
  annotations:
    {{ include "proxy-models-importer.genaiModelAnnotations" (dict "root" $ "model" "gpt-5-5-pro") | nindent 4 }}
spec:
  compartmentID: {{ .Values.compartmentID }}
  disabled: false
  displayName: openai.gpt-5.5-pro
  storage:
    storageUri: "vendor://openai/models/{{ index .Values "gpt-5-5-pro" "osPrefixOverride" }}"
  vendor: {{ index .Values "gpt-5-5-pro" "vendor" }}
  version: "1.0.0"
  modelFormat:
    name: safetensors
    version: "1.0.0"
  modelFramework:
    name: transformer
    version: "1"
  modelArchitecture: OpenAIForCausalLM
  modelParameterSize: 1.8T
  modelCapabilities:
    - "CHAT"
  apiCapabilities:
    - "OPENAI_V1_RESPONSES"
  maxTokens: 128000
  additionalMetadata:
    image-text-to-text: "{{ index .Values "gpt-5-5-pro" "enableImageInput" }}"
{{- end }}
