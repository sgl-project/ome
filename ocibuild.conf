runnerTag: latest
name: ome
team: GenAICore
phoneBookId: ocasgs
description: Generative AI
majorversion: 1
minorversion: 1
shortversion: ${majorversion}.${minorversion}
altSuffix: "+"${BLD_BRANCH}
version: v${shortversion}-${BLD_NUMBER}${?BLD_BRANCH_SUFFIX}
snapshotVersion: ${shortversion}-SNAPSHOT
releaseBranches: ["main", "hotfix/*"]
triggerOnCommitBranches:  ["main", "pull-requests", "hotfix/*"]
authCompartmentOcid: ocid1.tenancy.oc1..aaaaaaaakyvertmo4tineubnzxftatozvqmdh6anb3bplvdqgsg3y63ctzjq
bitbucketTag: {"enabled": true, "tagName": ${version}, "description": "OME Release Tag"}
shepherd_release_helm_repo: shepherd-release-helm-local
go_version: 1.23.0
pyIndexUrl: "https://artifactory.oci.oraclecorp.com/api/pypi/global-release-pypi/simple"

steps:
  [
    {
        name: generate-java-client
        type: maven
        javaVersion: jdk-17
        mavenCommands: [
            { goal: "validate", args: "-f java-client/pom.xml -N -DrequireVersion="${snapshotVersion} },
            { goal: "versions:set", args: "-f java-client/pom.xml -DnewVersion="${version}" -DprocessAllModules=true" },
            { goal: "verify -f java-client/pom.xml" }
        ]
        artifacts: [
            "**"
        ]
    },
    {
      name: build-ome-python-sdk
      type: python
      pyVersion: 3.11
      runnerImage: build-runner-python-ol8
      pythonCommands: [
        {args = "-m pip install -U pip setuptools"}
        {args = "-m pip install -U uv toml-cli"}
        # setting version is not supported by uv, https://github.com/astral-sh/uv/issues/6298
        {args = "-m uv tool run -i "${pyIndexUrl}" --directory python/ome --from=toml-cli toml set --toml-path=pyproject.toml project.version "${version}}
        {args = "-m uv --directory python/ome sync -v"}
        {args = "-m uv --directory python/ome build -v"}
      ]
      artifacts: ["**"]
    },
    {
      name: publish-ome-python-sdk
      type: publishgeneric
      repository: ocas-service-platform-dev-pypi-local
      dependsOn: build-ome-python-sdk
      filesToPublish: [
        "python/ome/dist/*.whl",
        "python/ome/dist/*.tar.gz"
      ]
    },
    {
      name: go-lint
      type: make
      runnerImage: build-runner-golang-boring-ssl
      makeCommands: [
        { target: "lint-fix" }
      ]
      environment: {
        "https_proxy": "http://www-proxy-hqdc.us.oracle.com:80",
        "http_proxy": "http://www-proxy-hqdc.us.oracle.com:80",
        "no_proxy": "127.0.0.1,localhost,artifactory.oci.oraclecorp.com,artifactory-builds.oci.oraclecorp.com"
      }
      artifacts: [
        "**",
      ]
    },
    {
        name: unit-tests
        type: make
        runnerImage: build-runner-golang-boring-ssl
        makeCommands: [
        { target: "test" }
        ]
        environment: {
            "https_proxy": "http://www-proxy-hqdc.us.oracle.com:80",
            "http_proxy": "http://www-proxy-hqdc.us.oracle.com:80",
            "no_proxy": "127.0.0.1,localhost,artifactory.oci.oraclecorp.com,artifactory-builds.oci.oraclecorp.com"
      }
        artifacts: [
            "**",
        ]
    },
    {
        name: integration-test
        type: make
        runnerImage: build-runner-golang-boring-ssl
        makeCommands: [
        { target: "integration-test" }
        ]
        environment: {
            "https_proxy": "http://www-proxy-hqdc.us.oracle.com:80",
            "http_proxy": "http://www-proxy-hqdc.us.oracle.com:80",
            "no_proxy": "127.0.0.1,localhost,artifactory.oci.oraclecorp.com,artifactory-builds.oci.oraclecorp.com"
      }
        artifacts: [
            "**",
        ]
    },
    {
        name: coverage
        type: make
        dependsOn: unit-tests
        runnerImage: build-runner-golang-boring-ssl
        makeCommands: [
          { target: "coverage" }
        ]
    },
    {
      name: package-helm-chart
      type: helm
      helmCommands: [
          {command: "version"},
          {command: "lint ./charts/ome-crd ./charts/ome-resources ./charts/models-importer ./charts/model-serving"},
          {command: "package -d build/ ./charts/ome-crd ./charts/ome-resources ./charts/models-importer ./charts/model-serving --version "${version}}
      ]
      artifacts: [
          "**"
      ]
    },
    {
      name: publish-helm-chart
      type: publishgeneric
      dependsOn: package-helm-chart
      repository: ${shepherd_release_helm_repo}
      filePathsToPublish: [
        {
          localFile: "build/*.tgz"
          targetDir: "/"
         }
      ]
    },
    {
      name: publish-ome-fabric8-java-client-maven-artifacts
      type: publishmaven
      dependsOn: generate-java-client
      pomLocation: java-client
      repository: ocas-service-platform-release-maven-local
    },
    {
       name: dockerize-manager
       type: dockerizer
       dockerFile: "dockerfiles/manager.Dockerfile"
       dockerBuildPwd: "./"
       images: [
           {
               platform: linux/amd64
           }
       ]
    },
    {
        name: publish-ome-manager-image
        type: publishdocker
        dependsOn: dockerize-manager
        repository: odo-docker-signed-local
        imageName: genai-ome-manager
    },
    {
       name: dockerize-model-agent
       type: dockerizer
       dockerFile: "dockerfiles/model-agent.Dockerfile"
       dockerBuildPwd: "./"
       images: [
           {
               platform: linux/amd64
           }
       ]
    },
    {
        name: publish-model-agent
        type: publishdocker
        dependsOn: dockerize-model-agent
        repository: odo-docker-signed-local
        imageName: genai-ome-model-agent
    },
    {
       name: dockerize-model-controller
       type: dockerizer
       dockerFile: "dockerfiles/model-controller.Dockerfile"
       dockerBuildPwd: "./"
       images: [
           {
               platform: linux/amd64
           }
       ]
    },
    {
        name: publish-model-controller
        type: publishdocker
        dependsOn: dockerize-model-controller
        repository: odo-docker-signed-local
        imageName: genai-ome-model-controller
    },
    {
       name: dockerize-multinode-prober
       type: dockerizer
       dockerFile: "dockerfiles/multinode-prober.Dockerfile"
       dockerBuildPwd: "./"
       images: [
           {
               platform: linux/amd64
           }
       ]
    },
    {
        name: publish-multinode-prober
        type: publishdocker
        dependsOn: dockerize-multinode-prober
        repository: odo-docker-signed-local
        imageName: genai-multinode-prober
    },
    {
        name: dockerize-ome-agent
        type: dockerizer
        dockerFile: "dockerfiles/ome-agent.Dockerfile"
        dockerBuildPwd: "./"
        images: [
           {
              platform: linux/amd64
           }
        ]
    },
    {
        name: publish-ome-agent-image
        type: publishdocker
        dependsOn: dockerize-ome-agent
        repository: odo-docker-signed-local
        imageName: genai-ome-agent
    },
    {
        name: dockerize-openai-admin-util
        type: dockerizer
        dockerFile: "dockerfiles/openai-admin-util.Dockerfile"
        dockerBuildPwd: "./"
        images: [
           {
              platform: linux/amd64
           }
        ]
    },
    {
        name: publish-openai-admin-util-image
        type: publishdocker
        dependsOn: dockerize-openai-admin-util
        repository: odo-docker-signed-local
        imageName: genai-openai-admin-util
    }
  ]
