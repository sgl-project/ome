runnerTag: latest
name: ome
team: GenAICore
phoneBookId: ocasgs
description: Generative AI
majorversion: 1
minorversion: 1
shortversion: ${majorversion}.${minorversion}
version: v${shortversion}-${BLD_NUMBER}${?BLD_BRANCH_SUFFIX}
snapshotVersion: ${shortversion}-SNAPSHOT
releaseBranches: ["main", "hotfix/*"]
triggerOnCommitBranches:  ["main", "pull-requests", "hotfix/*"]
authCompartmentOcid: ocid1.tenancy.oc1..aaaaaaaakyvertmo4tineubnzxftatozvqmdh6anb3bplvdqgsg3y63ctzjq
bitbucketTag: {"enabled": true, "tagName": ${version}, "description": "OME Release Tag"}
shepherd_release_helm_repo: shepherd-release-helm-local

steps:
  [
    {
      name: compilesource
      type: maven
      javaVersion: jdk-17
      mavenCommands: [
        { goal: "validate", args: "-f java-client/pom.xml -N -DrequireVersion="${snapshotVersion} },
        { goal: "versions:set", args: "-f java-client/pom.xml -DnewVersion="${version}" -DprocessAllModules=true" },
        { goal: "verify -f java-client/pom.xml" }
      ]
      artifacts: [
        "**"
      ]
    },
    {
      name: package-helm-chart
      type: helm
      helmCommands: [
          {command: "version"},
          {command: "lint ./charts/ome-crd ./charts/ome-resources ./charts/models-importer ./charts/model-serving ./charts/hf-download-agent ./charts/partner-download-agent ./charts/generic-download-agent"},
          {command: "package -d build/ ./charts/ome-crd ./charts/ome-resources ./charts/models-importer ./charts/model-serving ./charts/hf-download-agent ./charts/partner-download-agent ./charts/generic-download-agent --version "${version}}
      ]
      artifacts: [
          "**"
      ]
    },
    {
      name: publish-helm-chart
      type: publishgeneric
      dependsOn: package-helm-chart
      repository: ${shepherd_release_helm_repo}
      filePathsToPublish: [
        {
          localFile: "build/*.tgz"
          targetDir: "/"
         }
      ]
    },
    {
      name: publish_ome_fabric8_java_client_maven_artifacts
      type: publishmaven
      dependsOn: compilesource
      pomLocation: java-client
      repository: ocas-service-platform-release-maven-local
    },
    {
       name: dockerize-manager
       type: dockerizer
       dockerFile: "dockerfiles/manager.Dockerfile"
       dockerBuildPwd: "./"
       images: [
           {
               platform: linux/amd64
           }
       ]
    },
    {
        name: publish_ome_manager_image
        type: publishdocker
        dependsOn: dockerize-manager
        repository: odo-docker-signed-local
        imageName: genai-ome-manager
    },
    {
       name: dockerize-model-agent
       type: dockerizer
       dockerFile: "dockerfiles/model-agent.Dockerfile"
       dockerBuildPwd: "./"
       images: [
           {
               platform: linux/amd64
           }
       ]
    },
    {
        name: publish_model_agent
        type: publishdocker
        dependsOn: dockerize-model-agent
        repository: odo-docker-signed-local
        imageName: genai-ome-model-agent
    },
    {
       name: dockerize-model-controller
       type: dockerizer
       dockerFile: "dockerfiles/model-controller.Dockerfile"
       dockerBuildPwd: "./"
       images: [
           {
               platform: linux/amd64
           }
       ]
    },
    {
        name: publish_model_controller
        type: publishdocker
        dependsOn: dockerize-model-controller
        repository: odo-docker-signed-local
        imageName: genai-ome-model-controller
    },
    {
       name: dockerize-multinode-prober
       type: dockerizer
       dockerFile: "dockerfiles/multinode-prober.Dockerfile"
       dockerBuildPwd: "./"
       images: [
           {
               platform: linux/amd64
           }
       ]
    },
    {
        name: publish_multinode_prober
        type: publishdocker
        dependsOn: dockerize-multinode-prober
        repository: odo-docker-signed-local
        imageName: genai-multinode-prober
    },
    {
        name: dockerize_download_agent
        type: dockerizer
        dockerFile: "dockerfiles/download-agent.Dockerfile"
        dockerBuildPwd: "./"
        images: [
           {
              platform: linux/amd64
           }
        ]
    },
    {
        name: publish_download_agent_image
        type: publishdocker
        dependsOn: dockerize_download_agent
        repository: odo-docker-signed-local
        imageName: genai-ome-model-download-agent
    },
    {
        name: dockerize_ome_agent
        type: dockerizer
        dockerFile: "dockerfiles/ome-agent.Dockerfile"
        dockerBuildPwd: "./"
        images: [
           {
              platform: linux/amd64
           }
        ]
    },
    {
        name: publish_ome_agent_image
        type: publishdocker
        dependsOn: dockerize_ome_agent
        repository: odo-docker-signed-local
        imageName: genai-ome-agent
    }
  ]
