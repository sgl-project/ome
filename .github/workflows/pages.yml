name: Deploy GitHub Pages

# The documentation moved to https://ome-project.org/docs. This publishes the
# pages that forward there from the old address, ome-projects.github.io/ome.
# scripts/legacy-site.ts in ome-projects/ome-docs writes them from its
# redirects.json.

on:
  # Merging a change to this workflow publishes right away; the daily run
  # picks up pages that move in ome-docs.
  push:
    branches: [main]
    paths: ['.github/workflows/pages.yml']
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ome-projects/ome-docs
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Write the forwarding pages
        run: node --experimental-strip-types scripts/legacy-site.ts "$RUNNER_TEMP/site"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
