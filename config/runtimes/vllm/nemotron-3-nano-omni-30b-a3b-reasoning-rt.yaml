apiVersion: ome.io/v1beta1
kind: ClusterServingRuntime
metadata:
  name: vllm-nemotron-3-nano-omni-30b-a3b-reasoning
spec:
  disabled: false
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"
  labels:
    logging-forward: enabled
  tolerations:
    - key: "nvidia.com/gpu"
      operator: "Exists"
      effect: "NoSchedule"
  volumes:
    - name: dshm
      emptyDir:
        medium: Memory
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node.kubernetes.io/instance-type
                operator: In
                values:
                  - BM.GPU.A100-v2.8
                  - BM.GPU.H100.8
  supportedModelFormats:
    - modelFramework:
        name: transformers
        version: "4.55.4"
      modelFormat:
        name: safetensors
        version: "1.0.0"
      modelArchitecture: NemotronH_Nano_Omni_Reasoning_V3
      autoSelect: true
      priority: 1
      version: "1.0.0"
  modelSizeRange:
    min: 29B
    max: 31B
  protocolVersions:
    - openAI
  containers:
    - name: ome-container
      image: ord.ocir.io/idqj093njucb/official-vllm-openai:101584a
      ports:
        - containerPort: 8080
          name: http1
          protocol: TCP
      command:
        - /bin/bash
        - '-lc'
        - --
      args:
        - |
          vllm serve "$MODEL_PATH" \
          --host 0.0.0.0 \
          --port 8080 \
          --served-model-name="vllm-model" \
          --enable-chunked-prefill \
          --gpu-memory-utilization 0.9 \
          --max-model-len 131072 \
          --media-io-kwargs='{"video":{"num_frames":512,"fps":1}}' \
          --tensor-parallel-size 1 \
          --trust-remote-code \
          --video-pruning-rate 0.5 \
          --reasoning-parser nemotron_v3 \
          --tool-call-parser qwen3_coder \
          --enable-auto-tool-choice \
          --max-num-seqs 256
      volumeMounts:
        - mountPath: /dev/shm
          name: dshm
      resources:
        requests:
          cpu: 40
          memory: 120Gi
          nvidia.com/gpu: 1
        limits:
          cpu: 40
          memory: 120Gi
          nvidia.com/gpu: 1

      readinessProbe:
        httpGet:
          path: /health
          port: 8080
        failureThreshold: 3
        successThreshold: 1
        periodSeconds: 60
        timeoutSeconds: 200

      livenessProbe:
        httpGet:
          path: /health
          port: 8080
        failureThreshold: 5
        successThreshold: 1
        periodSeconds: 60
        timeoutSeconds: 60

      startupProbe:
        httpGet:
          path: /health
          port: 8080
        failureThreshold: 150
        successThreshold: 1
        periodSeconds: 6
        initialDelaySeconds: 60
        timeoutSeconds: 30
