apiVersion: ome.io/v1beta1
kind: ClusterServingRuntime
metadata:
  name: vllm-serving-runtime-large-pp
spec:
  pipelineParallelism: true
  annotations:
    prometheus.ome.io/port: '8080'
    prometheus.ome.io/path: "/metrics"
    ray.io/overwrite-container-cmd: "true"
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node.kubernetes.io/instance-type
                operator: In
                values:
                  - BM.GPU.B4.8
                  - BM.GPU4.8
                  - BM.GPU.A100-v2.8
                  - BM.GPU.H100.8
  supportedModelFormats:
    - name: safetensors
      modelType: transformer
      modelArchitecture: LlamaForCausalLM
      version: "1"
      autoSelect: true
      priority: 1
  volumes:
    - name: dshm
      emptyDir:
        medium: Memory
    - emptyDir: { }
      name: log-volume
  protocolVersions:
    - openAI
  containers:
    - name: ome-container
      image: fra.ocir.io/idqj093njucb/official-vllm-openai:bd70013
      command:
        - /bin/bash
        - '-lc'
        - --
      args:
        - |
          ulimit -n 65536;
          eval "$KUBERAY_GEN_RAY_START_CMD" &
          (while ! ray status | grep -q '0.0/16.0 GPU'; do echo 'Waiting for GPUs to be available...'; sleep 2; done;
          python3 -m  vllm.entrypoints.openai.api_server --port=8000 --disable-log-stats --model="$MODEL_PATH" --disable-log-requests --served-model-name=vllm-model --tensor-parallel-size=8 --pipeline-parallel-size=2 --enable-chunked-prefill) &
          wait
      volumeMounts:
        - mountPath: /dev/shm
          name: dshm
        - mountPath: /tmp/ray
          name: log-volume
      resources:
        requests:
          cpu: 128
          memory: 216Gi
          nvidia.com/gpu: 8
        limits:
          cpu: 128
          memory: 216Gi
          nvidia.com/gpu: 8

      livenessProbe:
        exec:
          command:
            - sh
            - '-c'
            - echo success
        initialDelaySeconds: 10
        periodSeconds: 10
      readinessProbe:
        exec:
          command:
            - sh
            - '-c'
            - echo success
        initialDelaySeconds: 10
        periodSeconds: 10