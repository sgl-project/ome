apiVersion: ome.io/v1beta1
kind: ClusterServingRuntime
metadata:
  name: sglang-xsmall-text-generation
spec:
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"
  labels:
    logging-forward: enabled
    sidecar.istio.io/inject: 'true'
  tolerations:
    - key: "nvidia.com/gpu"
      operator: "Exists"
      effect: "NoSchedule"
  volumes:
    - name: dshm
      emptyDir:
        medium: Memory
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node.kubernetes.io/instance-type
                operator: In
                values:
                  - BM.GPU.B4.8
                  - BM.GPU4.8
                  - BM.GPU.A100-v2.8
                  - BM.GPU.H100.8
  supportedModelFormats:
    - name: safetensors
      modelType: transformer
      modelArchitecture: LlamaForCausalLM
      version: "1"
      autoSelect: true
      priority: 1
    - name: safetensors
      modelType: transformer
      modelArchitecture: MistralForCausalLM
      version: "1"
      autoSelect: true
      priority: 1
  modelSizeRange:
    min: 128B
    max: 60B
  protocolVersions:
    - openAI
  containers:
    - name: ome-container
      image: phx.ocir.io/idqj093njucb/sglang:a95d558
      ports:
        - containerPort: 8080
          name: http1
          protocol: TCP
      command:
        - /bin/bash
        - '-lc'
        - --
      args:
        - |
          python3 -m sglang.launch_server \
          --port=8080 \
          --model-path="$MODEL_PATH" \
          --tp-size=1 \
      volumeMounts:
        - mountPath: /dev/shm
          name: dshm
      resources:
        requests:
          cpu: 10
          memory: 160Gi
          nvidia.com/gpu: 1
        limits:
          cpu: 10
          memory: 160Gi
          nvidia.com/gpu: 1

      readinessProbe:
        httpGet:
          path: /health_generate
          port: 8080
        failureThreshold: 3
        successThreshold: 1
        periodSeconds: 60
        timeoutSeconds: 200

      livenessProbe:
        httpGet:
          path: /health
          port: 8080
        failureThreshold: 5
        successThreshold: 1
        periodSeconds: 60
        timeoutSeconds: 60

      startupProbe:
        httpGet:
          path: /health_generate
          port: 8080
        failureThreshold: 150
        successThreshold: 1
        periodSeconds: 6
        initialDelaySeconds: 60
        timeoutSeconds: 30