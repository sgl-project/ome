apiVersion: ome.io/v1beta1
kind: ClusterServingRuntime
metadata:
  name: srt-gpt-oss-120b
spec:
  disabled: false
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"
  labels:
    logging-forward: enabled
  tolerations:
    - key: "nvidia.com/gpu"
      operator: "Exists"
      effect: "NoSchedule"
  volumes:
    - name: dshm
      emptyDir:
        medium: Memory
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node.kubernetes.io/instance-type
                operator: In
                values:
                  - BM.GPU.A100-v2.8
                  - BM.GPU.H100.8
  supportedModelFormats:
    - modelFramework:
        name: transformers
        version: "4.55.0"
      modelFormat:
        name: safetensors
        version: "1.0.0"
      modelArchitecture: GptOssForCausalLM
      autoSelect: true
      priority: 1
  modelSizeRange:
    min: 115B
    max: 125B
  protocolVersions:
    - openAI
  containers:
    - name: ome-container
      image: ord.ocir.io/idqj093njucb/official-sgl:v0.5.9-smg-b367912d
      ports:
        - containerPort: 8080
          name: http1
          protocol: TCP
      command:
        - /bin/bash
        - '-lc'
        - --
      args:
        - |
          python -m sglang.launch_server \
          --model-path="$MODEL_PATH" \
          --host 127.0.0.1 \
          --port 31000 \
          --grpc-mode \
          --tp-size=2 \
          --enable-metrics \
          --log-requests \
          --log-requests-level=1 \
          --served-model-name="gpt-oss-120b" &
          sleep 120 && \
          python -m smg.launch_router \
          --worker-urls grpc://127.0.0.1:31000 \
          --host 0.0.0.0 \
          --port={{ .Values.sglang.port }} \
          --reasoning-parser=gpt-oss \
          --log-json
      volumeMounts:
        - mountPath: /dev/shm
          name: dshm
      resources:
        requests:
          cpu: 30
          memory: 256Gi
          nvidia.com/gpu: 2
        limits:
          cpu: 30
          memory: 256Gi
          nvidia.com/gpu: 2

      readinessProbe:
        httpGet:
          path: /health_generate
          port: 8080
        failureThreshold: 3
        successThreshold: 1
        periodSeconds: 60
        timeoutSeconds: 200

      livenessProbe:
        httpGet:
          path: /health
          port: 8080
        failureThreshold: 5
        successThreshold: 1
        periodSeconds: 60
        timeoutSeconds: 60

      startupProbe:
        httpGet:
          path: /health_generate
          port: 8080
        failureThreshold: 150
        successThreshold: 1
        periodSeconds: 6
        initialDelaySeconds: 60
        timeoutSeconds: 30