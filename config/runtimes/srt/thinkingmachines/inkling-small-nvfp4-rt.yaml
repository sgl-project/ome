apiVersion: ome.io/v1beta1
kind: ClusterServingRuntime
metadata:
  name: srt-inkling-small-nvfp4
spec:
  acceleratorRequirements:
    acceleratorClasses:
      - nvidia-b200-8
  disabled: false
  supportedModelFormats:
    - modelFramework:
        # Inkling does not declare a transformers_version in config.json.
        name: transformers
      modelFormat:
        name: safetensors
        version: "1.0.0"
      autoSelect: true
      modelArchitecture: InklingForConditionalGeneration
      version: "1.0.0"
      quantization: nvfp4
      priority: 1
      acceleratorConfig:
        nvidia-b200-8:
          tensorParallelismOverride:
            tensorParallelSize: 8
  modelSizeRange:
    min: 250B
    max: 300B
  protocolVersions:
    - openAI
  routerConfig:
    annotations:
      prometheus.io/path: /metrics
      prometheus.io/port: "29000"
      prometheus.io/scrape: "true"
    labels:
      logging-forward: enabled
    runner:
      name: router
      image: ghcr.io/lightseekorg/smg:nightly-20260731-e3890dd
      terminationMessagePolicy: FallbackToLogsOnError
      ports:
        - containerPort: 8080
          name: http
          protocol: TCP
      resources:
        requests:
          cpu: "1"
          memory: 2Gi
        limits:
          cpu: "8"
          memory: 16Gi
      command:
        - smg
        - launch
      args:
        - --host
        - 0.0.0.0
        - --port
        - "8080"
        - --model-path
        - $(MODEL_PATH)
        - --service-discovery
        - --service-discovery-namespace
        - $(NAMESPACE)
        - --service-discovery-port
        - "8080"
        - --selector
        - component=engine ome.io/inferenceservice=$(INFERENCESERVICE_NAME)
        - --reasoning-parser
        - inkling
        - --tool-call-parser
        - inkling
        - --policy
        - cache_aware
        - --block-size
        - "128"
        - --enable-igw
        - --log-json
        - --disable-retries
        - --disable-circuit-breaker
      env:
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: INFERENCESERVICE_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.labels['ome.io/inferenceservice']
      readinessProbe:
        httpGet:
          path: /readiness
          port: 8080
        failureThreshold: 5
        periodSeconds: 30
        timeoutSeconds: 10
      livenessProbe:
        httpGet:
          path: /liveness
          port: 8080
        failureThreshold: 5
        periodSeconds: 30
        timeoutSeconds: 10
      startupProbe:
        httpGet:
          path: /health
          port: 8080
        failureThreshold: 5
        periodSeconds: 20
        timeoutSeconds: 10
        initialDelaySeconds: 30
  engineConfig:
    annotations:
      prometheus.io/path: /metrics
      prometheus.io/port: "8080"
      prometheus.io/scrape: "true"
    labels:
      logging-forward: enabled
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
    volumes:
      - name: dshm
        emptyDir:
          medium: Memory
    runner:
      name: ome-container
      image: ghcr.io/smg-project/smg:1.9.0-sglang-dev-inkling-dspark
      terminationMessagePolicy: FallbackToLogsOnError
      ports:
        - containerPort: 8080
          name: grpc1
          protocol: TCP
      command:
        - python3
        - -m
        - sglang.launch_server
      args:
        - --grpc-mode
        - --model-path
        - $(MODEL_PATH)
        - --host
        - 0.0.0.0
        - --port
        - "8080"
        - --trust-remote-code
        - --tp
        - "8"
        - --quantization
        - modelopt_fp4
        - --attention-backend
        - fa4
        - --page-size
        - "128"
        - --fp4-gemm-backend
        - flashinfer_trtllm
        - --moe-runner-backend
        - flashinfer_trtllm_routed
        - --enable-torch-symm-mem
        - --mamba-radix-cache-strategy
        - extra_buffer
        - --mem-fraction-static
        - "0.85"
        - --swa-full-tokens-ratio
        - "0.1"
        - --mamba-full-memory-ratio
        - "0.1"
        - --enable-multimodal
      env:
        - name: HF_HUB_OFFLINE
          value: "1"
        - name: SGLANG_ENABLE_UNIFIED_RADIX_TREE
          value: "1"
      volumeMounts:
        - mountPath: /dev/shm
          name: dshm
      resources:
        requests:
          cpu: 64
          memory: 512Gi
          nvidia.com/gpu: 8
        limits:
          cpu: 128
          memory: 512Gi
          nvidia.com/gpu: 8
      readinessProbe:
        grpc:
          port: 8080
          service: sglang.grpc.scheduler.SglangScheduler
        failureThreshold: 3
        successThreshold: 1
        periodSeconds: 60
        timeoutSeconds: 60
      livenessProbe:
        grpc:
          port: 8080
        failureThreshold: 5
        successThreshold: 1
        periodSeconds: 60
        timeoutSeconds: 60
      # ~276B of NVFP4 weights is a long cold start; 60 + 200 x 6 = 1260s.
      startupProbe:
        grpc:
          port: 8080
        failureThreshold: 200
        successThreshold: 1
        periodSeconds: 6
        initialDelaySeconds: 60
        timeoutSeconds: 30
