apiVersion: ome.io/v1beta1
kind: TrainingJob
metadata:
  name: "ft-llama-3-3-70b-instruct"
  namespace: "dac-training-test"
spec:
  runtimeRef:
    name: llama-3-3-70b-instruct-ft
  trainer:
    image: us-chicago-1.ocir.io/idqj093njucb/ocasgs-peft:0.2.16
  modelConfig:
    inputModel: llama-3-3-70b-instruct
  datasets:
    storageUri: oci://n/idqj093njucb/b/beiwen_test/o/sales_pitch_generation_train.jsonl
  hyperparameterConfig:
    method: "bayes"
    metric:
      name: test-metric
      goal: maximize
    parameters:
      {
        "strategy": "lora",
        "trainingBatchSize": "16",
        "totalTrainingEpochs": "1",
        "earlyStoppingPatience": "6",
        "earlyStoppingThreshold": "0.01",
        "learningRate": "0.01",
        "logModelMetricsIntervalInSteps": "10",
        "loraR": "8",
        "loraAlpha": "32",
        "loraDropout": "0.1"
      }