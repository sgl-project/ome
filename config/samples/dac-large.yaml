apiVersion: ome.io/v1beta1
kind: DedicatedAICluster
metadata:
  name: dac-large
spec:
  count: 1
  profile: large
  resources:
    requests:
      cpu: 20
      memory: 240Gi
      nvidia.com/gpu: 8
    limits:
      cpu: 20
      memory: 240Gi
      nvidia.com/gpu: 8
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: beta.kubernetes.io/instance-type
            operator: In
            values:
            - BM.GPU.H100.8

