---
apiVersion: ome.io/v1beta1
kind: BenchmarkJob
metadata:
  name: router-benchmark-llama-3-2-1b-instruct
  namespace: isvc-router-test-1
spec:
  podOverride:
    env: 
      - name: GENAI_BENCH_LOGGING_LEVEL
        value: "DEBUG"
    image: "phx.ocir.io/idqj093njucb/genai-bench:0.1.132"
  endpoint:
    inferenceService:
      name: llama-3-2-1b-instruct
      namespace: isvc-router-test-1
  task: text-to-text
  trafficScenarios:
    - "N(480,240)/(300,150)"
    - "D(100,100)"
    - "D(100,1000)"
    - "D(2000,200)"
    - "D(7800,200)"
    - "D(16000,200)"
    - "D(32000,200)"
    - "D(64000,200)"
    - "D(128000,200)"
  numConcurrency:
    - 1
    - 2
    - 4
    - 8
    - 16
    - 32
    - 64
    - 128
    - 256
  maxTimePerIteration: 5
  maxRequestsPerIteration: 100
  additionalRequestParams:
    temperature: "0.0"
  outputLocation:
    storageUri: "oci://n/idqj093njucb/b/ome-benchmark-results/o/router-benchmark-llama-3-2-1b-instruct"
    parameters:
      auth: "instance_principal"
      region: "eu-frankfurt-1"