apiVersion: ome.io/v1beta1
kind: DedicatedAIClusterProfile
metadata:
  name: large
spec:
  count: 1
  resources:
    requests:
      cpu: 20
      memory: 240Gi
      nvidia.com/gpu: 8
    limits:
      cpu: 20
      memory: 240Gi
      nvidia.com/gpu: 8
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: beta.kubernetes.io/instance-type
            operator: In
            values:
            - BM.GPU.H100.8
