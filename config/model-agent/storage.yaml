apiVersion: v1
kind: PersistentVolume
metadata:
  name: ome-model-agent-pv
spec:
  storageClassName: manual
  capacity:
    storage: 1000Gi
  accessModes:
  - ReadWriteOnce
  persistentVolumeReclaimPolicy: Delete
  hostPath:
    path: /raid/models
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ome-model-agent-pvc
  namespace: ome
spec:
  storageClassName: manual
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 999Gi
