apiVersion: v1
data:
  _example: "################################\n#                              #\n#
    \   EXAMPLE CONFIGURATION     #\n#                              #\n################################\n\n#
    This block is not actually functional configuration,\n# but serves to illustrate
    the available configuration\n# options and document them in a way that is accessible\n#
    to users that `kubectl edit` this config map.\n#\n# These sample configuration
    options may be copied out of\n# this example block and unindented to be in the
    data block\n# to actually change the configuration.\n \n # ======================================
    INGRESS CONFIGURATION ======================================\n # Example\n ingress:
    |-\n   {\n       \"ingressGateway\" : \"knative-serving/knative-ingress-gateway\",\n
    \      \"ingressService\" : \"istio-ingressgateway.istio-system.svc.cluster.local\",\n
    \      \"localGateway\" : \"knative-serving/knative-local-gateway\",\n       \"localGatewayService\"
    : \"knative-local-gateway.istio-system.svc.cluster.local\",\n       \"ingressDomain\"
    \ : \"example.com\",\n       \"additionalIngressDomains\": [\"additional-example.com\",
    \"additional-example-1.com\"],\n       \"ingressClassName\" : \"istio\",\n       \"domainTemplate\":
    \"{{ .Name }}-{{ .Namespace }}.{{ .IngressDomain }}\",\n       \"urlScheme\":
    \"http\",\n       \"disableIstioVirtualHost\": false,\n       \"disableIngressCreation\":
    false\n   }\n ingress: |-\n   {\n       # ingressGateway specifies the ingress
    gateway to serve external traffic.\n       # The gateway should be specified in
    format <gateway namespace>/<gateway name>\n       # NOTE: This configuration only
    applicable for serverless deployment with Istio configured as network layer.\n
    \      \"ingressGateway\" : \"knative-serving/knative-ingress-gateway\",\n \n
    \      # ingressService specifies the hostname of the ingress service.\n       #
    NOTE: This configuration only applicable for serverless deployment with Istio
    configured as network layer.\n       \"ingressService\" : \"istio-ingressgateway.istio-system.svc.cluster.local\",\n
    \n       # localGateway specifies the gateway which handles the network traffic
    within the cluster.\n       # NOTE: This configuration only applicable for serverless
    deployment with Istio configured as network layer.\n       \"localGateway\" :
    \"knative-serving/knative-local-gateway\",\n \n       # localGatewayService specifies
    the hostname of the local gateway service.\n       # NOTE: This configuration
    only applicable for serverless deployment with Istio configured as network layer.\n
    \      \"localGatewayService\" : \"knative-local-gateway.istio-system.svc.cluster.local\",\n
    \n       # ingressDomain specifies the domain name which is used for creating
    the url.\n       # If ingressDomain is empty then example.com is used as default
    domain.\n       # NOTE: This configuration only applicable for raw deployment.\n
    \      \"ingressDomain\"  : \"example.com\",\n\n       # additionalIngressDomains
    specifies the additional domain names which are used for creating the url.\n       \"additionalIngressDomains\":
    [\"additional-example.com\", \"additional-example-1.com\"]\n\n       # ingressClassName
    specifies the ingress controller to use for ingress traffic.\n       # This is
    optional and if omitted the default ingress in the cluster is used.\n       #
    https://kubernetes.io/docs/concepts/services-networking/ingress/#default-ingress-class\n
    \      # NOTE: This configuration only applicable for raw deployment.\n       \"ingressClassName\"
    : \"istio\",\n \n       # domainTemplate specifies the template for generating
    domain/url for each inference service by combining variable from:\n       # Name
    of the inference service  ( {{ .Name}} )\n       # Namespace of the inference
    service ( {{ .Namespace }} )\n       # Annotation of the inference service ( {{
    .Annotations.key }} )\n       # Label of the inference service ( {{ .Labels.key
    }} )\n       # IngressDomain ( {{ .IngressDomain }} )\n       # If domain template
    is empty the default template {{ .Name }}-{{ .Namespace }}.{{ .IngressDomain }}
    is used.\n       # NOTE: This configuration only applicable for raw deployment.\n
    \      \"domainTemplate\": \"{{ .Name }}-{{ .Namespace }}.{{ .IngressDomain }}\",\n
    \n       # urlScheme specifies the url scheme to use for inference service and
    inference graph.\n       # If urlScheme is empty then by default http is used.\n
    \      \"urlScheme\": \"http\",\n \n       # disableIstioVirtualHost controls
    whether to use istio as network layer.\n       # By default istio is used as the
    network layer. When DisableIstioVirtualHost is true, ome does not\n       # create
    the top level virtual service thus Istio is no longer required for serverless
    mode.\n       # By setting this field to true, user can use other networking layers
    supported by knative.\n       # NOTE: This configuration is only applicable to
    serverless deployment.\n       \"disableIstioVirtualHost\": false,\n\n       #
    disableIngressCreation controls whether to disable ingress creation for raw deployment
    mode.\n       \"disableIngressCreation\": false,\n \n       # pathTemplate specifies
    the template for generating path based url for each inference service.\n       #
    The following variables can be used in the template for generating url.\n       #
    Name of the inference service  ( {{ .Name}} )\n       # Namespace of the inference
    service ( {{ .Namespace }} )\n       # For more info https://bitbucket.oci.oraclecorp.com/genaicore/ome/issues/2257.\n
    \      # NOTE: This configuration only applicable to serverless deployment.\n
    \      \"pathTemplate\": \"/serving/{{ .Namespace }}/{{ .Name }}\"\n   }\n \n
    # ====================================== LOGGER CONFIGURATION ======================================\n
    # Example\n logger: |-\n   {\n       \"image\" : \"ome/agent:latest\",\n       \"memoryRequest\":
    \"100Mi\",\n       \"memoryLimit\": \"1Gi\",\n       \"cpuRequest\": \"100m\",\n
    \      \"cpuLimit\": \"1\",\n       \"defaultUrl\": \"http://default-broker\"\n
    \  }\n logger: |-\n   {\n       # image contains the default logger image uri.\n
    \      \"image\" : \"ome/agent:latest\",\n   \n       # memoryRequest is the requests.memory
    to set for the logger container.\n       \"memoryRequest\": \"100Mi\",\n       \n
    \      # memoryLimit is the limits.memory to set for the logger container.\n       \"memoryLimit\":
    \"1Gi\",\n       \n       # cpuRequest is the requests.cpu to set for the logger
    container.\n       \"cpuRequest\": \"100m\",\n       \n       # cpuLimit is the
    limits.cpu to set for the logger container.\n       \"cpuLimit\": \"1\",\n       \n
    \      # defaultUrl specifies the default logger url. If logger is not specified
    in the resource this url is used.\n       \"defaultUrl\": \"http://default-broker\"\n
    \  }\n \n # ====================================== AGENT CONFIGURATION ======================================\n
    # Example\n agent: |-\n   {\n       \"image\" : \"ome/agent:latest\",\n       \"memoryRequest\":
    \"100Mi\",\n       \"memoryLimit\": \"1Gi\",\n       \"cpuRequest\": \"100m\",\n
    \      \"cpuLimit\": \"1\"\n   }\n agent: |-\n   {\n       # image contains the
    default agent image uri.\n       \"image\" : \"ome/agent:latest\",\n   \n       #
    memoryRequest is the requests.memory to set for the agent container.\n       \"memoryRequest\":
    \"100Mi\",\n   \n       # memoryLimit is the limits.memory to set for the agent
    container.\n       \"memoryLimit\": \"1Gi\",\n       \n       # cpuRequest is
    the requests.cpu to set for the agent container.\n       \"cpuRequest\": \"100m\",\n
    \      \n       # cpuLimit is the limits.cpu to set for the agent container.\n
    \      \"cpuLimit\": \"1\"\n   }\n \n # ======================================
    DEPLOYMENT CONFIGURATION ======================================\n # Example\n
    deploy: |-\n   {\n     \"defaultDeploymentMode\": \"Serverless\"\n   }\n deploy:
    |-\n   {\n     # defaultDeploymentMode specifies the default deployment mode of
    the OME. The supported values are\n     # Serverless and RawDeployment. Users
    can override the deployment mode at service level\n     # by adding the annotation
    ome.io/deploymentMode.\n     \"defaultDeploymentMode\": \"Serverless\"\n   }\n
    \n # ====================================== METRICS CONFIGURATION ======================================\n
    # Example\n metricsAggregator: |-\n   {\n     \"enableMetricAggregation\": \"false\",\n
    \    \"enablePrometheusScraping\" : \"false\"\n   }\n # For more info see https://bitbucket.oci.oraclecorp.com/genaicore/ome/blob/master/qpext/README.md\n
    metricsAggregator: |-\n   {\n     # enableMetricAggregation configures metric
    aggregation annotation. This adds the annotation ome.io/enable-metric-aggregation
    to every\n     # service with the specified boolean value. If true enables metric
    aggregation in queue-proxy by setting env vars in the queue proxy container\n
    \    # to configure scraping ports.\n     \"enableMetricAggregation\": \"false\",\n
    \    \n     # enablePrometheusScraping configures metric aggregation annotation.
    This adds the annotation ome.io/enable-metric-aggregation to every\n     # service
    with the specified boolean value. If true, prometheus annotations are added to
    the pod. If ome.io/enable-metric-aggregation is false,\n     # the prometheus
    port is set with the default prometheus scraping port 9090, otherwise the prometheus
    port annotation is set with the metric aggregation port.\n     \"enablePrometheusScraping\"
    : \"false\"\n   }"
  agent: |-
    {
        "image" : "ome/agent:latest",
        "memoryRequest": "100Mi",
        "memoryLimit": "1Gi",
        "cpuRequest": "100m",
        "cpuLimit": "1"
    }
  deploy: |-
    {
      "defaultDeploymentMode": "RawDeployment"
    }
  ingress: |-
    {
        "ingressGateway" : "knative-serving/knative-ingress-gateway",
        "ingressService" : "istio-ingressgateway.istio-system.svc.cluster.local",
        "localGateway" : "knative-serving/knative-local-gateway",
        "localGatewayService" : "knative-local-gateway.istio-system.svc.cluster.local",
        "ingressDomain"  : "svc.cluster.local",
        "ingressClassName" : "istio",
        "domainTemplate": "{{ .Name }}.{{ .Namespace }}.{{ .IngressDomain }}",
        "urlScheme": "http",
        "disableIstioVirtualHost": false,
        "disableIngressCreation": false
    }
  logger: |-
    {
        "image" : "ome/agent:latest",
        "memoryRequest": "100Mi",
        "memoryLimit": "1Gi",
        "cpuRequest": "100m",
        "cpuLimit": "1",
        "defaultUrl": "http://default-broker"
    }
  metricsAggregator: |-
    {
      "enableMetricAggregation": "false",
      "enablePrometheusScraping" : "false"
    }
  multinodeProber: |-
    {
      "image" : "ord.ocir.io/idqj093njucb/ome/multinode-prober:v1.0-84-3-g5dff59e",
      "memoryRequest": "100Mi",
      "memoryLimit": "100Mi",
      "cpuRequest": "100m",
      "cpuLimit": "100m",
      "startupFailureThreshold": 150,
      "startupPeriodSeconds": 30,
      "startupTimeoutSeconds": 60,
      "startupInitialDelaySeconds": 200,
      "unavailableThresholdSeconds": 600
    }
  ociEtc: |-
    {
        "region" : "us-chicago-1",
        "serviceCompartmentId": "ocid1.compartment.oc1..aaaaaaaarncfmdarfvbvhfj2oknyuvvftcp4p6ra77xlswftk67kcffmm2xq",
        "serviceTenancyId": "ocid1.tenancy.oc1..aaaaaaaaygke5qlnho2slsj5kx645ve3z63k5ykxrticzaxebkuei2iqom6a",
