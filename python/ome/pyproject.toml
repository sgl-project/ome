[tool.poetry]
name = "ome"
version = "0.1"
description = "OME Python SDK"
authors = [
  "Simo Lin <simo.lin@oracle.com>",
  "Chang Su <chang.s.su@oracle.com>",
  "Arthur Cheng <arthur.cheng@oracle.com>",
  "Beiwen Guo <beiwen.guo@oracle.com>",
  "Chengjie Yao <chengjie.yao@oracle.com>",
  "David Nahm <david.nahm@oracle.com>",
  "Feng Gao <feng.fg.gao@oracle.com>",
  "Frank Zhou <haoran.zhou@oracle.com>",
  "Varun Shenoy <varun.vinayak.shenoy@oracle.com>",
  "Weiwei Zheng <weiwei.z.zheng@oracle.com>",
  "Yifeng Liu <yifeng.liu@oracle.com>",
]
readme = "README.md"
packages = [
  { include = "ome" },
]

[tool.poetry.dependencies]
python = ">=3.9,<3.13"
kubernetes = ">=23.3.0"
urllib3 = ">= 1.25.3 < 3.0.0"
python-dateutil = ">= 2.8.2"
pydantic = [{ version = "^2.5.0", python = "3.12" }, { version = ">1.0,<3", python = ">=3.9,<3.12" }]
typing-extensions = ">= 4.7.1"
pyyaml = "^6.0.0"

[tool.poetry.dev-dependencies]
pytest = ">= 7.2.1"
pytest-cov = ">= 2.8.1"
flake8 = ">= 4.0.0"
types-python-dateutil = ">= 2.8.19.14"
mypy = ">= 1.5"
ruff = "^0.5.6"
isort = "^5.13.2"
black = "^24.8.0"
pre-commit = "^3.8.0"


[tool.poetry-version-plugin]
source = "file"
file_path = "../VERSION"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = [
]

[tool.ruff.lint]
select = [
  # pycodestyle
  "E",
  # Pyflakes
  "F",
  # flake8-bugbear
  "B",
  # flake8-simplify
  "SIM",
  "G",
]
ignore = [
  # star imports
  "F405", "F403",
  # lambda expression assignment
  "E731",
  # Loop control variable not used within loop body
  "B007",
  # logging statement uses f-string
  "G004",
]

[tool.black]
line-length = 88
target-version = ['py311']
exclude = '\.venv|build|dist'

[tool.isort]
profile = "black"
sections = [
  "FUTURE",
  "LOCUST",
  "STDLIB",
  "THIRDPARTY",
  "FIRSTPARTY",
  "LOCALFOLDER",
]

[[tool.poetry.source]]
name = "oci-pypi"
url = "https://artifactory.oci.oraclecorp.com/api/pypi/global-release-pypi/simple"
priority = "primary"


[[tool.poetry.source]]
name = "oci-dev"
url = "https://artifactory.oci.oraclecorp.com/api/pypi/global-dev-pypi/simple"
priority = "primary"


[[tool.poetry.source]]
name = "ocas-dev"
url = "https://artifactory.oci.oraclecorp.com/api/pypi/ocas-service-platform-dev-pypi-local/simple/"
priority = "supplemental"

